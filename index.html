<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F2FF">
<meta name="description" content="Mila, la asistente personal de Luzmila">
<title>Mila</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* =========================================================
   Mila 9 · sistema visual «Panda violeta»
   Violeta profundo + ámbar cálido + menta, papel lavanda,
   vidrio esmerilado, Fraunces + Plus Jakarta Sans.
   ========================================================= */
:root{
  --bg:#F6F2FF; --bg2:#EEE7FF; --card:rgba(255,255,255,.80); --card-solid:#FFFFFF; --card-2:#FBF9FF;
  --ink:#21173A; --ink2:#554A72; --ink3:#8C84A6; --line:rgba(58,36,120,.10); --line2:rgba(58,36,120,.16);
  --violeta:#6C47FF; --violeta2:#8E6CFF; --lila:#B9A6FF; --niebla:#EDE7FF; --plum:#2B1650;
  --ambar:#F5A524; --menta:#1FA97A; --coral:#EE5D67; --rosa:#E06AA8; --cielo:#3A8DDE;
  --ring-bg:rgba(108,71,255,.12); --hm-empty:rgba(108,71,255,.08);
  --sh1:0 1px 2px rgba(40,20,90,.06), 0 8px 24px -10px rgba(52,26,140,.18);
  --sh2:0 2px 6px rgba(40,20,90,.06), 0 24px 48px -18px rgba(52,26,140,.35);
  --r:22px; --r2:16px; --r3:12px;
  --side:248px; --chatw:392px;
  --f-tit:"Fraunces", "Iowan Old Style", Georgia, serif; --f-ui:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#120A24; --bg2:#1A1033; --card:rgba(34,22,64,.74); --card-solid:#21153F; --card-2:#1C1236;
  --ink:#F2EDFF; --ink2:#C6BCE4; --ink3:#9086B3; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --violeta:#9B7DFF; --violeta2:#B49CFF; --lila:#7E66D9; --niebla:#2A1C52; --plum:#E9E1FF;
  --ring-bg:rgba(180,156,255,.14); --hm-empty:rgba(255,255,255,.06);
  --sh1:0 1px 2px rgba(0,0,0,.3), 0 10px 26px -12px rgba(0,0,0,.6); --sh2:0 24px 50px -20px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--violeta)}
svg{display:block}
[hidden]{display:none!important}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
p{margin:0}
:focus-visible{outline:2.5px solid var(--violeta2);outline-offset:2px;border-radius:10px}
::selection{background:var(--lila);color:#fff}

/* ---------- fondo con paisaje ---------- */
.fondo{position:fixed;inset:0 0 auto 0;height:48vh;z-index:0;pointer-events:none;-webkit-mask-image:linear-gradient(#000 45%,transparent);mask-image:linear-gradient(#000 45%,transparent);opacity:.55}
:root[data-theme="dark"] .fondo{opacity:.85}
.fondo .escena{width:100%;height:100%}
.escena .tw{animation:titila 3s ease-in-out infinite}
.escena .ff{animation:luci 6s ease-in-out infinite;filter:drop-shadow(0 0 6px #FFD36B)}
.escena .ff1{animation-delay:-1.5s;animation-duration:7s}.escena .ff2{animation-delay:-3s;animation-duration:5.5s}.escena .ff3{animation-delay:-4.5s;animation-duration:8s}
@keyframes titila{50%{opacity:.25}}
@keyframes luci{0%,100%{transform:translate(0,0);opacity:.2}30%{opacity:1}50%{transform:translate(18px,-22px);opacity:.9}80%{opacity:.3}}

/* ---------- estructura: barra superior + contenido + panel de Mila ---------- */
#app{position:relative;z-index:1;display:grid;grid-template-rows:auto 1fr;grid-template-columns:1fr 0;height:100dvh;transition:grid-template-columns .35s cubic-bezier(.3,.7,.2,1)}
.topbar{grid-column:1/-1;grid-row:1}
.main{grid-row:2;grid-column:1;position:relative;z-index:1;overflow-x:hidden;overflow-y:auto;padding:26px clamp(18px,3vw,44px) 110px;scroll-behavior:smooth;outline:none;scrollbar-gutter:stable}
.vista{max-width:1320px;margin:0 auto;animation:entra .35s ease both}
@keyframes entra{from{opacity:0;transform:translateY(8px)}}
.topbar{position:relative;z-index:30;display:flex;align-items:center;gap:14px;padding:10px clamp(14px,2.4vw,30px);background:var(--card);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-bottom:1px solid var(--line);min-height:66px}
.marca{display:flex;align-items:center;gap:8px;flex:none;text-align:left}
.marca-ic{width:46px;height:46px;flex:none;display:block}
.marca-t b{font:700 22px/1 var(--f-tit);display:block;letter-spacing:-.02em;color:var(--ink)}
.marca-t small{color:var(--ink3);font-size:11.5px}
.topnav{flex:0 1 auto;display:flex;align-items:center;justify-content:flex-start;gap:2px;min-width:0;padding:4px;border-radius:20px;background:var(--card-2);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none;max-width:max-content;margin:0 auto}
.topnav::-webkit-scrollbar{display:none}
.tn{display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:15px;color:var(--ink2);font-weight:650;font-size:13.8px;white-space:nowrap;transition:background .2s,color .2s,transform .15s}
.tn svg{width:18px;height:18px;flex:none}
.tn:hover{background:var(--niebla);color:var(--ink)}
.tn.on{background:linear-gradient(135deg,var(--violeta),var(--violeta2));color:#fff;box-shadow:0 8px 18px -8px var(--violeta)}
.tn:active{transform:scale(.96)}
.mas-wrap{position:relative}
.menu-mas{position:fixed;top:66px;right:auto;z-index:70;min-width:230px;padding:8px;border-radius:18px;background:var(--card-solid);border:1px solid var(--line2);box-shadow:var(--sh2);display:flex;flex-direction:column;gap:2px;animation:entra .2s ease both;transform:translateX(-60%)}
.mm-i{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-weight:600;text-align:left;color:var(--ink)} .mm-i:hover,.mm-i.on{background:var(--niebla)} .mm-i svg{width:19px;height:19px;color:var(--violeta)}
.top-der{display:flex;align-items:center;gap:8px;flex:none}
.sync-pill{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:650;padding:8px 12px;border-radius:13px;color:var(--ink3);background:var(--card-2);border:1px solid var(--line);white-space:nowrap}
.sync-pill svg{width:16px;height:16px}
.sync-pill.ok{color:var(--menta)} .sync-pill.err{color:var(--coral)} .sync-pill.sync svg{animation:pulsoN 1s ease-in-out infinite} .sync-pill.pausa{color:var(--ambar)}
@keyframes pulsoN{50%{opacity:.35}}
.campana{position:relative} .campana i{position:absolute;top:2px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--coral);color:#fff;font:700 10.5px/17px var(--f-ui);font-style:normal;text-align:center}
.hablar-btn{display:flex;align-items:center;gap:6px;padding:4px 14px 4px 4px;border-radius:30px;background:linear-gradient(135deg,var(--violeta),var(--violeta2));color:#fff;font-weight:700;font-size:13.5px;box-shadow:0 10px 22px -10px var(--violeta);transition:transform .15s}
.hablar-btn .mila-host{width:38px;height:38px;background:rgba(255,255,255,.9);border-radius:50%;padding:2px}
.hablar-btn:hover{transform:translateY(-2px)}
body.chat-open .hablar-btn{opacity:.5}
.yo-top{width:42px;height:42px;border-radius:50%;flex:none;padding:0}
.yo-av{display:inline-grid;place-items:center;width:100%;height:100%;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,var(--violeta),#E06AA8);color:#fff;flex:none;aspect-ratio:1}
.yo-av img{width:100%;height:100%;object-fit:cover;display:block}
.yo-av.ini b{font:600 italic 1.15em var(--f-tit)}
.yo-av.ring{box-shadow:0 0 0 3px var(--card-solid),0 0 0 6px var(--violeta2)}
.yo-top .yo-av{box-shadow:0 0 0 2px var(--card-solid),0 0 0 4px var(--lila)}
/* panel de Mila (se abre a la derecha; en pantallas grandes se acopla) */
.chat{position:fixed;right:0;top:0;bottom:0;width:min(430px,100vw);z-index:80;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--card-solid);border-left:1px solid var(--line);box-shadow:var(--sh2);transform:translateX(105%);transition:transform .35s cubic-bezier(.3,.7,.2,1);overflow:hidden}
body.chat-open .chat{transform:none}
.chat-velo{position:fixed;inset:0;z-index:79;background:rgba(18,8,40,.28);opacity:0;pointer-events:none;transition:opacity .3s}
body.chat-open .chat-velo{opacity:1;pointer-events:auto}
@media (min-width:1400px){
  body.chat-open #app{grid-template-columns:1fr 430px}
  .chat{position:relative;grid-row:2;grid-column:2;transform:none;box-shadow:none;display:none;z-index:2}
  body.chat-open .chat{display:flex} body.chat-open .chat-velo{display:none}
}
/* chat */
.chat-top{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.chat-mila{width:56px;height:56px;flex:none}
.chat-top b{font:700 19px/1.1 var(--f-tit)} .chat-top small{display:block;color:var(--ink3);font-size:12px}
.grow{flex:1;min-width:0}
.chatlog{flex:1;overflow:auto;padding:16px 14px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.chat-vacio{text-align:center;padding:30px 10px;color:var(--ink2)} .chat-vacio .mila-host{width:120px;height:120px;margin:0 auto 6px}
.chat-vacio h3{font:700 22px var(--f-tit);color:var(--ink)}
.msg{display:flex;gap:8px;max-width:100%;animation:msgIn .3s ease both}
@keyframes msgIn{from{opacity:0;transform:translateY(6px) scale(.98)}}
.msg.u{justify-content:flex-end}
.msg.u p{background:linear-gradient(135deg,var(--violeta),var(--violeta2));color:#fff;padding:10px 14px;border-radius:18px 18px 4px 18px;max-width:84%;white-space:pre-wrap;box-shadow:0 8px 18px -10px var(--violeta)}
.msg-av{width:34px;height:34px;flex:none;margin-top:2px}
.msg-b{max-width:calc(100% - 42px);display:flex;flex-direction:column;gap:8px}
.msg.a .msg-b>p{background:var(--card-solid);border:1px solid var(--line);padding:10px 14px;border-radius:18px 18px 18px 4px;box-shadow:var(--sh1);white-space:pre-wrap}
.dots{display:flex;gap:5px;align-items:center;height:20px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--lila);animation:dot 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-5px);background:var(--violeta)}}
.msg-chips{display:flex;flex-wrap:wrap;gap:6px}
.compose{padding:8px 12px 12px;border-top:1px solid var(--line)}
.sug{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.sug::-webkit-scrollbar{display:none}
.sug .chip{white-space:nowrap;font-size:12.5px}
.compose-row{display:flex;align-items:flex-end;gap:8px;background:var(--card-solid);border:1px solid var(--line2);border-radius:20px;padding:6px 6px 6px 14px;box-shadow:var(--sh1)}
.compose textarea{flex:1;border:0;outline:0;background:none;resize:none;padding:8px 0;max-height:140px;line-height:1.4}
.mic-btn,.send-btn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none;transition:transform .15s,background .2s}
.mic-btn{background:var(--niebla);color:var(--violeta)} .mic-btn svg,.send-btn svg{width:20px;height:20px}
.mic-btn.on{background:var(--coral);color:#fff;animation:pulso 1.2s infinite}
.send-btn{background:linear-gradient(135deg,var(--violeta),var(--violeta2));color:#fff}
.mic-btn:active,.send-btn:active{transform:scale(.92)}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(238,93,103,.5)}100%{box-shadow:0 0 0 14px rgba(238,93,103,0)}}

/* tarjetas dentro del chat */
.cc{background:var(--card-solid);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh1);font-size:13.5px;position:relative;overflow:hidden}
.cc small{color:var(--ink3);display:block;font-size:12px}
.cc{flex-wrap:wrap} .cc>.grow{min-width:150px} .cc-mov .cc-acc,.cc-mem .cc-acc{margin-left:auto}
.cc-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--violeta)) 16%,transparent);color:var(--c,var(--violeta));font-size:16px;flex:none}
.cc-ic svg{width:18px;height:18px}
.cc-mov b{font-size:16px}
.cc-acc{display:flex;gap:4px;flex-wrap:wrap}
.mini-btn{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:5px 9px;border-radius:9px;background:var(--niebla);color:var(--violeta)}
.mini-btn svg{width:14px;height:14px}
.cc-ev{cursor:pointer;border-left:4px solid var(--c)} .cc-fecha{text-align:center;line-height:1;padding:4px 8px;border-radius:10px;background:color-mix(in srgb,var(--c) 14%,transparent)} .cc-fecha b{font:700 20px var(--f-tit);display:block;color:var(--c)}
.cc-rec,.cc-meta,.cc-agenda,.cc-din,.cc-lista,.cc-plan{flex-direction:column;align-items:stretch}
.cc-rec{border-left:4px solid var(--c);cursor:pointer}
.cc-mem b{font-weight:600}
.cc-agenda{gap:6px}.cca-ev{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:10px;background:color-mix(in srgb,var(--c) 10%,transparent);border-left:3px solid var(--c);cursor:pointer}
.cca-ev span{font-size:12px;color:var(--ink2);min-width:54px;font-variant-numeric:tabular-nums}
.cc-plan{gap:6px}.pl-b{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-radius:12px;background:var(--niebla)}.pl-b span{font-weight:700;color:var(--violeta)}
.cc-gone{color:var(--ink3);justify-content:space-between}
.cc-tarea{padding:4px 6px}.cc-tarea .tarea{border:0;box-shadow:none;background:none;flex:1}

.tabbar{display:none}
/* ---------- piezas comunes ---------- */
.card{background:var(--card);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh1);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h3{font:700 17px/1.2 var(--f-tit);letter-spacing:-.01em}
.card-ic{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:var(--niebla);color:var(--violeta);flex:none}
.card-ic svg{width:18px;height:18px}
.card-acc{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cnt{margin-left:auto;font-size:12px;color:var(--ink3);background:var(--niebla);padding:2px 8px;border-radius:20px}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:6px 0 20px}
.cab h1{font:700 clamp(30px,4vw,42px)/1.05 var(--f-tit);letter-spacing:-.025em}
.cab p{color:var(--ink2);margin-top:6px;display:flex;align-items:center;gap:6px}
.cab-acc{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:14px;font-weight:650;font-size:14px;background:var(--card-solid);border:1px solid var(--line2);color:var(--ink);transition:transform .15s,box-shadow .2s,background .2s;white-space:nowrap;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn:hover{box-shadow:var(--sh1);transform:translateY(-1px)} .btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--violeta),var(--violeta2));color:#fff;border-color:transparent;box-shadow:0 10px 22px -12px var(--violeta)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:12px} .btn.sm svg{width:16px;height:16px}
.btn.ghost{background:transparent} .btn.danger{color:var(--coral)} .btn.full{width:100%}
.btn[disabled]{opacity:.6;pointer-events:none}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);transition:background .2s,color .2s;flex:none}
.ib:hover{background:var(--niebla);color:var(--violeta)} .ib svg{width:20px;height:20px}
.ib.sm{width:32px;height:32px;border-radius:10px} .ib.sm svg{width:17px;height:17px}
.link{display:inline-flex;align-items:center;gap:3px;color:var(--violeta);font-weight:650;font-size:13px;text-decoration:none}
.link svg{width:15px;height:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:30px;background:var(--card-solid);border:1px solid var(--line2);font-size:13px;font-weight:600;color:var(--ink2);transition:all .18s;cursor:pointer}
.chip span{font-size:11px;background:var(--niebla);color:var(--violeta);padding:1px 7px;border-radius:20px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)} :root[data-theme="dark"] .chip.on{background:var(--violeta);border-color:var(--violeta);color:#fff}
.chip.on span{background:rgba(255,255,255,.2);color:inherit}
.chip.area{border-color:color-mix(in srgb,var(--c) 40%,transparent);color:var(--c)} .chip.area.on{background:var(--c);border-color:var(--c);color:#fff}
.chip .x{margin-left:2px;font-size:15px;line-height:1;opacity:.6}
.chip svg{width:15px;height:15px}
.pt{width:9px;height:9px;border-radius:50%;display:inline-block}
.chips.sel .chip.on{background:color-mix(in srgb,var(--c,var(--violeta)) 16%,var(--card-solid));color:var(--c,var(--violeta));border-color:var(--c,var(--violeta))}
.tag{font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:20px;background:color-mix(in srgb,var(--c,var(--violeta)) 14%,transparent);color:var(--c,var(--violeta))}
.tag.alta{--c:var(--coral)}
.seg{display:inline-flex;background:var(--niebla);border-radius:14px;padding:3px;gap:2px}
.seg button{padding:7px 12px;border-radius:11px;font-size:13px;font-weight:650;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.seg button svg{width:16px;height:16px}
.seg button.on{background:var(--card-solid);color:var(--violeta);box-shadow:var(--sh1)}
.mini{font-size:12.5px;color:var(--ink3);margin-top:6px}
.mini.warn{color:var(--ambar)}
.pos{color:var(--menta)} .neg{color:var(--coral)}
.buscar{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:14px;background:var(--card-solid);border:1px solid var(--line2);min-width:170px}
.buscar svg{width:17px;height:17px;color:var(--ink3)} .buscar input{border:0;outline:0;background:none;width:100%}
.prog{height:10px;border-radius:10px;background:var(--ring-bg);overflow:hidden;margin:8px 0 2px}
.prog i{display:block;height:100%;border-radius:10px;transition:width .8s cubic-bezier(.3,.7,.2,1)}
.aviso{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--ambar) 14%,var(--card-solid));color:var(--ink);font-size:13.5px;margin-bottom:14px}
.aviso svg{width:20px;height:20px;color:var(--ambar);flex:none}
.ley{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2);margin-right:10px} .ley i{width:9px;height:9px;border-radius:3px;display:inline-block}
.ley-l{display:flex;flex-wrap:wrap;margin-top:8px}
.intro{color:var(--ink2);margin-bottom:12px}
.sub-h{font:700 16px var(--f-tit);margin:22px 0 10px;color:var(--ink2)}

/* vacíos */
.vacio{text-align:center;padding:18px 10px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:6px}
.vacio .ilus{width:150px;height:auto}
.vacio h4{font:700 17px var(--f-tit);color:var(--ink)}
.vacio p{font-size:13.5px;max-width:340px;margin-bottom:6px}

.chart .ax{font-size:10.5px;fill:var(--ink3);font-family:var(--f-ui)}

.line-v{stroke-dasharray:2000;animation:lineIn 1.4s ease both}

.chart circle{transition:r .15s} .chart circle:hover{r:6}

.toast.show{transform:translate(-50%,0);opacity:1}
.t-ic svg{width:20px;height:20px;color:var(--ambar)} .t-tx{font-size:14px;font-weight:550}
.t-undo{font-weight:700;color:var(--lila);padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.1)}
.sheet-wrap{position:fixed;inset:0;z-index:80;display:grid;place-items:center}
.sheet-bg{position:absolute;inset:0;background:rgba(22,10,48,.42);backdrop-filter:blur(3px);opacity:0;transition:opacity .25s}
.sheet{position:relative;width:min(560px,94vw);max-height:88dvh;overflow:auto;background:var(--card-solid);border-radius:26px;padding:24px;box-shadow:var(--sh2);transform:translateY(24px) scale(.97);opacity:0;transition:all .28s cubic-bezier(.3,.7,.2,1)}

.sh-h{display:flex;align-items:center;gap:10px;margin:0 40px 16px 0}

.sh-ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--violeta)) 15%,transparent);color:var(--c,var(--violeta))} .sh-ic svg{width:22px;height:22px}
.frm{display:flex;flex-direction:column;gap:14px}

.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--violeta);box-shadow:0 0 0 4px var(--ring-bg)}
.fld.fila{flex-direction:row;gap:16px}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:12px} .fila3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px}
.sh-acc{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px;padding-top:14px;border-top:1px solid var(--line)}
.monto-big{display:flex;align-items:center;gap:8px;padding:6px 16px;border-radius:18px;background:var(--niebla)}
.monto-big span{font:700 26px var(--f-tit);color:var(--violeta)} .monto-big input{border:0;outline:0;background:none;font:700 38px var(--f-tit);width:100%;color:var(--ink)}
.atajos-f{display:flex;gap:6px;flex-wrap:wrap;margin-top:-6px}
.tog{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:14px}
.tog input{display:none} .tog i{width:42px;height:24px;border-radius:20px;background:var(--line2);position:relative;transition:background .2s;flex:none}
.tog i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.tog input:checked+i{background:var(--violeta)} .tog input:checked+i::after{transform:translateX(18px)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%;background:var(--c);border:3px solid var(--card-solid);box-shadow:0 0 0 1px var(--line2);cursor:pointer;transition:transform .15s}

.iconos{display:flex;gap:6px;flex-wrap:wrap} .ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--niebla);color:var(--ink2);cursor:pointer} .ico svg{width:22px;height:22px} .ico.on{background:var(--violeta);color:#fff}
.menu-l{display:flex;flex-direction:column;gap:4px}

.mas-g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mas-i{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px;border-radius:18px;background:var(--niebla);font-weight:650;color:var(--ink)} .mas-i svg{width:28px;height:28px;color:var(--violeta)}
.enlace{font-size:13px;resize:none}
.avisos{display:flex;flex-direction:column;gap:12px} .aviso-i{display:flex;gap:10px;align-items:flex-start} .mila-mini{width:44px;height:44px;flex:none}
.aviso-i p{background:var(--niebla);padding:10px 12px;border-radius:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* ---------- Mila (panda) ---------- */
.mila-host{display:block}
.mila-svg{width:100%;height:100%;overflow:visible}
.mila-svg *{transform-box:view-box}
.mila-svg .m-float{animation:respira 3.6s ease-in-out infinite;transform-origin:100px 190px}
.mila-svg .m-cabeza{animation:ladea 7s ease-in-out infinite;transform-origin:100px 140px}
.mila-svg .m-ol{transform-origin:62px 62px;animation:orejaL 6s ease-in-out infinite}
.mila-svg .m-or{transform-origin:138px 62px;animation:orejaR 6s ease-in-out infinite .6s}
.mila-svg .m-eyes{transform-origin:100px 98px;animation:parpadeo 5.2s infinite}
.mila-svg .m-bl{transform-origin:66px 142px} .mila-svg .m-br{transform-origin:134px 142px}
.mila-svg .m-mouth{transform-box:fill-box;transform-origin:center;transition:transform .08s}
.mila-svg .m-sombra{transform-origin:100px 190px;animation:sombra 3.6s ease-in-out infinite}
.mila-svg .m-lazo{transform-origin:150px 34px}
.mila-svg .m-chispas,.mila-svg .m-corazon{transform-origin:150px 60px;animation:chispa 1.6s ease-in-out infinite}
.mila-svg .m-piensa{animation:piensa 2.2s ease-in-out infinite}
.mila-svg .m-lagrima{animation:lagrima 2.4s ease-in infinite}
.mila-svg .m-vapor{animation:vapor 1.1s ease-out infinite;transform-origin:100px 40px}
.mila-svg.talking .m-mouth{animation:hablar .24s ease-in-out infinite alternate}
.mila-svg.talking .m-br{animation:saluda .9s ease-in-out infinite}
.mila-svg.st-escuchando .m-ol,.mila-svg.st-escuchando .m-or,.mila-svg.emo-escuchando .m-ol,.mila-svg.emo-escuchando .m-or{animation:orejaAtenta 1.2s ease-in-out infinite}
.mila-svg.st-pensando .m-cabeza{animation:pensar 1.6s ease-in-out infinite}
.mila-svg.st-celebra .m-float{animation:celebra .8s cubic-bezier(.3,.7,.2,1) 3}
.mila-svg.st-celebra .m-bl{animation:brazoArribaL .4s ease-in-out 6 alternate} .mila-svg.st-celebra .m-br{animation:brazoArribaR .4s ease-in-out 6 alternate}
.mila-svg.emo-animada .m-float{animation:saltito 1.3s ease-in-out infinite}
.mila-svg.emo-enojada .m-cabeza,.mila-svg.st-enojada .m-cabeza{animation:berrinche .45s ease-in-out infinite}
.mila-svg.emo-enojada .m-bl{transform:rotate(18deg)} .mila-svg.emo-enojada .m-br{transform:rotate(-18deg)}
.mila-svg.emo-empatica .m-ol{transform:rotate(-14deg)} .mila-svg.emo-empatica .m-or{transform:rotate(14deg)} .mila-svg.emo-empatica .m-cabeza{animation:ladea 5s ease-in-out infinite}
.mila-svg.emo-carinosa .m-cabeza{animation:mimo 2.6s ease-in-out infinite}
.mila-svg.emo-orgullosa .m-float{animation:orgullo 2.4s ease-in-out infinite}
.mila-svg.emo-dormida .m-zz{opacity:1;animation:zz 2.5s ease-in-out infinite} .mila-svg.emo-dormida .m-float{animation-duration:6s} .mila-svg.emo-dormida .m-eyes{animation:none}
@keyframes respira{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985) translateY(1px)}}
@keyframes ladea{0%,100%{transform:rotate(0)}30%{transform:rotate(-3deg)}65%{transform:rotate(2.5deg)}}
@keyframes orejaL{0%,88%,100%{transform:rotate(0)}92%{transform:rotate(-12deg)}96%{transform:rotate(4deg)}}
@keyframes orejaR{0%,84%,100%{transform:rotate(0)}89%{transform:rotate(12deg)}94%{transform:rotate(-4deg)}}
@keyframes orejaAtenta{50%{transform:scale(1.12) translateY(-3px)}}
@keyframes parpadeo{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes sombra{50%{transform:scaleX(.96);opacity:.85}}
@keyframes hablar{from{transform:scaleY(.7)}to{transform:scaleY(1.6)}}
@keyframes saluda{0%,100%{transform:rotate(0)}50%{transform:rotate(-38deg)}}
@keyframes pensar{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(4deg) translateY(-2px)}}
@keyframes celebra{0%{transform:translateY(0)}40%{transform:translateY(-24px) scale(1.05,.97)}70%{transform:translateY(0) scale(1.04,.94)}100%{transform:none}}
@keyframes saltito{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes brazoArribaL{to{transform:rotate(95deg)}} @keyframes brazoArribaR{to{transform:rotate(-95deg)}}
@keyframes berrinche{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes mimo{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg) translateY(2px)}}
@keyframes orgullo{0%,100%{transform:scale(1)}50%{transform:scale(1.03) translateY(-3px)}}
@keyframes chispa{0%,100%{opacity:.4;transform:scale(.85)}50%{opacity:1;transform:scale(1.12)}}
@keyframes piensa{0%,100%{opacity:.5;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
@keyframes lagrima{0%{opacity:0;transform:translateY(-4px)}30%{opacity:1}100%{opacity:0;transform:translateY(12px)}}
@keyframes vapor{0%{opacity:0;transform:translateY(6px) scale(.6)}40%{opacity:1}100%{opacity:0;transform:translateY(-12px) scale(1.15)}}
@keyframes zz{50%{transform:translate(4px,-6px);opacity:.5}}
.confeti{position:fixed;width:8px;height:12px;border-radius:2px;z-index:95;pointer-events:none;animation:confeti 1.2s cubic-bezier(.2,.6,.3,1) forwards}
@keyframes confeti{to{transform:translate(var(--dx),calc(var(--dy) + 120px)) rotate(var(--r));opacity:0}}

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const uid8 = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const round2 = n => Math.round(n*100)/100;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const DIAS_C = ["dom","lun","mar","mié","jue","vie","sáb"];
const DIAS_L = ["D","L","M","M","J","V","S"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pymd = s => { const [y,m,d] = String(s).slice(0,10).split("-").map(Number); return new Date(y,(m||1)-1,d||1); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const addMin = (d,n) => new Date(d.getTime()+n*60000);
const startDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const startWeek = d => { const x=startDay(d); const wd=(x.getDay()+6)%7; return addDays(x,-wd); }; // lunes
const isoLocal = d => `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}:00`;
const hhmm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const h12 = d => { const h=d.getHours(), m=d.getMinutes(); const hh=((h+11)%12)+1; return `${hh}${m?":"+pad(m):""} ${h<12?"am":"pm"}`; };
const fmtDia = d => `${DIAS_C[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}`;
const fmtDiaLargo = d => `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`;
const money = n => (n<0?"−":"") + "S/ " + Math.abs(Number(n||0)).toLocaleString("es-PE",{minimumFractionDigits:2,maximumFractionDigits:2});
const money0 = n => (n<0?"−":"") + "S/ " + Math.abs(Math.round(Number(n||0))).toLocaleString("es-PE");
const todayStr = () => ymd(new Date());
const diffDays = (a,b) => Math.round((startDay(b)-startDay(a))/86400000);
const sameDay = (a,b) => ymd(a)===ymd(b);
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const capital = s => { s=String(s||"").trim().replace(/[.\s]+$/,""); return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; };
const plural = (n, a, b) => `${n} ${n===1?a:b}`;
const sum = (arr, f=x=>x) => arr.reduce((s,x)=>s+(Number(f(x))||0),0);
const groupBy = (arr, f) => arr.reduce((o,x)=>{ const k=f(x); (o[k] ||= []).push(x); return o; },{});
function relDia(fecha){
  const d = typeof fecha==="string" ? pymd(fecha) : fecha; const n = diffDays(new Date(), d);
  if(n===0) return "hoy"; if(n===1) return "mañana"; if(n===-1) return "ayer"; if(n===2) return "pasado mañana";
  if(n>2 && n<7) return "el " + DIAS[d.getDay()];
  if(n<-1 && n>-7) return `hace ${-n} días`;
  return `el ${d.getDate()} de ${MESES[d.getMonth()]}`;
}
function hace(ts){
  const s = (Date.now()-ts)/1000;
  if(s<60) return "hace un momento"; if(s<3600) return `hace ${Math.round(s/60)} min`;
  if(s<86400) return `hace ${Math.round(s/3600)} h`; const d=Math.round(s/86400); return d===1?"ayer":`hace ${d} días`;
}
function saludoHora(h=new Date().getHours()){ return h<5 ? "Hola" : h<12 ? "Buenos días" : h<19 ? "Buenas tardes" : "Buenas noches"; }
function momentoDia(h=new Date().getHours()){ return h<5?"madrugada":h<7?"amanecer":h<12?"mañana":h<17?"tarde":h<19?"atardecer":"noche"; }
// similitud simple entre textos (palabras significativas compartidas)
const STOP = new Set("el la los las un una unos unas de del al a en y o que con por para mi mis tu su sus es era fue me te se lo le les ya muy mas pero como cuando donde hoy este esta eso esa ese".split(" "));
function palabras(s){ return norm(s).replace(/[^a-z0-9ñ\s]/g," ").split(/\s+/).filter(w=>w.length>2 && !STOP.has(w)); }
function raiz(w){ return w.replace(/(aciones|acion|amientos|amiento|mente|ando|iendo|adas|idas|ados|idos|ada|ida|ado|ido|ar|er|ir|es|s)$/,"").slice(0,7); }
function simil(a, b){
  const A = new Set(palabras(a).map(raiz)), B = new Set(palabras(b).map(raiz));
  if(!A.size || !B.size) return 0; let n=0; for(const w of A) if(B.has(w)) n++;
  return n / Math.min(A.size, B.size);
}
let toastT;
function toast(msg, opts={}){
  const t = $("#toast"); if(!t) return;
  t.innerHTML = `<span class="t-ic">${opts.icon||ICON.spark}</span><span class="t-tx">${esc(msg)}</span>${opts.undo?`<button type="button" class="t-undo" data-act="undo" data-id="${esc(opts.undo)}">Deshacer</button>`:""}`;
  t.classList.remove("show"); void t.offsetWidth; t.classList.add("show"); t.hidden=false;
  clearTimeout(toastT); toastT = setTimeout(()=>{ t.classList.remove("show"); setTimeout(()=>t.hidden=true, 300); }, opts.ms || (opts.undo?6000:3200));
}

/* =========================================================
   Estado, almacenamiento y acciones

   (data/users/local/profile/...), así nada se pierde al actualizar.

const DEFAULT_PROFILE = {

  ciclo:{ recordar:false, diasAntes:2, mostrarTexto:false, sync:true, pin:"", enInicio:false },
  descanso:null, fuentes:{}, frase:{ cats:[] },
  categorias:["Comida","Pasajes","Apoyo al hogar","Mascotas","Deudas","Cuidado personal","Recargas","Estudios","Salud","Ocio","Inversión","Otros"],

const DEV_ID = (()=>{ try{ let v=localStorage.getItem("mila-dev"); if(!v){ v=Math.random().toString(36).slice(2,10); localStorage.setItem("mila-dev", v); } return v; }catch{ return "x"; } })();
const COLS = ["tareas","movimientos","memorias","notas","habitos","metas","registro","alertas","recuerdos","animo","eventos","frases","ciclo","ciclodia","media"];
const S = {
  route:"hoy", profile:structuredClone(DEFAULT_PROFILE), chat:[], loaded:{}, standalone:false,
  cal:{ status:"none", msg:"", ranges:{}, events:new Map() },
  agenda:{ view: innerWidth<760 ? "3dias" : "semana", date:new Date(), hourH: 54 },
  dinero:{ mes: ymd(new Date()).slice(0,7), cat:null, tipo:"todos", q:"" },
  tareasUI:{ filtro:"hoy", area:"", vista:"lista", q:"" },
  recUI:{ tab:"diario", emo:"", q:"" }, memUI:{ q:"", cat:"", fuente:"" }, fraseUI:{ cat:"", tab:"hoy", i:0 }, cicloUI:{ mes:null, abierto:false }, fuentesUI:{ cargando:false },
  crecerUI:{ tab:"habitos" },

  busy:false

COLS.forEach(c => S[c] = []);

let db=null, mcp=null;
const Store = {
  P:null, q:new Map(), unsubs:[],
  chain(key, fn){ const prev=this.q.get(key)||Promise.resolve(); const p=prev.catch(()=>{}).then(fn); this.q.set(key,p); return p; },
  col(c){ return this.P.collection(c); },
  async set(c,id,data){ return this.chain(c+"/"+id, ()=>this.col(c).doc(id).set(data)); },
  async update(c,id,patch){ return this.chain(c+"/"+id, ()=>this.col(c).doc(id).update(patch)); },
  async del(c,id){ return this.chain(c+"/"+id, ()=>this.col(c).doc(id).delete()); },
  async add(c,data){ const id=uid8(); await this.set(c,id,data); return id; },
  async saveProfile(patch){
    S.profile = deepMerge(S.profile, patch);
    return this.chain("profile", async ()=>{ const s=await this.P.get(); if(s.exists) await this.P.update(patch); else await this.P.set(S.profile); });
  },
  async saveChat(){ const turnos = S.chat.slice(-60).map(m=>({r:m.r, t:m.t, ts:m.ts, cards:(m.cards||[]).filter(c=>c.k!=="chips")})); return this.chain("chat", ()=>this.col("estado").doc("chat").set({turnos})); },
  subscribe(){
    COLS.forEach(c=>{
      this.unsubs.push(this.col(c).onSnapshot(snap=>{ S[c] = snap.docs.map(d=>({id:d.id, ...d.data()})); S.loaded[c]=true; render(); }));
    });
    this.unsubs.push(this.P.onSnapshot(snap=>{
      S.profile = deepMerge(structuredClone(DEFAULT_PROFILE), snap.exists ? snap.data() : {});
      if(!snap.exists && !this.created){ this.created=true; this.chain("profile", ()=>this.P.set(S.profile)); }
      S.loaded.profile = true; aplicarTema(); render();
    }));
    this.unsubs.push(this.col("estado").doc("chat").onSnapshot(snap=>{ if(snap.exists && !S.busy){ S.chat=(snap.data().turnos||[]).slice(); render(); } }));
  }
};
function deepMerge(a,b){
  if(!b || typeof b!=="object" || Array.isArray(b)) return b===undefined ? a : b;
  const out = Array.isArray(a)||typeof a!=="object"||!a ? {} : {...a};
  for(const k of Object.keys(b)) out[k] = (b[k] && typeof b[k]==="object" && !Array.isArray(b[k])) ? deepMerge(out[k]||{}, b[k]) : b[k];
  return out;
}
// db de respaldo en memoria (solo si se abre fuera de la app)
function memDb(){
  const tree={}, ls=new Set(); const notify=()=>queueMicrotask(()=>ls.forEach(f=>f()));
  const docSnap=p=>({id:p.split("/").pop(), exists:tree[p]!==undefined, data:()=>tree[p]});
  const doc=p=>({ async get(){return docSnap(p);}, async set(d){tree[p]=structuredClone(d);notify();}, async update(d){tree[p]={...tree[p],...structuredClone(d)};notify();}, async delete(){delete tree[p];notify();},
    onSnapshot(f){ const r=()=>f(docSnap(p)); ls.add(r); queueMicrotask(r); return ()=>ls.delete(r); }, collection:s=>col(p+"/"+s) });
  const col=p=>({ doc:id=>doc(p+"/"+(id||uid8())), onSnapshot(f){ const r=()=>f({docs:Object.keys(tree).filter(k=>k.split("/").slice(0,-1).join("/")===p).map(docSnap)}); ls.add(r); queueMicrotask(r); return ()=>ls.delete(r); } });
  return {doc};
}

  tesis:{n:"Tesis", c:"#D9468C", kw:/tesis|asesor|socializacion|capitulo|marco teorico|encuesta|instrumento|jurado|sustentacion/},
  practicas:{n:"Prácticas", c:"#E8912D", kw:/practica|roqaseg|oficina|reunion|jefe|turno|informe|trabajo/},
  salud:{n:"Salud", c:"#1FA97A", kw:/doctor|medic|dentista|gimnasio|gym|ejercicio|correr|caminar|yoga|terapia|cita medica|dormir|meditar/},
  personal:{n:"Personal", c:"#3A8DDE", kw:/cumple|familia|mama|papa|herman|amig|salida|cine|almuerzo|cena|viaje|iglesia|misa|compras|casa/},
  dinero:{n:"Dinero", c:"#119C9C", kw:/pago|pagar|banco|scotiabank|deuda|cuota|yape|presupuesto/},
  nutrimisi:{n:"NUTRIMISI", c:"#C2702B", kw:/nutrimisi|gato|gatit|mascota/},
  otros:{n:"Otros", c:"#8A86A6", kw:/$^/}
};
function catDe(texto, explicita){
  if(explicita){ const k=norm(explicita); const f=Object.entries(CATS).find(([id,c])=>id===k||norm(c.n)===k); if(f) return f[0]; }
  const t=norm(texto); for(const [id,c] of Object.entries(CATS)) if(c.kw.test(t)) return id; return "otros";
}
const catColor = id => (CATS[id]||CATS.otros).c;
const areaCat = a => catDe("", a) !== "otros" ? catDe("", a) : catDe(a||"");

/* ---------------- Registro de acciones (para deshacer) ---------------- */
async function logAction(texto, deshacer){
  const id = await Store.add("registro", {texto, deshacer:deshacer||null, ts:Date.now(), estado:"hecho"});
  const old = [...S.registro].sort((a,b)=>a.ts-b.ts);
  if(old.length>90) for(const o of old.slice(0, old.length-70)) Store.del("registro", o.id).catch(()=>{});
  return id;
}
async function undo(logId){
  let l = logId ? S.registro.find(x=>x.id===logId) : [...S.registro].filter(x=>x.deshacer && x.estado!=="deshecho").sort((a,b)=>b.ts-a.ts)[0];
  if(!l || !l.deshacer || l.estado==="deshecho") return {ok:false, resumen:"No hay nada reciente que deshacer."};
  const d = l.deshacer;
  try{
    if(d.op==="del") await Store.del(d.col, d.id);
    else if(d.op==="restore") await Store.set(d.col, d.id, d.data);
    else if(d.op==="restore_field") await Store.update(d.col, d.id, {[d.field]:d.data});
    else if(d.op==="cal_del"){ await Cal.call("delete_event",{eventId:d.eventId}); S.cal.events.delete(d.eventId); }
    else if(d.op==="cal_update"){ await Cal.call("update_event",{eventId:d.eventId, startTime:d.startTime, endTime:d.endTime, summary:d.summary}); Cal.invalidar(); }
    else if(d.op==="cal_restore"){ await Cal.call("create_event", d.data); Cal.invalidar(); }
    else if(d.op==="alerta_del"){ await Cal.call("delete_event",{eventId:d.eventId}).catch(()=>{}); await Store.del("alertas", d.id); S.cal.events.delete(d.eventId); }
    await Store.update("registro", l.id, {estado:"deshecho"});
    render(); return {ok:true, resumen:"Deshecho: "+l.texto};
  }catch(e){ return {ok:false, resumen:"No pude deshacerlo: "+errMsg(e)}; }
}

/* ---------------- Google Calendar ---------------- */
const CALN = "Google Calendar";
const Cal = {
  ok(){ return !!mcp && window.MilaApp?.Google?.valido(); },
  disponible(){ return !!mcp; },
  async call(tool, input){ if(!mcp) throw {code:"capability_disabled", message:"Conecta Google en Ajustes."}; const r = await mcp.callTool(CALN, tool, input); return r.payload ?? r; },
  norm(e){
    const sd = e.start?.dateTime || e.start?.date, ed = e.end?.dateTime || e.end?.date; if(!sd) return null;
    const allDay = !e.start?.dateTime;
    const ini = allDay ? pymd(sd) : new Date(sd), fin = ed ? (allDay ? pymd(ed) : new Date(ed)) : ini;
    const titulo = e.summary||"(sin título)";
    return { id:e.id, src:"g", titulo, ini, fin, allDay, link:e.htmlLink||"", meet:e.conferenceUrl||e.hangoutLink||"", notas:e.description||"", lugar:e.location||"",
      recurrente:!!e.recurringEventId, propio: e.organizer?.self ?? e.creator?.self ?? true,
      cat: catDe(titulo+" "+(e.description||""), e.extendedProperties?.private?.milaCat), alerta: /^🔔/.test(titulo) };
  },
  invalidar(){ Object.keys(S.cal.ranges).forEach(k=>S.cal.ranges[k].at=0); },
  async cargar(desde, hasta, {force=false}={}){
    if(!mcp) return [];
    const key = desde+"_"+hasta, prev=S.cal.ranges[key];
    if(prev && !force && Date.now()-prev.at < 120000) return prev.list;
    if(prev?.p) return prev.p;
    const p = (async()=>{
      try{
        let all=[], pageToken, g=0;
        do{ const r = await this.call("list_events", {startTime:`${desde}T00:00:00`, endTime:`${ymd(addDays(pymd(hasta),1))}T00:00:00`, orderBy:"startTime", pageSize:250, ...(pageToken?{pageToken}:{})});
            all = all.concat((r?.events||[]).map(e=>this.norm(e)).filter(Boolean)); pageToken=r?.nextPageToken; g++; } while(pageToken && g<4);
        for(const [id,ev] of S.cal.events){ if(ymd(ev.ini)>=desde && ymd(ev.ini)<=hasta) S.cal.events.delete(id); }
        all.forEach(ev=>S.cal.events.set(ev.id, ev));
        S.cal.ranges[key] = {at:Date.now(), list:all}; S.cal.status="ok"; S.cal.msg=""; render(); return all;
      }catch(e){ delete S.cal.ranges[key]; S.cal.status="error"; S.cal.msg=errMsg(e); render(); throw e; }
    })();
    S.cal.ranges[key] = {at:0, p}; return p;
  }
};
// eventos locales (cuando Google no está conectado) con la misma forma
function evLocal(e){ const ini=new Date(e.ini), fin=new Date(e.fin||e.ini); return {id:e.id, src:"l", titulo:e.titulo, ini, fin, allDay:!!e.allDay, notas:e.notas||"", lugar:e.lugar||"", cat:e.cat||catDe(e.titulo), rec:e.rec, propio:true}; }
function tareaComoEvento(t){ if(!t.vence || !t.hora || t.estado==="hecha") return null; const ini=new Date(`${t.vence}T${t.hora}:00`); return {id:"t:"+t.id, tid:t.id, src:"t", titulo:t.titulo, ini, fin:addMin(ini, Number(t.dur)||30), allDay:false, cat:areaCat(t.area)||catDe(t.titulo), tarea:true, prioridad:t.prioridad}; }
function eventosEntre(desde, hasta, {tareas=true}={}){
  const out = [...S.cal.events.values(), ...S.eventos.map(evLocal)];
  if(tareas) S.tareas.forEach(t=>{ const e=tareaComoEvento(t); if(e) out.push(e); });
  return out.filter(ev => ymd(ev.ini)<=hasta && ymd(ev.allDay?addDays(ev.fin,-1):ev.fin)>=desde && ev.fin>=ev.ini).sort((a,b)=>a.ini-b.ini);
}
function buscarEvento(id){ if(!id) return null; if(String(id).startsWith("t:")){ const t=S.tareas.find(x=>"t:"+x.id===id); return t?tareaComoEvento(t):null; } return S.cal.events.get(id) || (S.eventos.find(e=>e.id===id) ? evLocal(S.eventos.find(e=>e.id===id)) : null); }
function cruces(list){ const t=list.filter(x=>!x.allDay && x.fin>x.ini).sort((a,b)=>a.ini-b.ini); const out=new Set(); for(let i=0;i<t.length;i++) for(let j=i+1;j<t.length;j++){ if(t[j].ini<t[i].fin){ out.add(t[i].id); out.add(t[j].id); } else break; } return out; }

const NUMW = {cero:0,un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,
  dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,veintiun:21,veintiuno:21,veintiuna:21,veintidos:22,veintitres:23,veinticuatro:24,veinticinco:25,

  cien:100,ciento:100,doscientos:200,doscientas:200,trescientos:300,trescientas:300,cuatrocientos:400,cuatrocientas:400,quinientos:500,quinientas:500,seiscientos:600,setecientos:700,ochocientos:800,novecientos:900};
function wordsNumber(tokens, i){
  let total=0, cur=0, used=0, j=i;
  while(j<tokens.length){ const w=tokens[j];
    if(w in NUMW){ cur += NUMW[w]; used++; j++; continue; }
    if(w==="mil"){ cur=(cur||1)*1000; total+=cur; cur=0; used++; j++; continue; }
    if(w==="y" && used && j+1<tokens.length && tokens[j+1] in NUMW){ j++; continue; }
    break; }
  return used ? {value: total+cur, next:j} : null;
}
function parseMonto(text, {suelto=true}={}){
  const t = norm(text).replace(/s\/\.?/g," s/ ");
  let m = t.match(/s\/\s*(\d+(?:[.,]\d{1,2})?)/) || t.match(/(\d+(?:[.,]\d{1,2})?)\s*(?:soles?|lucas?|so\b|pen\b|mangos?)/);
  if(m){ let v=parseFloat(m[1].replace(",",".")); const after=t.slice(t.indexOf(m[0])+m[0].length); const c=after.match(/^\s*(?:con\s+)?(\d{1,2})\s*(?:centimos|cent)/)||after.match(/^\s*con\s+(\d{1,2})\b/); if(c) v+=Number(c[1])/100; return round2(v); }
  const tokens = t.replace(/[^a-z0-9ñ\s]/g," ").split(/\s+/).filter(Boolean);
  for(let i=0;i<tokens.length;i++){
    const r = wordsNumber(tokens,i); if(!r) continue;
    let v=r.value, j=r.next; const isMoney=/^(soles?|lucas?|mangos?)$/.test(tokens[j]||""); if(isMoney) j++;
    if(tokens[j]==="con"){ const d=wordsNumber(tokens,j+1)||(/^\d+$/.test(tokens[j+1]||"")?{value:Number(tokens[j+1])}:null); if(d && d.value<100) v+=d.value/100; }
    if(tokens[j]==="y" && tokens[j+1]==="medio") v+=0.5;
    if(isMoney) return round2(v); i=r.next-1;
  }
  if(!suelto) return null;
  m = t.match(/(?:^|[^\d:])(\d+(?:[.,]\d{1,2})?)(?![\d:])(?!\s*(?:am|pm|de la|hrs?|horas?|minutos?|dias?|semanas?|de (?:enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)))/);
  return m ? round2(parseFloat(m[1].replace(",","."))) : null;
}

   Expresiones: neutral, alegre, animada, orgullosa, carinosa, pensativa, escuchando,
   sorprendida, preocupada, empatica, enojada (juguetona), dormida.
   Estados (animación del cuerpo): idle, escuchando, pensando, hablando, celebra, enojada. */
const PANDA_INK = "#1E1A26";
function milaFace(emo){
  const K = PANDA_INK;
  const ojo = (cx, cy, {dx=0, dy=0, r=6.4, brillo=true}={}) => `<g class="m-eye"><circle cx="${cx+dx}" cy="${cy+dy}" r="${r}" fill="#fff"/><circle cx="${cx+dx+.6}" cy="${cy+dy+.6}" r="${r*.7}" fill="#241C2E"/>${brillo?`<circle cx="${cx+dx+2.4}" cy="${cy+dy-2}" r="${r*.32}" fill="#fff"/>`:""}</g>`;
  const feliz = (cx, cy) => `<path d="M${cx-6.5} ${cy+2.5} Q${cx} ${cy-6} ${cx+6.5} ${cy+2.5}" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round"/>`;
  const cerrado = (cx, cy) => `<path d="M${cx-6.5} ${cy-1} Q${cx} ${cy+5} ${cx+6.5} ${cy-1}" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;
  const estrella = (cx, cy) => `<g class="m-eye"><circle cx="${cx}" cy="${cy}" r="7" fill="#fff"/><circle cx="${cx+.5}" cy="${cy+.5}" r="5" fill="#241C2E"/><path d="M${cx+2} ${cy-4.6} l1.1 2.3 2.4.4-1.8 1.7.4 2.4-2.1-1.1-2.1 1.1.4-2.4-1.8-1.7 2.4-.4Z" fill="#FFE08A"/></g>`;
  const L=[79,97], R=[121,97];
  const boca = {
    smile:`<path class="m-mouth" d="M92 123 Q96 128 100 124 Q104 128 108 123" stroke="${K}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`,
    open:`<path class="m-mouth" d="M91 122 Q100 136 109 122 Q100 126 91 122Z" fill="#6B2340"/><path d="M95 128 Q100 132 105 128 Q100 127 95 128Z" fill="#FF8FAE"/>`,
    grande:`<path class="m-mouth" d="M88 121 Q100 141 112 121 Q100 125 88 121Z" fill="#6B2340"/><path d="M93 130 Q100 137 107 130 Q100 128 93 130Z" fill="#FF8FAE"/>`,
    o:`<ellipse class="m-mouth" cx="100" cy="126" rx="4.6" ry="5.4" fill="#6B2340"/>`,
    lado:`<path class="m-mouth" d="M94 125 Q101 122 107 125" stroke="${K}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`,
    onda:`<path class="m-mouth" d="M91 126 Q95 122 100 126 Q105 130 109 126" stroke="${K}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`,
    triste:`<path class="m-mouth" d="M93 128 Q100 122 107 128" stroke="${K}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`,
    puchero:`<path class="m-mouth" d="M94 127 Q100 123 106 127 Q100 125.5 94 127Z" stroke="${K}" stroke-width="2.4" fill="${K}" stroke-linejoin="round"/>`,
    dormida:`<path class="m-mouth" d="M96 124 Q100 127 104 124" stroke="${K}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`
  };
  let ojos, mouth, cejas="", extra="";
  switch(emo){
    case "alegre": ojos = feliz(...L)+feliz(...R); mouth = boca.open; break;
    case "animada": ojos = estrella(...L)+estrella(...R); mouth = boca.grande; extra = `<g class="m-chispas"><path d="M44 62l2.5-6 2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5Z" fill="#FFD36B"/><path d="M152 58l2-4.5 2 4.5 4.5 2-4.5 2-2 4.5-2-4.5-4.5-2Z" fill="#C9B8FF"/></g>`; break;
    case "orgullosa": ojos = feliz(...L)+feliz(...R); mouth = boca.smile; extra = `<path class="m-chispas" d="M150 66l2-4.5 2 4.5 4.5 2-4.5 2-2 4.5-2-4.5-4.5-2Z" fill="#FFD36B"/>`; break;
    case "carinosa": ojos = feliz(...L)+feliz(...R); mouth = boca.smile; extra = `<path class="m-corazon" d="M150 58c-3.2-5.4-11-3.2-11 2.6 0 5.6 11 11.4 11 11.4s11-5.8 11-11.4c0-5.8-7.8-8-11-2.6Z" fill="#FF7FA8"/>`; break;
    case "pensativa": ojos = ojo(...L,{dx:2.4,dy:-2.6})+ojo(...R,{dx:2.4,dy:-2.6}); mouth = boca.lado; extra = `<g class="m-piensa" fill="#CFC4FF"><circle cx="150" cy="70" r="3"/><circle cx="158" cy="60" r="4.4"/><circle cx="168" cy="47" r="6.4"/></g>`; break;
    case "escuchando": ojos = ojo(...L,{r:6.8})+ojo(...R,{r:6.8}); mouth = boca.o; break;
    case "sorprendida": ojos = ojo(...L,{r:7.2})+ojo(...R,{r:7.2}); mouth = boca.o; cejas = `<path d="M70 72 Q78 66 86 70M114 70 Q122 66 130 72" stroke="${K}" stroke-width="3" fill="none" stroke-linecap="round"/>`; break;
    case "preocupada": ojos = ojo(...L)+ojo(...R); mouth = boca.onda; cejas = `<path d="M70 75 Q78 73 86 70M114 70 Q122 73 130 75" stroke="${K}" stroke-width="3" fill="none" stroke-linecap="round"/>`; break;
    case "empatica": ojos = ojo(...L,{r:7,dy:1})+ojo(...R,{r:7,dy:1}); mouth = boca.triste; cejas = `<path d="M70 74 Q78 70 86 68M114 68 Q122 70 130 74" stroke="${K}" stroke-width="2.8" fill="none" stroke-linecap="round"/>`; extra = `<path class="m-lagrima" d="M128 110 q3 5 0 8 q-3-3 0-8Z" fill="#9EC9FF"/>`; break;
    case "enojada": ojos = ojo(...L,{dy:1.6,r:6})+ojo(...R,{dy:1.6,r:6}); mouth = boca.puchero;
      cejas = `<path d="M68 72 L87 80M132 72 L113 80" stroke="${K}" stroke-width="4.4" stroke-linecap="round"/>`;
      extra = `<g class="m-vapor" fill="#fff" stroke="#E4DCF5" stroke-width="1.5"><circle cx="34" cy="42" r="6"/><circle cx="26" cy="34" r="4.4"/><circle cx="166" cy="42" r="6"/><circle cx="174" cy="34" r="4.4"/></g>`; break;
    case "dormida": ojos = cerrado(...L)+cerrado(...R); mouth = boca.dormida; break;
    default: ojos = ojo(...L)+ojo(...R); mouth = boca.smile;

  return `${cejas}<g class="m-eyes">${ojos}</g>${mouth}${extra}`;

/* =========================================================

const tipAttr = t => `data-tip="${esc(t)}"`;
function ring(p, {size=64, stroke=8, color="var(--violeta)", bg="var(--ring-bg)", label="", sub=""}={}){
  const r=(size-stroke)/2, c=2*Math.PI*r, v=clamp(p,0,1);
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${bg}" stroke-width="${stroke}"/>
    <circle class="ring-v" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-v)}" transform="rotate(-90 ${size/2} ${size/2})" style="--c:${c}"/></svg>
    <div class="ring-l"><b>${label}</b>${sub?`<small>${sub}</small>`:""}</div></div>`;
}
function barChart(data, {h=150, color="var(--violeta)", fmt=v=>v, max=null, highlight=-1, goal=null}={}){
  // data: [{l, v, tip?, c?}]
  if(!data.length) return "";
  const W=Math.max(280, data.length*36), pb=22, pt=10, mx = max ?? Math.max(1, ...data.map(d=>d.v), goal||0);
  const bw = Math.min(26, (W/data.length)*0.6), step = W/data.length;
  const bars = data.map((d,i)=>{ const bh = (h-pb-pt)*(d.v/mx); const x = i*step + (step-bw)/2; const y = h-pb-bh;
    return `<g class="bar ${i===highlight?"hl":""}" ${tipAttr(d.tip || `${d.l}: ${fmt(d.v)}`)}><rect x="${i*step}" y="${pt}" width="${step}" height="${h-pb-pt}" fill="transparent"/>
      <rect class="bar-v" x="${x}" y="${y}" width="${bw}" height="${Math.max(d.v>0?3:0,bh)}" rx="${Math.min(7,bw/2)}" fill="${d.c||color}" style="--d:${i*30}ms"/>
      <text x="${i*step+step/2}" y="${h-6}" text-anchor="middle" class="ax">${esc(d.l)}</text></g>`; }).join("");
  const g = goal ? `<line x1="0" x2="${W}" y1="${h-pb-(h-pb-pt)*(goal/mx)}" y2="${h-pb-(h-pb-pt)*(goal/mx)}" class="goal"/>` : "";
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" style="height:${h}px">${g}${bars}</svg>`;
}
function lineChart(series, {h=160, labels=[], fmt=v=>v, area=true, max=null, min=0}={}){
  // series: [{name, color, values:[]}]
  const n = Math.max(...series.map(s=>s.values.length)); if(!n) return "";
  const W=560, pl=6, pr=6, pt=12, pb=24; const all = series.flatMap(s=>s.values.filter(v=>v!=null));
  const mx = max ?? Math.max(1, ...all), mn = min ?? Math.min(...all);
  const X = i => pl + (n===1?0.5:i/(n-1))*(W-pl-pr), Y = v => pt + (1-(v-mn)/((mx-mn)||1))*(h-pt-pb);
  const path = vals => { let d="", prev=null; vals.forEach((v,i)=>{ if(v==null){ prev=null; return; } const x=X(i), y=Y(v); if(prev){ const cx=(prev[0]+x)/2; d+=` C${cx} ${prev[1]} ${cx} ${y} ${x} ${y}`; } else d+=` M${x} ${y}`; prev=[x,y]; }); return d; };
  const grid = [0,.5,1].map(f=>`<line x1="${pl}" x2="${W-pr}" y1="${pt+f*(h-pt-pb)}" y2="${pt+f*(h-pt-pb)}" class="grid"/>`).join("");
  const lines = series.map((s,si)=>{ const d=path(s.values); const last=[...s.values].map((v,i)=>[v,i]).filter(x=>x[0]!=null).pop();
    const ar = area && si===0 && d ? `<path d="${d} L${X(last?.[1]??0)} ${h-pb} L${X(s.values.findIndex(v=>v!=null))} ${h-pb}Z" fill="${s.color}" opacity=".12"/>` : "";
    return `${ar}<path class="line-v" d="${d}" fill="none" stroke="${s.color}" stroke-width="3" stroke-linecap="round" ${s.dash?'stroke-dasharray="6 6"':""}/>` +
      s.values.map((v,i)=> v==null?"" : `<circle cx="${X(i)}" cy="${Y(v)}" r="${i===last?.[1]?5:3.2}" fill="${s.color}" stroke="var(--card)" stroke-width="2" ${tipAttr(`${s.name}${labels[i]?" · "+labels[i]:""}: ${fmt(v)}`)}/>`).join(""); }).join("");
  const lab = labels.map((l,i)=> (n<=8 || i%Math.ceil(n/8)===0 || i===n-1) ? `<text x="${X(i)}" y="${h-6}" text-anchor="middle" class="ax">${esc(l)}</text>` : "").join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" style="height:${h}px">${grid}${lines}${lab}</svg>`;
}
function donut(parts, {size=170, stroke=24, center="", sub="", active=null, fmt=money}={}){
  // parts: [{l, v, c}]
  const tot = sum(parts, p=>p.v); const r=(size-stroke)/2, C=2*Math.PI*r; let off=0;
  const segs = tot ? parts.filter(p=>p.v>0).map(p=>{ const len = C*p.v/tot; const s = `<circle class="seg ${active&&active!==p.l?"dim":""}" data-l="${esc(p.l)}" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${p.c}" stroke-width="${stroke}" stroke-dasharray="${Math.max(0,len-2)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})" ${tipAttr(`${p.l}: ${fmt(p.v)} (${Math.round(p.v/tot*100)}%)`)}/>`; off+=len; return s; }).join("")
    : `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--ring-bg)" stroke-width="${stroke}"/>`;
  return `<div class="donut" style="width:${size}px;height:${size}px"><svg viewBox="0 0 ${size} ${size}">${segs}</svg><div class="donut-c"><b>${center}</b><small>${sub}</small></div></div>`;
}
function heatmap(valores, {semanas=17, color="#7C5CFF", fin=new Date(), fmt=(d,v)=>`${fmtDia(d)}: ${v}`, max=null}={}){
  // valores: {"YYYY-MM-DD": número}
  const end = startDay(fin), start = addDays(startWeek(end), -(semanas-1)*7);

(function(){

/* =========================================================

   ========================================================= */
const WD = ["domingo","lunes","martes","miercoles","jueves","viernes","sabado"];
const MES_RE = "enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre";
function nextWeekday(base, wd, strictlyAfter=false){ const d=startDay(base); let diff=(wd-d.getDay()+7)%7; if(diff===0 && strictlyAfter) diff=7; return addDays(d,diff); }
// Devuelve {desde, hasta, single, label} o null
function parseFecha(text, base=new Date()){
  const t = " "+norm(text)+" ";
  const day = d => ({desde:ymd(d), hasta:ymd(d), single:true, label:relDia(d)});
  let m;
  if(/pasado manana/.test(t)) return day(addDays(base,2));
  if(/anteayer|antier/.test(t)) return day(addDays(base,-2));
  if(/\bmanana\b/.test(t) && !/\b(la|de la|en la|por la|esta|en las)\s+manana\b/.test(t)) return day(addDays(base,1));
  if(/\bayer\b/.test(t)) return day(addDays(base,-1));
  if((m=t.match(/\b(?:dentro de|en)\s+(\d+|un|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|quince)\s+(dias?|semanas?)\b/))){ const n=/^\d+$/.test(m[1])?+m[1]:NUMW[m[1]]; return day(addDays(base, n*(m[2].startsWith("semana")?7:1))); }
  if((m=t.match(/\bhace\s+(\d+|un|una|dos|tres|cuatro|cinco|seis|siete)\s+dias?\b/))){ const n=/^\d+$/.test(m[1])?+m[1]:NUMW[m[1]]; return day(addDays(base,-n)); }
  if(/\bhoy\b|\besta (tarde|noche|manana)\b|\bahorita\b|\besta madrugada\b/.test(t)) return day(base);
  if(/fin de semana|finde/.test(t)){ const sat=nextWeekday(base,6); const sun=addDays(sat,1); const from = base.getDay()===0 ? startDay(base) : sat; return {desde:ymd(from), hasta:ymd(base.getDay()===0?startDay(base):sun), label:"el fin de semana"}; }
  if(/(proxima semana|semana que viene|siguiente semana)/.test(t)){ const mon=nextWeekday(base,1,true); return {desde:ymd(mon), hasta:ymd(addDays(mon,6)), label:"la próxima semana"}; }
  if(/(semana pasada)/.test(t)){ const mon=addDays(startWeek(base),-7); return {desde:ymd(mon), hasta:ymd(addDays(mon,6)), label:"la semana pasada"}; }
  if(/(esta semana|en la semana|toda la semana)/.test(t)){ if(base.getDay()===0){ const mon=addDays(startDay(base),1); return {desde:ymd(base), hasta:ymd(addDays(mon,6)), label:"esta semana"}; } const mon=startWeek(base); return {desde:ymd(base), hasta:ymd(addDays(mon,6)), label:"esta semana"}; }
  if(/(proximo mes|mes que viene|siguiente mes)/.test(t)){ const a=new Date(base.getFullYear(),base.getMonth()+1,1), b=new Date(base.getFullYear(),base.getMonth()+2,0); return {desde:ymd(a),hasta:ymd(b),label:MESES[a.getMonth()]}; }
  if(/(mes pasado)/.test(t)){ const a=new Date(base.getFullYear(),base.getMonth()-1,1), b=new Date(base.getFullYear(),base.getMonth(),0); return {desde:ymd(a),hasta:ymd(b),label:"el mes pasado"}; }
  if(/(este mes|del mes|en el mes|el mes)/.test(t)){ const a=new Date(base.getFullYear(),base.getMonth(),1), b=new Date(base.getFullYear(),base.getMonth()+1,0); return {desde:ymd(a),hasta:ymd(b),label:"este mes"}; }
  if((m=t.match(new RegExp(`\\b(\\d{1,2})\\s+de\\s+(${MES_RE})(?:\\s+(?:de|del)\\s+(\\d{4}))?\\b`)))){ const mi=MESES.indexOf(m[2]==="setiembre"?"septiembre":m[2]); let d=new Date(m[3]?+m[3]:base.getFullYear(),mi,+m[1]); if(!m[3] && d<addDays(startDay(base),-90)) d=new Date(base.getFullYear()+1,mi,+m[1]); return day(d); }
  if((m=t.match(new RegExp(`\\b(?:en|de|todo)\\s+(${MES_RE})\\b`)))){ const mi=MESES.indexOf(m[1]==="setiembre"?"septiembre":m[1]); let y=base.getFullYear(); const a=new Date(y,mi,1), b=new Date(y,mi+1,0); return {desde:ymd(a),hasta:ymd(b),label:MESES[mi]}; }
  if((m=t.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))){ const y = m[3] ? (m[3].length===2 ? 2000+Number(m[3]) : Number(m[3])) : base.getFullYear(); return day(new Date(y, Number(m[2])-1, Number(m[1]))); }
  for(let i=0;i<7;i++){ const re=new RegExp(`\\b(proximo|siguiente|este|el|este proximo)?\\s*${WD[i]}\\b(\\s+(que viene|proximo|pasado))?`); const mm=t.match(re); if(mm){ if(mm[3] && /pasado/.test(mm[3])){ let d=nextWeekday(base,i); d=addDays(d,-7); if(d>=startDay(base)) d=addDays(d,-7); return day(d); } return day(nextWeekday(base,i, !!mm[1]&&/proximo|siguiente/.test(mm[1]) || !!mm[3])); } }

  return null;
}
// Devuelve "HH:MM" o null. Ambiguas: 1–6 → tarde, 7–11 → mañana
function parseHora(text){
  const t = " "+norm(text)+" ";
  let h, mi=0, suf="", m;
  const sufRe = "(de la manana|de la tarde|de la noche|de la madrugada|del mediodia|en la manana|en la tarde|en la noche|por la manana|por la tarde|por la noche|am|pm|a\\.?\\s?m\\.?|p\\.?\\s?m\\.?|hrs?|horas)?";
  m = t.match(new RegExp(`\\b(?:a las?|las|desde las?|para las?|tipo|como a las?|a eso de las?|hasta las?)\\s+(\\d{1,2})(?:[:.h](\\d{2}))?(?:\\s+y\\s+(media|cuarto|\\d{1,2}))?\\s*${sufRe}`))
   || t.match(new RegExp(`\\b(\\d{1,2})(?:[:.](\\d{2}))\\s*${sufRe}`))
   || t.match(/\b(\d{1,2})\s*(am|pm|a\.?\s?m\.?|p\.?\s?m\.?)\b()()/);
  if(m){ if(m[4]===undefined && /am|pm/.test(m[2]||"")){ h=+m[1]; suf=m[2]; } else { h=+m[1]; mi = m[2] && /^\d+$/.test(m[2]) ? +m[2] : m[3]==="media" ? 30 : m[3]==="cuarto" ? 15 : (/^\d+$/.test(m[3]||"")? +m[3] : 0); suf=m[4]||""; } }
  else {
    m = t.match(new RegExp(`\\b(?:a las?|las|para las?|desde las?|como a las?)\\s+(una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce)(?:\\s+y\\s+(media|cuarto))?\\s*${sufRe}`));
    if(m){ h = NUMW[m[1]]; mi = m[2]==="media"?30 : m[2]==="cuarto"?15 : 0; suf=m[3]||""; }
    else if(/mediodia/.test(t)) return "12:00";
    else if(/medianoche/.test(t)) return "23:59";
    else { m = t.match(/\b(\d{1,2})\s+(de la manana|de la tarde|de la noche|de la madrugada)\b/); if(m){ h=+m[1]; suf=m[2]; } }
  }
  if(h===undefined || h>23 || mi>59) return null;
  if(/tarde|noche|pm|p\.?\s?m/.test(suf) && h<12) h+=12;
  else if(/madrugada|manana|am|a\.?\s?m/.test(suf) && h===12) h=0;
  else if(!suf && h>=1 && h<=6) h+=12;
  return pad(h%24)+":"+pad(mi);
}
// Duración: "por 2 horas", "de 3 a 5", "hasta las 6"
function parseRango(text){
  const t = norm(text); let m;
  if((m=t.match(/\b(?:de|desde)\s+(?:las?\s+)?(\d{1,2})(?:[:.](\d{2}))?\s*(?:a|hasta)\s+(?:las?\s+)?(\d{1,2})(?:[:.](\d{2}))?\s*(de la manana|de la tarde|de la noche|am|pm)?/))){
    let a=+m[1], b=+m[3]; const suf=m[5]||""; if(/tarde|noche|pm/.test(suf)){ if(a<12) a+=12; if(b<12) b+=12; } else if(!suf){ if(a>=1&&a<=6) a+=12; if(b>=1&&b<=7 || b<a) b+=12; }
    return {ini:pad(a)+":"+pad(+(m[2]||0)), fin:pad(b%24)+":"+pad(+(m[4]||0))};

}
function quitarFechaHora(s){
  return String(s)

    .replace(/\b(la\s+)?(próxima|proxima|esta)\s+semana\b|\bfin de semana\b|\bdentro de \d+ d[ií]as\b/gi," ")

  bueno:"bueno",okey:"ok",oki:"ok",okis:"ok",dale:"dale",sip:"si",sep:"si",sii:"si",siii:"si",nop:"no",nel:"no",nopes:"no"};
const VOCAB = ["coloca","guarda","guardalo","borra","borralo","elimina","eliminalo","agrega","anade","añade","registra","anota","recuerdos","recuerdo","recuerda","recuerdame","gasto","gaste","ingreso","tarea","tareas","evento","agenda","agendame","calendario",

  "manana","pasado","semana","lunes","martes","miercoles","jueves","viernes","sabado","domingo","hoy","ayer","gracias","programa","programame","organiza","organizame","planifica","recordatorio","completa","termine","termina"];
function lev(a,b){ if(Math.abs(a.length-b.length)>2) return 9; const m=[...Array(b.length+1)].map((_,i)=>i); for(let i=1;i<=a.length;i++){ let prev=m[0]; m[0]=i; for(let j=1;j<=b.length;j++){ const tmp=m[j]; m[j]=Math.min(m[j]+1, m[j-1]+1, prev+(a[i-1]===b[j-1]?0:1)); prev=tmp; } } return m[b.length]; }
function corrige(t){
  return t.split(/(\s+)/).map(w=>{ if(/^\s+$/.test(w)||!w) return w; if(TYPOS[w]!==undefined) return TYPOS[w]; if(w.length<5 || VOCAB.includes(w) || /\d/.test(w)) return w;
    let best=null, bd=2; for(const v of VOCAB){ const d=lev(w,v); if(d<bd || (d===bd && best===null && d<=1)){ if(d<bd){ bd=d; best=v; } } } return (best && bd<=1) ? best : w; }).join("");
}
function limpia(raw){

/* ---------- buscadores difusos ---------- */
function puntuar(texto, consulta){ const a=norm(texto), q=norm(consulta); if(!q) return 0; if(a===q) return 3; if(a.includes(q) || (q.length>4 && q.includes(a))) return 2; return simil(texto, consulta)*1.6; }

function buscarMovs(t, {tipo}={}){
  let c = S.movimientos.slice();
  if(tipo==="gasto"||tipo==="ingreso") c = c.filter(m=>m.tipo===tipo);
  const monto = parseMonto(t, {suelto:true}); const f = parseFecha(t);
  if(monto) { const cm = c.filter(m=>Math.abs(m.monto-monto)<0.01); if(cm.length) c=cm; }

function buscarTareas(t, {pend=true}={}){
  const q = quitarFechaHora(quitarComando(t)).replace(/\b(hecha|lista|completada|terminada|como|marca|ya|hice|termine|acabe|complete|prioridad|alta|media|baja)\b/g," ").replace(/\s+/g," ").trim();

  if(!q) return [];

function buscarEventos(t){
