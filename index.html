function chatView(){
  const turns = S.chat.slice(-14);
  if(!turns.length) return `<div class="msg a">Hola, ${esc(S.profile.nombre)}. Soy ${esc(S.profile.asistente)}. Puedes decirme cosas como «¿Qué tengo para el sábado?», «Gasté 9 soles en una compra» o «Recuérdame el informe de ROQASEG el viernes a las 6».</div>`;
  return turns.map(m=>{
    let h = m.t ? `<div class="msg ${m.r}">${esc(m.t)}</div>` : (m.r==="a" && S.aiBusy && m===S.chat[S.chat.length-1] ? `<div class="msg a typing">Pensando</div>` : "");
    if(m.cards) h += m.cards.map(cardView).join("");
    return h;
  }).join("");
}
function cardView(c){
  if(c.k==="mov"){ const m=S.movimientos.find(x=>x.id===c.id); const lg=findLogFor("movimientos",c.id);
    if(!m) return `<div class="acard undone"><span class="k">Movimiento deshecho</span></div>`;
    const pend = m.estado==="pendiente";
    return `<div class="acard ${pend?"pend":""}"><span class="k">${pend?"Pendiente de confirmar":"Registrado"} · ${m.tipo}</span>
      <div><b class="num">${money(m.monto)}</b> · ${esc(m.concepto)} · ${esc(m.categoria||"sin categoría")} · ${esc(m.metodo)} · <span class="muted">${esc(m.fecha)}</span></div>
      ${pend && !m.categoria && m.tipo==="gasto" ? `<div class="chips">${S.profile.categorias.map(ct=>`<button class="chip" data-act="movCat" data-id="${m.id}" data-cat="${esc(ct)}">${esc(ct)}</button>`).join("")}</div>`:""}
      <div class="btns">${pend?`<button class="btn sm pri" data-act="movOk" data-id="${m.id}">Confirmar</button>`:""}<button class="btn sm" data-act="movEdit" data-id="${m.id}">Corregir</button>${lg&&lg.estado!=="deshecho"?`<button class="btn sm ghost" data-act="undo" data-id="${lg.id}">Deshacer</button>`:""}</div></div>`; }
  if(c.k==="tarea"){ const t=S.tareas.find(x=>x.id===c.id); if(!t) return `<div class="acard undone"><span class="k">Tarea eliminada</span></div>`; const lg=findLogFor("tareas",c.id);
    return `<div class="acard"><span class="k">Tarea ${t.estado==="hecha"?"completada":"guardada"}</span><div><b>${esc(t.titulo)}</b>${t.vence?` · ${esc(fmtDia(pymd(t.vence)))}${t.hora?" "+esc(t.hora):""}`:""} · <span class="prio ${t.prioridad}">${t.prioridad}</span></div>
      <div class="btns"><button class="btn sm" data-act="taskEdit" data-id="${t.id}">Editar</button>${lg&&lg.estado!=="deshecho"?`<button class="btn sm ghost" data-act="undo" data-id="${lg.id}">Deshacer</button>`:""}</div></div>`; }
  if(c.k==="evento"){ const lg=S.registro.find(l=>l.deshacer?.op==="cal_del" && l.deshacer.eventId===c.id); const done = lg?.estado==="deshecho";
    return `<div class="acard ${done?"undone":""}"><span class="k">${done?"Evento eliminado":"Evento en Google Calendar"}</span><div><b>${esc(c.titulo)}</b> · ${esc(fmtDiaLargo(new Date(c.inicio)))} ${esc(hhmm(new Date(c.inicio)))}</div>
      <div class="btns">${c.link&&!done?`<a class="btn sm" href="${esc(c.link)}" target="_blank" rel="noopener">Abrir en Calendar</a>`:""}${lg&&!done?`<button class="btn sm ghost" data-act="undo" data-id="${lg.id}">Deshacer</button>`:""}</div></div>`; }
  if(c.k==="agenda"){ const {ev,ts}=itemsFor(c.desde,c.hasta); const conf=conflictsIn(ev);
    const rows = [...ev.map(e=>({d:e.ini, h:e.allDay?"Todo el día":hhmm(e.ini), t:e.titulo, cls:conf.has(e.id)?"conf":""})), ...ts.map(t=>({d:pymd(t.vence), h:t.hora||"Tarea", t:t.titulo, cls:"task"}))].sort((a,b)=>a.d-b.d).slice(0,12);
    return `<div class="acard"><span class="k">Agenda ${esc(c.label|| (c.desde===c.hasta?fmtDia(pymd(c.desde)):fmtDia(pymd(c.desde))+" – "+fmtDia(pymd(c.hasta))))}</span>
      ${S.cal.status!=="ok"?`<div class="small muted">${esc(S.cal.msg||"Google Calendar aún no está conectado.")}</div>`:""}
      ${rows.length?`<div class="list" style="box-shadow:none">${rows.map(r=>`<div class="item ${r.cls}"><span class="time">${c.desde!==c.hasta?esc(DIAS_C[r.d.getDay()])+" ":""}${esc(r.h)}</span><span class="bar"></span><span class="grow">${esc(r.t)}</span></div>`).join("")}</div>`:`<div class="small muted">Nada programado.</div>`}
      <div class="btns"><button class="btn sm" data-act="tab" data-v="agenda">Ver en agenda</button></div></div>`; }
  if(c.k==="mem"){ const m=S.memorias.find(x=>x.id===c.id); if(!m) return `<div class="acard undone"><span class="k">Recuerdo olvidado</span></div>`;
    return `<div class="acard"><span class="k">Memoria · ${esc(m.tipo)}${m.confianza==="inferido"?" · suposición":""}</span><div>${esc(m.texto)}</div><div class="btns"><button class="btn sm" data-act="memEdit" data-id="${m.id}">Corregir</button><button class="btn sm ghost" data-act="memForget" data-id="${m.id}">Olvidar</button></div></div>`; }
  if(c.k==="nota"){ const n=S.notas.find(x=>x.id===c.id); return n?`<div class="acard"><span class="k">${n.tipo==="idea"?"Idea":"Nota"} guardada</span><div>${esc(n.texto)}</div></div>`:""; }
  if(c.k==="alerta"){ const a=S.alertas.find(x=>x.id===c.id); return a?`<div class="acard"><span class="k">Alerta programada</span><div><b>${esc(a.titulo)}</b> · ${esc(fmtDiaLargo(new Date(a.cuando)))} ${esc(hhmm(new Date(a.cuando)))}</div><div class="small muted">Sonará en tu celular mediante Google Calendar.</div></div>`:`<div class="acard undone"><span class="k">Alerta cancelada</span></div>`; }
  if(c.k==="confirm"){ const p=S.pendientes.get(c.pid); if(!p) return "";
    return `<div class="acard ${p.estado==="error"?"err":p.estado==="hecho"?"":"pend"}"><span class="k">${p.estado==="hecho"?"Confirmado":p.estado==="error"?"No se pudo":"Necesita tu confirmación"}</span><div>${esc(p.texto)}</div>${p.error?`<div class="small">${esc(p.error)}</div>`:""}
      ${p.estado==="pendiente"?`<div class="btns"><button class="btn sm pri" data-act="pendOk" data-id="${c.pid}">Sí, hazlo</button><button class="btn sm" data-act="pendNo" data-id="${c.pid}">Cancelar</button></div>`:""}</div>`; }
  if(c.k==="err") return `<div class="acard err"><span class="k">Error</span><div>${esc(c.texto)}</div></div>`;
  if(c.k==="rec"){ const r=S.recuerdos.find(x=>x.id===c.id); if(!r) return `<div class="acard undone"><span class="k">Recuerdo borrado</span></div>`;
    return `<div class="acard" style="border-left-color:var(--e-${esc(r.emocion||"dificil")})"><span class="k" style="color:var(--e-${esc(r.emocion||"dificil")})">${r.estado==="procesando"?"Ordenando tu recuerdo…":"Recuerdo guardado · "+esc(emoLabel(r.emocion))}</span>
      <div><b>${esc(r.titulo)}</b> · <span class="muted">${esc(recFecha(r))}</span></div>
      <div class="btns"><button class="btn sm" data-act="recHear" data-id="${r.id}">${ICON.play} Escuchar</button><button class="btn sm" data-act="recMas" data-id="${r.id}">Seguir contando</button><button class="btn sm" data-act="recEdit" data-id="${r.id}">Corregir</button></div></div>`; }
  return "";
}

/* ----- HOY ----- */
function viewHoy(){
  const r = radar(), hoy=todayStr(), now=new Date();
  const {ev, ts} = itemsFor(hoy, hoy);
  const conf = conflictsIn(ev);
  const items = [...ev.map(e=>({ini:e.allDay?null:e.ini, h:e.allDay?"Todo el día":hhmm(e.ini), t:e.titulo, s:e.allDay?"":`hasta ${hhmm(e.fin)}`, cls:(conf.has(e.id)?"conf ":"")+(e.fin<now&&!e.allDay?"past":""), act:`data-act="openEv" data-id="${esc(e.id)}"`})),
                 ...ts.map(t=>({ini:null, h:t.hora||"Tarea", t:t.titulo, s:t.area, cls:"task", act:`data-act="taskEdit" data-id="${t.id}"`}))].sort((a,b)=>(a.ini||0)-(b.ini||0));
  const quick = ["¿Qué tengo para el sábado?","¿Qué estoy olvidando esta semana?","Organiza mis tareas urgentes","¿Cuánto gasté este mes?"];
  return `
  <div class="section hide-desk" id="chatMobWrap" ${S.chat.length?"":"hidden"}><div id="chatMob" style="display:flex;flex-direction:column;gap:8px"></div></div>
  <div class="chips">${quick.map(q=>`<button class="chip" data-act="say" data-arg="${esc(q)}">${esc(q)}</button>`).join("")}<button class="chip" data-act="contarRecuerdo">Contar un recuerdo</button></div>
  ${calConnectCard()}
  <div class="section"><div class="sechead"><h2>${esc(S.profile.asistente)} nota que…</h2><button class="btn sm ghost" data-act="brief">${ICON.play} Escuchar resumen</button></div>
    ${r.length ? `<div class="list" id="alertas">${r.map(x=>`<div class="insight"><span class="sev ${x.n}">${esc(x.ic)}</span><div class="grow"><div>${esc(x.t)}</div>${x.a.length?`<div class="btns">${x.a.map(b=> b.href?`<a class="btn sm" href="${esc(b.href)}" target="_blank" rel="noopener">${esc(b.l)}</a>`:`<button class="btn sm" data-act="${b.act}" ${b.arg?`data-arg="${esc(b.arg)}"`:""} ${b.v?`data-v="${b.v}"`:""} ${b.id?`data-id="${b.id}"`:""}>${esc(b.l)}</button>`).join("")}</div>`:""}</div></div>`).join("")}</div>`
      : `<div class="empty">Todo en orden por ahora. Cuando algo necesite tu atención (un cruce, una fecha límite, gastos sin anotar) aparecerá aquí.</div>`}
  </div>
  <div class="section"><div class="sechead"><h2>Hoy, ${esc(fmtDiaLargo(now))}</h2><button class="btn sm ghost" data-act="tab" data-v="agenda">Agenda completa</button></div>
    ${items.length ? `<div class="list">${items.map(i=>`<div class="item ${i.cls}" ${i.act}><span class="time">${esc(i.h)}</span><span class="bar"></span><div class="grow"><div class="t">${esc(i.t)}</div>${i.s?`<div class="s">${esc(i.s)}</div>`:""}</div></div>`).join("")}</div>`
      : `<div class="empty">${S.cal.status==="ok"?"Nada más programado para hoy.":"Conecta Google Calendar para ver tus clases y reuniones aquí."}</div>`}
  </div>
  ${habitsCard()}`;
}
function calConnectCard(){
  const s=S.cal.status;
  if(s==="ok"||s==="loading") return "";
  if(s==="none" && S.standalone) return `<div class="card small"><b>Google Calendar sin conectar.</b> Agrega tu ID de cliente de Google en Yo → Ajustes → App propia.</div>`;
  if(s==="none") return S.caps.preview ? `<div class="card small"><b>Vista previa.</b> Abre ${esc(S.profile.asistente)} desde claude.ai para conectar tu Google Calendar y tu memoria privada.</div>` : "";
  return `<div class="card"><div class="sechead"><div><b>Conecta tu Google Calendar</b><div class="small muted">${esc(S.cal.msg || "Para ver tus clases, crear eventos y programar alertas que suenen en tu celular.")}</div></div><button class="btn pri" data-act="connectCal">Conectar</button></div></div>`;
}
function habitsCard(){
  if(!S.habitos.length) return "";
  const hoy=todayStr();
  return `<div class="section"><div class="sechead"><h2>Hábitos de hoy</h2><button class="btn sm ghost" data-act="yo" data-v="habitos">Ver semana</button></div>
    <div class="chips">${S.habitos.map(h=>`<button class="chip ${h.registros?.[hoy]?"on":""}" data-act="habToggle" data-id="${h.id}" data-d="${hoy}">${h.registros?.[hoy]?"✓ ":""}${esc(h.nombre)}</button>`).join("")}</div></div>`;
}

/* ----- AGENDA ----- */
function viewAgenda(){
  const cv=S.calView, d=startDay(cv.date);
  let desde, hasta, title;
  if(cv.mode==="dia"){ desde=hasta=ymd(d); title=fmtDiaLargo(d); }
  else if(cv.mode==="semana"){ const mon=addDays(d, -((d.getDay()+6)%7)); desde=ymd(mon); hasta=ymd(addDays(mon,6)); title=`${fmtDia(mon)} – ${fmtDia(addDays(mon,6))}`; }
  else { const a=new Date(d.getFullYear(),d.getMonth(),1), b=new Date(d.getFullYear(),d.getMonth()+1,0); desde=ymd(addDays(a,-((a.getDay()+6)%7))); hasta=ymd(addDays(b,(7-b.getDay())%7)); title=`${MESES[d.getMonth()]} ${d.getFullYear()}`; }
  if(S.cal.status==="ok"){ const key=desde+"_"+hasta; const covered = Object.entries(S.cal.ranges).some(([k,v])=>{ const [a,b]=k.split("_"); return a<=desde && b>=hasta && Date.now()-v.at<180000; });
    S.cal.inflight ||= new Set();
    if(!covered && !S.cal.inflight.has(key)){ S.cal.inflight.add(key); ensureEvents(desde,hasta).catch(()=>{}).finally(()=>S.cal.inflight.delete(key)); } }
  const head = `<div class="calbar"><div class="nav"><button class="btn sm" data-act="calNav" data-n="-1" aria-label="Anterior">${ICON.left}</button><button class="btn sm" data-act="calNav" data-n="1" aria-label="Siguiente">${ICON.right}</button><h2>${esc(title)}</h2></div>
    <div class="nav"><button class="btn sm" data-act="calToday">Hoy</button><div class="seg">${["dia","semana","mes"].map(m=>`<button data-act="calMode" data-m="${m}" class="${cv.mode===m?"on":""}">${{dia:"Día",semana:"Semana",mes:"Mes"}[m]}</button>`).join("")}</div>
    <button class="btn sm pri" data-act="newEvent">+ Evento</button></div></div>`;
  let body="";
  if(cv.mode==="dia") body = dayList(desde, true);
  else if(cv.mode==="semana"){ body = `<div class="week">${[0,1,2,3,4,5,6].map(i=>{ const dd=addDays(pymd(desde),i); const k=ymd(dd); return `<div><div class="dayhead ${k===todayStr()?"today":""}"><b>${esc(DIAS_C[dd.getDay()])} ${dd.getDate()}</b><button class="btn sm ghost" data-act="calDay" data-d="${k}">Ver</button></div>${dayList(k,false)}</div>`; }).join("")}</div>`; }
  else { const a=pymd(desde); const cells=[]; let x=new Date(a); while(ymd(x)<=hasta){ cells.push(new Date(x)); x=addDays(x,1); }
    body = `<div class="month">${["L","M","M","J","V","S","D"].map(w=>`<div class="wd">${w}</div>`).join("")}${cells.map(c=>{ const k=ymd(c); const {ev,ts}=itemsFor(k,k); const n=ev.length+ts.length;
      return `<button class="mcell ${c.getMonth()!==d.getMonth()?"out":""} ${k===todayStr()?"today":""}" data-act="calDay" data-d="${k}" aria-label="${esc(fmtDiaLargo(c))}: ${n} elementos"><span class="n">${c.getDate()}</span><span class="dots">${ev.slice(0,4).map(()=>"<i></i>").join("")}${ts.slice(0,3).map(()=>'<i class="t"></i>').join("")}</span>${n>7?`<span class="cnt">+${n-7}</span>`:""}</button>`; }).join("")}</div>`; }
  return `${head}${calConnectCard()}${body}<div class="small muted">Rosado: eventos de Google Calendar · Verde: tareas · Amarillo: alertas. Rojo en la hora = cruce de horario.</div>`;
}
function dayList(k, gaps){
  const {ev,ts,al}=itemsFor(k,k); const conf=conflictsIn(ev); const now=new Date();
  const it=[...ev.map(e=>({ini:e.allDay?null:e.ini, fin:e.fin, all:e.allDay, h:e.allDay?"Todo el día":hhmm(e.ini), t:e.titulo, s:e.allDay?"":`${hhmm(e.ini)}–${hhmm(e.fin)}${e.meet?" · Meet":""}`, cls:conf.has(e.id)?"conf":"", act:`data-act="openEv" data-id="${esc(e.id)}"`})),
    ...al.map(a=>({ini:new Date(a.cuando), fin:new Date(a.cuando), h:hhmm(new Date(a.cuando)), t:a.titulo, s:"Alerta", cls:"alert", act:`data-act="hear" data-id="${a.id}"`})),
    ...ts.map(t=>({ini:t.hora?new Date(`${t.vence}T${t.hora}:00`):null, h:t.hora||"Tarea", t:t.titulo, s:[t.prioridad,t.area].filter(Boolean).join(" · "), cls:"task", act:`data-act="taskEdit" data-id="${t.id}"`}))]
    .sort((a,b)=>(a.ini||0)-(b.ini||0));
  if(!it.length) return `<div class="empty">${S.cal.status==="ok"?"Libre.":"Sin tareas con fecha. Conecta Google Calendar para ver eventos."}</div>`;
  let html=""; let lastEnd=null;
  for(const i of it){
    if(gaps && i.ini && !i.all && lastEnd && (i.ini-lastEnd)>=45*60000 && i.ini>now) html+=`<div class="gap">Libre ${hhmm(lastEnd)}–${hhmm(i.ini)}</div>`;
    html+=`<div class="item ${i.cls}" ${i.act}><span class="time">${esc(i.h)}</span><span class="bar"></span><div class="grow"><div class="t">${esc(i.t)}</div>${i.s?`<div class="s">${esc(i.s)}</div>`:""}</div></div>`;
    if(i.ini && !i.all && i.fin) lastEnd = !lastEnd || i.fin>lastEnd ? i.fin : lastEnd;
  }
  return `<div class="list">${html}</div>`;
}

/* ----- TAREAS ----- */
function viewTareas(){
  const hoy=todayStr(), sem=ymd(addDays(new Date(),7));
  const pend=S.tareas.filter(t=>t.estado!=="hecha");
  const pr = {alta:0,media:1,baja:2};
  const sort = a => a.sort((x,y)=>(x.vence||"9999")<(y.vence||"9999")?-1:(x.vence||"9999")>(y.vence||"9999")?1:pr[x.prioridad]-pr[y.prioridad]);
  const groups = [
    ["Vencidas", sort(pend.filter(t=>t.vence && t.vence<hoy))],
    ["Hoy", sort(pend.filter(t=>t.vence===hoy))],
    ["Próximos 7 días", sort(pend.filter(t=>t.vence>hoy && t.vence<=sem))],
    ["Más adelante", sort(pend.filter(t=>t.vence>sem))],
    ["Sin fecha", sort(pend.filter(t=>!t.vence))]
  ].filter(g=>g[1].length);
  const done = S.tareas.filter(t=>t.estado==="hecha").sort((a,b)=>(b.hecha_en||0)-(a.hecha_en||0)).slice(0,15);
  const row = t => `<div class="row"><button class="ck ${t.estado==="hecha"?"on":""}" data-act="taskToggle" data-id="${t.id}" aria-label="Marcar ${esc(t.titulo)}">${t.estado==="hecha"?ICON.check:""}</button>
    <div class="grow row click" style="padding:0;border:0" data-act="taskEdit" data-id="${t.id}"><div class="grow"><div class="t">${esc(t.titulo)}</div><div class="s">${[t.vence?fmtDia(pymd(t.vence))+(t.hora?" "+t.hora:""):"",t.area].filter(Boolean).map(esc).join(" · ")}</div></div><span class="prio ${t.prioridad}">${t.prioridad}</span></div></div>`;
  return `<div class="sechead"><h2>Tareas</h2><div class="btns"><button class="btn sm" data-act="say" data-arg="Organiza mis tareas urgentes y propón un orden realista">Organizar con ${esc(S.profile.asistente)}</button><button class="btn sm pri" data-act="newTask">+ Tarea</button></div></div>
   ${groups.length ? groups.map(([n,l])=>`<div class="section"><span class="label">${n} · ${l.length}</span><div class="list">${l.map(row).join("")}</div></div>`).join("") : `<div class="empty">No tienes tareas pendientes. Dime «Tengo que entregar el informe de ROQASEG el viernes» y la anoto.</div>`}
   ${done.length?`<details><summary class="small">Completadas recientes (${done.length})</summary><div class="list" style="margin-top:8px">${done.map(row).join("")}</div></details>`:""}`;
}

/* ----- DINERO ----- */
function viewDinero(){
  const mes=S.dineroMes; const [y,m]=mes.split("-").map(Number);
  const movs=S.movimientos.filter(x=>x.fecha.startsWith(mes)).sort((a,b)=>a.fecha<b.fecha?1:a.fecha>b.fecha?-1:(b.creado||0)-(a.creado||0));
  const reg=movs.filter(x=>x.estado==="registrado"), pend=movs.filter(x=>x.estado==="pendiente");
  const allPend = S.movimientos.filter(x=>x.estado==="pendiente" && !x.fecha.startsWith(mes));
  const g=round2(reg.filter(x=>x.tipo==="gasto").reduce((s,x)=>s+x.monto,0)), i=round2(reg.filter(x=>x.tipo==="ingreso").reduce((s,x)=>s+x.monto,0)), bal=round2(i-g);
  const cats={}; reg.filter(x=>x.tipo==="gasto").forEach(x=>cats[x.categoria||"Sin categoría"]=round2((cats[x.categoria||"Sin categoría"]||0)+x.monto));
  const catArr=Object.entries(cats).sort((a,b)=>b[1]-a[1]); const maxC=catArr[0]?.[1]||1;
  const nd=new Date(y,m,0).getDate(); const daily=Array.from({length:nd},(_,k)=>round2(reg.filter(x=>x.tipo==="gasto" && Number(x.fecha.slice(8,10))===k+1).reduce((s,x)=>s+x.monto,0)));
  const row = x => `<div class="row click" data-act="movEdit" data-id="${x.id}"><div class="grow"><div class="t">${esc(x.concepto)}</div><div class="s">${esc(fmtDia(pymd(x.fecha)))} · ${esc(x.tipo==="gasto"?(x.categoria||"Sin categoría"):(x.fuente||"Ingreso"))} · ${esc(x.metodo)}${x.estado==="pendiente"?` · <b style="color:var(--warn)">pendiente</b>`:""}</div></div><b class="num" style="color:${x.tipo==="ingreso"?"var(--teal)":"var(--ink)"}">${x.tipo==="ingreso"?"+":"−"}${money(x.monto).replace("S/ ","S/ ")}</b></div>`;
  return `<div class="calbar"><div class="nav"><button class="btn sm" data-act="mesNav" data-n="-1" aria-label="Mes anterior">${ICON.left}</button><button class="btn sm" data-act="mesNav" data-n="1" aria-label="Mes siguiente">${ICON.right}</button><h2>${MESES[m-1]} ${y}</h2></div>

  <div class="section card"><div class="sechead"><h3>Gasto por día</h3><span class="small muted">máx. ${money(Math.max(...daily))}</span></div>${dailyChart(daily, y, m)}</div>
  <div class="section"><div class="sechead"><span class="label">Movimientos · ${movs.length}</span><button class="btn sm" data-act="exportSheet">Exportar mes a Google Sheets</button></div>
    ${movs.length?`<div class="list">${movs.map(row).join("")}</div>`:`<div class="empty">Sin movimientos en ${MESES[m-1]}. Di «Gasté 9 soles en pasajes» o «Me pagaron 300 soles de las prácticas».</div>`}
    <div class="small muted">Exportar crea una hoja nueva en tu Drive con el mismo formato que tu «FINANZAS PERSONALES». Tu hoja original no se modifica.</div></div>`;

function dailyChart(daily, y, m){
  const W=600, H=120, padL=34, padB=18, padT=8, n=daily.length, max=Math.max(1,...daily);
  const nice = (()=>{ const raw=max/3; const p=10**Math.floor(Math.log10(raw)); const s=[1,2,5,10].find(k=>k*p>=raw)*p; return s; })();
  const top = Math.ceil(max/nice)*nice; const bw=(W-padL-4)/n;
  const yy = v => H-padB - (v/top)*(H-padB-padT);
  let s=`<svg class="daily" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gasto diario en soles">`;
  for(let v=0; v<=top+1e-9; v+=nice){ s+=`<line class="grid" x1="${padL}" x2="${W}" y1="${yy(v)}" y2="${yy(v)}"/><text x="${padL-4}" y="${yy(v)+3}" text-anchor="end">${Math.round(v)}</text>`; }
  daily.forEach((v,k)=>{ const x=padL+2+k*bw; if(v>0){ const h=Math.max(2,H-padB-yy(v)); s+=`<path class="b" data-tip="${k+1} ${MESES[m-1].slice(0,3)}: ${money(v)}" d="M${x+1},${H-padB} v${-(h-3)} q0,-3 3,-3 h${Math.max(1,bw-8)} q3,0 3,3 v${h-3} z"/>`; }
    if(k===0||(k+1)%5===0) s+=`<text x="${x+bw/2}" y="${H-4}" text-anchor="middle">${k+1}</text>`; });
  return s+`</svg>`;
}
function wireCharts(){
  const tip=$("#tip");
  document.querySelectorAll("[data-tip]").forEach(el=>{
    el.onpointerenter = e=>{ tip.textContent=el.dataset.tip; tip.hidden=false; };
    el.onpointermove = e=>{ tip.style.left=(e.clientX+12)+"px"; tip.style.top=(e.clientY-30)+"px"; };
    el.onpointerleave = ()=>{ tip.hidden=true; };
  });
}

/* ----- Foto para el retrato ----- */
function procesarFoto(img){
  const max=640, k=Math.min(1, max/img.naturalWidth, 900/img.naturalHeight);
  const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  let q=.86, url=c.toDataURL("image/jpeg",q);
  while(url.length>230000 && q>.4){ q-=.08; url=c.toDataURL("image/jpeg",q); }
  return {img:url, w:c.width, h:c.height};
}
async function guardarFoto(img, pts){
  const r = {...procesarFoto(img), eL:pts[0], eR:pts[1], m:pts[2], creado:Date.now()};
  if(r.eL[0]>r.eR[0]){ const t=r.eL; r.eL=r.eR; r.eR=t; }
  await Store.saveRetrato(r); S.retrato=r;
  await Store.saveProfile({avatar:{modo:"retrato"}});
  if(Avatar.started.has("retrato")) await Retrato.load(r);
  Avatar.refresh(); render();
  return r;
}
function calibrar(img){
  const pasos=["Toca el centro de tu ojo izquierdo (el de tu lado izquierdo en la foto).","Ahora toca el centro del otro ojo.","Por último, toca el centro de tu boca, justo donde se juntan los labios."];
  const pts=[]; const w=$("#sheetWrap"), f=$("#sheet");
  const draw=()=>{ f.innerHTML=`<div class="sechead"><h2>Marca tu rostro</h2><button type="button" class="btn sm ghost" data-act="closeSheet">Cancelar</button></div>
      <div><b>${pts.length<3?`Paso ${pts.length+1} de 3:`:"¡Listo!"}</b> ${pts.length<3?pasos[pts.length]:"Revisa los puntos y guarda."}</div>
      <div class="calib" id="calib"><img src="${img.src}" alt="Tu foto">${pts.map(p=>`<i style="left:${p[0]*100}%;top:${p[1]*100}%"></i>`).join("")}</div>
      <div class="btns" style="justify-content:flex-end">${pts.length?`<button type="button" class="btn" id="calUndo">Deshacer punto</button>`:""}<button type="submit" class="btn pri" ${pts.length<3?"disabled":""}>Guardar mi avatar</button></div>`;
    $("#calib").onclick=e=>{ if(pts.length>=3) return; const r=e.currentTarget.getBoundingClientRect(); pts.push([(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]); draw(); };
    const u=$("#calUndo"); if(u) u.onclick=()=>{ pts.pop(); draw(); }; };
  f.onsubmit=async e=>{ e.preventDefault(); if(pts.length<3) return; try{ await guardarFoto(img, pts); w.hidden=true; toast("¡Tu retrato está listo!"); S.view="hoy"; render(); }catch(err){ toast("No pude guardar la foto: "+(err?.message||err?.code||"")); } };
  draw(); w.hidden=false;
}

function openSheet(title, fields, onSubmit, extraBtns=""){
  const w=$("#sheetWrap"), f=$("#sheet");

  w.hidden=false; f.onsubmit = async e=>{ e.preventDefault(); const fd=Object.fromEntries(new FormData(f).entries()); try{ await onSubmit(fd); w.hidden=true; }catch(err){ toast(err?.code?mcpMsg(err,CAL):(err?.message||"No se pudo guardar")); } };
  setTimeout(()=>f.querySelector("input,textarea,select")?.focus(), 50);
}

async function exportSheet(){
  if(!mcp){ toast("Abre esta página desde claude.ai para exportar a tu Drive."); return; }
  const mes=S.dineroMes; const [y,m]=mes.split("-").map(Number);
  const movs=S.movimientos.filter(x=>x.fecha.startsWith(mes) && x.estado==="registrado").sort((a,b)=>a.fecha<b.fecha?-1:1);
  if(!movs.length){ toast("No hay movimientos registrados este mes."); return; }
  const q = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const dec = n => q(Number(n).toFixed(2).replace(".",","));
  const fecha = s => { const d=pymd(s); return `${DIAS[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}`; };
  const ing=movs.filter(x=>x.tipo==="ingreso"), gas=movs.filter(x=>x.tipo==="gasto");
  const lines=[ q(`${MESES[m-1].toUpperCase()} ${y}`), "", q("Ingresos"), [q("Fecha"),q("Monto"),q("Fuente")].join(","),
    ...ing.map(x=>[q(fecha(x.fecha)),dec(x.monto),q(x.fuente||x.metodo)].join(",")), [q("Total"),dec(ing.reduce((s,x)=>s+x.monto,0)),""].join(","), "",
    q("Gastos"), [q("Concepto"),q("Monto"),q("Categoria"),q("Detalles"),q("Fecha"),q("Método de Pago")].join(","),
    ...gas.map(x=>[q(x.concepto),dec(x.monto),q(x.categoria),q(x.detalles),q(fecha(x.fecha)),q(x.metodo)].join(",")), [q("Total"),dec(gas.reduce((s,x)=>s+x.monto,0))].join(",") ];
  toast("Creando la hoja en tu Drive…", 6000);
  try{
    const r = await mcp.callTool(DRIVE, "create_file", { title:`FINANZAS PERSONALES — ${MESES[m-1]} ${y} (${S.profile.asistente})`, textContent: lines.join("\n"), contentMimeType:"text/csv" });
    const p = r.payload || {}; const f = p.file || p; const url = f.viewUrl || f.webViewLink || (f.id?`https://docs.google.com/spreadsheets/d/${f.id}/edit`:"");
    await logAction(`Exportado ${MESES[m-1]} ${y} a Google Sheets`, null);
    curCards = null;
    S.chat.push({r:"a", t:`Listo, creé la hoja «FINANZAS PERSONALES — ${MESES[m-1]} ${y}» en tu Drive con ${movs.length} movimientos.${url?" Ábrela desde Actividad o aquí: "+url:""}`, ts:Date.now()});
    Store.saveChat().catch(()=>{}); render(); toast("Hoja creada en tu Drive");
  }catch(e){ toast(mcpMsg(e, DRIVE), 6000); }
}

// ajustes con inputs
let setT; document.addEventListener("change", e=>{
  const id=e.target.id, v=e.target.value;
  if(id==="setAsis" && v.trim()) Store.saveProfile({asistente:v.trim()});
  if(id==="setNom" && v.trim()) Store.saveProfile({nombre:v.trim()});

  if(id==="setRate") Store.saveProfile({ajustes:{vozRate:Number(v)}});

});
document.addEventListener("input", e=>{ if(e.target.id==="memQ"){ S.memQ=e.target.value; clearTimeout(setT); setT=setTimeout(()=>{ render(); requestAnimationFrame(()=>{ const i=$("#memQ"); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} }); }, 250); } });
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) render(); });

/* =========================================================
   Arranque
   ========================================================= */
async function boot(){
  try{ if(localStorage.getItem("mila-stt")==="dictado") S.sttBlocked=true; }catch{}
  setBubble(""); renderAll();
  const C = window.claude; S.standalone = !!C?.standalone;
  if(C?.use){
    [db,user,sample,mcp,perms] = await Promise.all(["db","user","sample","mcp","permissions"].map(n=>C.use(n).catch(()=>null)));
  } else S.caps.preview = true;
  if(db && user){ try{ const id = await user.id(); if(id) Store.useDb(db, id); }catch{} }
  if(Store.mode!=="db") Store.useMemory();
  Store.subscribe();
  try{ S.retrato = await Store.getRetrato(); }catch{ S.retrato = null; }
  Avatar.init($("#avatar"));
  if(S.standalone){ let on=false; try{ on = localStorage.getItem("mila-oido")==="1"; }catch{} if(on && Oido.disponible()) Oido.start(); if(window.MilaApp?.Claves.get().googleClientId) window.MilaApp.Google.load().catch(()=>{}); }
  calInit();
  if(location.hash==="#alertas"){ S.view="hoy"; render(); setTimeout(()=>{ $("#alertas")?.scrollIntoView({behavior:"smooth"}); const a=S.alertas.slice().sort((x,y)=>Math.abs(new Date(x.cuando)-Date.now())-Math.abs(new Date(y.cuando)-Date.now()))[0]; if(a) setBubble("Toca «Escuchar» para oír tu alerta: "+a.titulo); }, 1500); }
  else setTimeout(()=>{ if(!$("#bubble").textContent) setBubble(`Hola, ${S.profile.nombre}. Toca el micrófono y dime qué necesitas.`); }, 1200);
}
boot();
window.__mila = { parseMonto, parseFecha, localIntent, extractConcepto, inferCat, S, procesarFoto, guardarFoto, Avatar, TTS };
