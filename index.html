<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D9466F">
<meta name="description" content="Mila, la doble digital de Luzmila">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script type="module" src="runtime.js"></script>
<script>if("serviceWorker" in navigator) addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</head>
<body><title>Mila</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una pantalla. Móvil: escenario del avatar arriba, panel debajo, barra de voz + pestañas fijas abajo.
   Escritorio (>=960px): columna izquierda = Mila (avatar + conversación + barra de voz), derecha = panel activo. */
:root{
  --bg:#F5F1F7; --surface:#FFFFFF; --surface2:#EFE8F3; --ink:#251B2E; --muted:#6C6177; --line:#E2D9E8;
  --accent:#D9466F; --accent-ink:#FFFFFF; --accent-soft:#FBE3EA; --teal:#167A6C; --teal-soft:#DDF1ED;
  --warn:#B86E0B; --warn-soft:#FCEFD9; --crit:#C23A2B; --crit-soft:#FBE2DE;
  --stage1:#F9DDE6; --stage2:#E9E0F6;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(37,27,46,.06), 0 6px 20px rgba(37,27,46,.06);
  --e-alegre:#D9466F; --e-gracioso:#A86F00; --e-logro:#167A6C; --e-gratitud:#B8562E; --e-aprendizaje:#6B4FB8; --e-triste:#3A6FB0; --e-dificil:#6C6177;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --e-alegre:#FF7598; --e-gracioso:#F2C14E; --e-logro:#4CC2AE; --e-gratitud:#F09A70; --e-aprendizaje:#A895F0; --e-triste:#7FB0F0; --e-dificil:#A99DB4 } }
:root[data-theme="dark"]{ --e-alegre:#FF7598; --e-gracioso:#F2C14E; --e-logro:#4CC2AE; --e-gratitud:#F09A70; --e-aprendizaje:#A895F0; --e-triste:#7FB0F0; --e-dificil:#A99DB4 }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#16111B; --surface:#211A28; --surface2:#2B2333; --ink:#F2ECF6; --muted:#A99DB4; --line:#3A3043;
  --accent:#FF7598; --accent-ink:#2A0C16; --accent-soft:#4A2232; --teal:#4CC2AE; --teal-soft:#183A35;
  --warn:#F0AC4B; --warn-soft:#3D2C14; --crit:#FF8070; --crit-soft:#46201B;
  --stage1:#3A1F2D; --stage2:#241E3A; --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#16111B; --surface:#211A28; --surface2:#2B2333; --ink:#F2ECF6; --muted:#A99DB4; --line:#3A3043;
  --accent:#FF7598; --accent-ink:#2A0C16; --accent-soft:#4A2232; --teal:#4CC2AE; --teal-soft:#183A35;
  --warn:#F0AC4B; --warn-soft:#3D2C14; --crit:#FF8070; --crit-soft:#46201B;
  --stage1:#3A1F2D; --stage2:#241E3A; --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.25rem} h3{font-size:1.02rem}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

#app{height:100%;display:grid;grid-template-rows:auto 1fr auto auto;max-width:1400px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px 6px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:1.45rem}
.brand .date{color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--teal-soft);color:var(--teal)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}

main{min-height:0;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
#mila{display:flex;flex-direction:column;min-height:0}
#stage{position:relative;height:34vh;min-height:190px;max-height:340px;margin:0 16px;border-radius:22px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 100%, var(--stage1), var(--stage2));transition:height .35s ease}
#stage.compact{height:118px;min-height:118px}
#avatar{position:absolute;inset:0}
#avatar canvas{display:block;width:100%;height:100%}
#avatarFallback{position:absolute;inset:0;display:grid;place-items:center}
.retratoCv{position:absolute;inset:0;width:100%;height:100%;display:block}
#stage[data-state="escuchando"]{box-shadow:inset 0 0 0 3px var(--accent);animation:listenGlow 1.4s ease-in-out infinite}
@keyframes listenGlow{50%{box-shadow:inset 0 0 0 6px color-mix(in srgb, var(--accent) 55%, transparent)}}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.steps li{padding-left:4px}
.calib{position:relative;border-radius:12px;overflow:hidden;touch-action:manipulation;cursor:crosshair}
.calib img{display:block;width:100%}
.calib i{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:3px solid #fff;background:var(--accent);box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.voz{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line)}
.voz:first-child{border-top:0}
#stateTag{position:absolute;left:12px;top:10px}
#bubble{position:absolute;left:12px;right:12px;bottom:10px;background:color-mix(in srgb, var(--surface) 94%, transparent);color:var(--ink);border-radius:16px;padding:8px 12px;
  box-shadow:var(--shadow);font-size:.9rem;max-height:36%;overflow:auto}
#stage.compact #bubble{left:auto;width:min(62%,420px);top:10px;bottom:10px;max-height:none}
.stageBtns{position:absolute;right:10px;top:8px;display:flex;gap:6px}
#stage.compact .stageBtns{display:none}
.ibtn{border:0;background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 10px;font-size:.78rem;font-weight:600;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:5px}
.ibtn svg{width:15px;height:15px}

#panel{min-height:0;overflow:auto;padding:12px 16px 20px;-webkit-overflow-scrolling:touch}
.view{display:flex;flex-direction:column;gap:14px;max-width:820px}
.section{display:flex;flex-direction:column;gap:8px}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}
.row.click{cursor:pointer}
.row.click:hover{background:var(--surface2)}
.empty{color:var(--muted);font-size:.9rem;padding:14px;background:var(--surface);border-radius:var(--r);border:1px dashed var(--line)}

.btn{border:0;border-radius:10px;padding:8px 13px;font-weight:600;background:var(--surface2);color:var(--ink);display:inline-flex;align-items:center;gap:6px;font-size:.88rem}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent);padding-inline:8px}
.btn.sm{padding:5px 9px;font-size:.8rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.82rem;font-weight:500}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 10px;font-size:.82rem;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Radar */
.insight{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-top:1px solid var(--line)}
.insight:first-child{border-top:0}
.sev{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:.8rem}
.sev.alta{background:var(--crit-soft);color:var(--crit)}
.sev.media{background:var(--warn-soft);color:var(--warn)}
.sev.info{background:var(--teal-soft);color:var(--teal)}
.insight .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}

/* Chat */
#chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:8px 12px;border-radius:14px;font-size:.92rem;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:4px}
.acard{align-self:flex-start;width:min(100%,460px);background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;display:flex;flex-direction:column;gap:7px;border-left:3px solid var(--teal)}
.acard.pend{border-left-color:var(--warn)}
.acard.undone{opacity:.6;border-left-color:var(--line)}
.acard.err{border-left-color:var(--crit)}
.acard .k{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.acard.pend .k{color:var(--warn)} .acard .k{color:var(--teal)} .acard.err .k{color:var(--crit)} .acard.undone .k{color:var(--muted)}

/* Composer */
#composer{padding:8px 16px 8px;display:flex;gap:8px;align-items:flex-end;background:var(--bg)}
#composer .box{flex:1;display:flex;align-items:flex-end;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:4px 4px 4px 14px;min-width:0}
#q{flex:1;border:0;background:transparent;resize:none;outline:none;padding:9px 0;max-height:120px;min-width:0;line-height:1.35}
.round{flex:none;width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--surface2);color:var(--ink);position:relative}
.round svg{width:21px;height:21px}
.round.mic{background:var(--accent);color:var(--accent-ink);width:52px;height:52px;box-shadow:0 4px 16px color-mix(in srgb, var(--accent) 40%, transparent)}
.round.mic.live{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent)}100%{box-shadow:0 0 0 16px transparent}}
#sendBtn .ring{position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--accent);clip-path:inset(0 0 0 0);opacity:0}
#sendBtn.counting .ring{opacity:1;animation:ringfill 1.8s linear forwards}
@keyframes ringfill{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
#hint{padding:0 16px 4px;font-size:.8rem;color:var(--muted)}

nav#tabs{display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom, 0px))}
nav#tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;font-weight:600;color:var(--muted);padding:6px 4px;border-radius:10px;min-width:48px}
nav#tabs button svg{width:22px;height:22px}
nav#tabs button.on{color:var(--accent)}

/* Agenda */
.calbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
.calbar .nav{display:flex;align-items:center;gap:4px}
.calbar h2{font-size:1.1rem;min-width:0}
.item{display:flex;gap:10px;padding:9px 12px;border-top:1px solid var(--line);align-items:flex-start;cursor:pointer}
.item:first-child{border-top:0}
.item:hover{background:var(--surface2)}
.item .time{flex:none;width:58px;font-variant-numeric:tabular-nums;font-size:.82rem;font-weight:600;padding-top:1px}
.item .bar{flex:none;width:4px;align-self:stretch;border-radius:4px;background:var(--accent)}
.item.task .bar{background:var(--teal)}
.item.alert .bar{background:var(--warn)}
.item.conf .time{color:var(--crit)}
.gap{padding:6px 12px 6px 80px;font-size:.78rem;color:var(--teal);border-top:1px dashed var(--line)}
.week{display:grid;grid-template-columns:1fr;gap:10px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;padding:8px 12px 4px}
.dayhead b{font-family:var(--f-display)}
.dayhead.today b{color:var(--accent)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.month .wd{font-size:.7rem;color:var(--muted);text-align:center;font-weight:600;padding:2px 0}
.mcell{background:var(--surface);border-radius:10px;min-height:58px;padding:5px;display:flex;flex-direction:column;gap:3px;border:0;text-align:left;box-shadow:var(--shadow)}
.mcell.out{opacity:.45}
.mcell.today{outline:2px solid var(--accent)}
.mcell .n{font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.mcell .dots{display:flex;flex-wrap:wrap;gap:3px}
.mcell .dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);display:block}
.mcell .dots i.t{background:var(--teal)}
.mcell .cnt{font-size:.68rem;color:var(--muted)}

/* Dinero */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border-radius:var(--r);padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.stat .v{font-family:var(--f-display);font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v.neg{color:var(--crit)} .stat .v.pos{color:var(--teal)}
.hbar{display:grid;grid-template-columns:minmax(90px,30%) 1fr auto;gap:8px;align-items:center;padding:6px 0;font-size:.85rem}
.hbar .track{height:12px;border-radius:0 4px 4px 0;background:transparent;position:relative}
.hbar .fill{height:100%;border-radius:0 4px 4px 0;background:var(--accent);min-width:2px}
.hbar .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.daily{width:100%;height:auto;display:block}
.daily text{fill:var(--muted);font-size:13px;font-family:var(--f-body)}
.daily .b{fill:var(--accent)} .daily .b:hover{opacity:.75}
.daily .grid{stroke:var(--line);stroke-width:1}
.tip{position:fixed;z-index:50;background:var(--ink);color:var(--bg);padding:5px 8px;border-radius:8px;font-size:.78rem;pointer-events:none}

.ck{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.ck.on{background:var(--teal);border-color:var(--teal);color:#fff}
.ck svg{width:14px;height:14px}
.prio{font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em}
.prio.alta{background:var(--crit-soft);color:var(--crit)} .prio.media{background:var(--warn-soft);color:var(--warn)} .prio.baja{background:var(--surface2);color:var(--muted)}
.habit{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.habit:first-child{border-top:0}
.hdots{display:flex;gap:4px}
.hdots button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.62rem;color:var(--muted);padding:0;font-weight:700}
.hdots button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.hdots button.today{outline:2px solid var(--accent);outline-offset:1px}

/* Sheet */
#sheetWrap{position:fixed;inset:0;z-index:40;background:rgba(20,10,25,.45);display:flex;align-items:flex-end;justify-content:center}
#sheet{background:var(--bg);width:min(560px,100%);max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){ #sheetWrap{align-items:center} #sheet{border-radius:20px} }
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.78rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw.on{outline:3px solid var(--accent);outline-offset:2px}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:12px;font-size:.88rem;max-width:min(92vw,480px);box-shadow:var(--shadow)}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.kbd{font-family:ui-monospace,Consolas,monospace;font-size:.8rem;background:var(--surface2);padding:1px 6px;border-radius:5px}
details summary{cursor:pointer;font-weight:600}
.typing::after{content:"…";animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}

@media (min-width:960px){
  #app{grid-template-rows:auto 1fr auto}
  main{grid-template-columns:420px 1fr;grid-template-rows:1fr;gap:0}
  #mila{border-right:1px solid var(--line);grid-row:1}
  #stage{height:40vh;max-height:420px}
  #stage.compact{height:40vh;min-height:190px}
  #stage.compact #bubble{left:12px;right:12px;width:auto;top:auto;bottom:10px;max-height:46%}
  #stage.compact .stageBtns{display:flex}
  #convo{display:flex !important;flex:1;min-height:0;overflow:auto;padding:12px 16px}
  #panel{grid-row:1;padding:14px 24px 24px}
  nav#tabs{grid-row:3;justify-content:center;gap:18px}
  #composerWrap{grid-row:auto}
  .week{grid-template-columns:repeat(7,minmax(0,1fr))}
  .week .list .item{flex-direction:column;gap:2px}
  .week .list .item .bar{display:none}
  .week .list .item .time{width:auto}
  .hide-desk{display:none !important}
}
#convo{display:none}
/* Recuerdos */
.rechero{display:flex;gap:14px;align-items:center}
.bigmic{flex:none;width:76px;height:76px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 22px color-mix(in srgb, var(--accent) 45%, transparent);animation:pulse 2.4s infinite}
.bigmic svg{width:34px;height:34px}
.rec{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:6px;border-left:4px solid var(--ec, var(--line))}
.rec h3{font-size:1.02rem}
.rec p{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.rechead{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.emo{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ec, var(--muted))}
.emo::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}

<script type="module">
/* =========================================================
   Mila — doble digital de Luzmila
   Capacidades: db (memoria privada), user, sample (Claude con herramientas),
   mcp (Google Calendar, Google Drive). Funciona en modo vista previa sin ellas.
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const uid8 = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const round2 = n => Math.round(n*100)/100;
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const DIAS_C = ["dom","lun","mar","mié","jue","vie","sáb"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pymd = s => { const [y,m,d] = String(s).slice(0,10).split("-").map(Number); return new Date(y,(m||1)-1,d||1); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const startDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const isoLocal = d => `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}:00`;
const hhmm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmtDia = d => `${DIAS_C[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}`;
const fmtDiaLargo = d => `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`;
const money = n => "S/ " + Number(n||0).toLocaleString("es-PE",{minimumFractionDigits:2,maximumFractionDigits:2});
const todayStr = () => ymd(new Date());
const diffDays = (a,b) => Math.round((startDay(b)-startDay(a))/86400000);

/* ---------------- Estado ---------------- */
const DEFAULT_PROFILE = {
  nombre:"Luzmila", asistente:"Mila", appUrl:"",
  avatar:{ piel:"#D29A72", pelo:"#17110E", peinado:"mono", ropa:"#26232C", labios:"#B5524E", lentes:false },
  ajustes:{ umbralGasto:100, autoEventos:true, proactividad:"normal", modelo:"auto", vozNombre:"", vozRate:1, vozPitch:1,
            hablar:true, autoEnviar:true, metodoPorDefecto:"Efectivo", silencioDesde:"23:00", silencioHasta:"07:00" },
  categorias:["Comida","Pasajes","Apoyo al hogar","Mascotas","Deudas","Cuidado personal","Recargas","Estudios","Salud","Ocio","Inversión","Otros"],
  metodos:["Efectivo","Yape","Plin","Tarjeta Scotiabank","Transferencia"],
  fuentes:["Scotiabank","Yape","Prácticas","Familia","Otro"]
};
const COLS = ["tareas","movimientos","memorias","notas","habitos","metas","registro","alertas","recuerdos"];
const S = { view:"hoy", yoTab:"memoria", profile:structuredClone(DEFAULT_PROFILE), chat:[], loaded:{},
  cal:{ status:"none", msg:"", ranges:{}, events:new Map() }, calView:{ mode:"semana", date:new Date() },
  dineroMes: (()=>{ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; })(),
  pendientes:new Map(), aiBusy:false, aiCtl:null, sttBlocked:false, caps:{} };
COLS.forEach(c => S[c] = []);

/* ---------------- Capacidades ---------------- */
let db=null, user=null, sample=null, mcp=null, perms=null;
const CAL = "Google Calendar", DRIVE = "Google Drive";

/* ---------------- Almacenamiento (db privada o memoria local en vista previa) ---------------- */
const Store = {
  mode:"mem", P:null, mem:{}, q:new Map(), unsubs:[],
  useDb(d, id){ this.mode="db"; this.P = d.doc(`data/users/${id}/profile`); },
  useMemory(){
    this.mode="mem";
    try{ this.mem = JSON.parse(localStorage.getItem("mila-preview")||"{}"); }catch{ this.mem={}; }
    COLS.forEach(c => this.mem[c] ||= {});
  },
  persistMem(){ try{ localStorage.setItem("mila-preview", JSON.stringify(this.mem)); }catch{} },
  chain(key, fn){ const prev = this.q.get(key)||Promise.resolve(); const p = prev.catch(()=>{}).then(fn); this.q.set(key,p); return p; },
  async set(c,id,data){
    if(this.mode==="db") return this.chain(c+"/"+id, ()=>this.P.collection(c).doc(id).set(data));
    this.mem[c][id]=structuredClone(data); this.persistMem(); this.emit(c);
  },
  async update(c,id,patch){
    if(this.mode==="db") return this.chain(c+"/"+id, ()=>this.P.collection(c).doc(id).update(patch));
    this.mem[c][id] = {...(this.mem[c][id]||{}), ...structuredClone(patch)}; this.persistMem(); this.emit(c);
  },
  async del(c,id){
    if(this.mode==="db") return this.chain(c+"/"+id, ()=>this.P.collection(c).doc(id).delete());
    delete this.mem[c][id]; this.persistMem(); this.emit(c);
  },
  async add(c,data){ const id = uid8(); await this.set(c,id,data); return id; },
  async saveProfile(patch){
    S.profile = deepMerge(S.profile, patch);
    if(this.mode==="db") return this.chain("profile", async ()=>{
      const snap = await this.P.get();
      if(snap.exists) await this.P.update(patch); else await this.P.set(S.profile);
    });
    this.mem.profile = S.profile; this.persistMem(); render();
  },
  async getRetrato(){
    if(this.mode==="db"){ const s = await this.P.collection("media").doc("retrato").get(); return s.exists ? s.data() : null; }
    try{ return JSON.parse(localStorage.getItem("mila-retrato")||"null"); }catch{ return null; }
  },
  async saveRetrato(d){
    if(this.mode==="db") return this.chain("retrato", ()=>d ? this.P.collection("media").doc("retrato").set(d) : this.P.collection("media").doc("retrato").delete());
    try{ d ? localStorage.setItem("mila-retrato", JSON.stringify(d)) : localStorage.removeItem("mila-retrato"); }catch{}
  },
  async saveChat(){
    const turnos = S.chat.slice(-40);
    if(this.mode==="db") return this.chain("chat", ()=>this.P.collection("estado").doc("chat").set({turnos}));
    this.mem.chat = turnos; this.persistMem();
  },
  emit(c){ S[c] = Object.entries(this.mem[c]).map(([id,d])=>({id,...d})); S.loaded[c]=true; render(); },
  subscribe(){
    if(this.mode==="mem"){
      COLS.forEach(c=>this.emit(c));
      if(this.mem.profile) S.profile = deepMerge(structuredClone(DEFAULT_PROFILE), this.mem.profile);
      S.chat = this.mem.chat||[]; S.loaded.profile = true; render(); return;
    }
    COLS.forEach(c=>{
      this.unsubs.push(this.P.collection(c).onSnapshot(snap=>{
        S[c] = snap.docs.map(d=>({id:d.id, ...d.data()})); S.loaded[c]=true; render();
      }, e=>dbError(e)));
    });
    this.unsubs.push(this.P.onSnapshot(snap=>{
      S.profile = deepMerge(structuredClone(DEFAULT_PROFILE), snap.exists ? snap.data() : {});
      S.loaded.profile = true;
      if(!snap.exists && !this.created){ this.created = true; this.chain("profile", ()=>this.P.set(S.profile)).catch(dbError); }
      Avatar.apply(S.profile.avatar); render();
    }, e=>dbError(e)));
    this.unsubs.push(this.P.collection("estado").doc("chat").onSnapshot(snap=>{
      if(snap.exists && !S.aiBusy){ S.chat = (snap.data().turnos||[]).slice(); render(); }
    }, e=>dbError(e)));
  }
};
function deepMerge(a,b){
  if(!b || typeof b!=="object" || Array.isArray(b)) return b===undefined ? a : b;
  const out = Array.isArray(a)||typeof a!=="object"||!a ? {} : {...a};
  for(const k of Object.keys(b)) out[k] = (b[k] && typeof b[k]==="object" && !Array.isArray(b[k])) ? deepMerge(out[k]||{}, b[k]) : b[k];
  return out;
}
function dbError(e){
  const m = { quota_exceeded:"La memoria de Mila está llena. Borra registros antiguos para seguir guardando.",
              resource_exhausted:"Demasiadas operaciones seguidas. Espera unos segundos.",
              revoked:"Se perdió el acceso a tus datos en esta vista. Recarga la página." }[e?.code];
  toast(m || "No pude guardar en tu memoria privada. Intenta de nuevo.");
}

/* ---------------- Utilidades de UI ---------------- */
let toastT;
function toast(msg, ms=3200){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, ms); }
let renderQueued=false;
function render(){ if(renderQueued) return; renderQueued=true; setTimeout(()=>{ renderQueued=false; try{ renderAll(); }catch(e){ console.error("render", e); } }, 0); }
const ICON = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
  left:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg>',
  right:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>',
  play:'<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'
};

/* =========================================================
   Lenguaje natural local: montos, fechas y categorías
   ========================================================= */
const NUMW = {cero:0,un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,
  dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,veintiun:21,veintiuno:21,veintiuna:21,veintidos:22,veintitres:23,veinticuatro:24,veinticinco:25,
  veintiseis:26,veintisiete:27,veintiocho:28,veintinueve:29,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,
  cien:100,ciento:100,doscientos:200,doscientas:200,trescientos:300,trescientas:300,cuatrocientos:400,quinientos:500,quinientas:500,seiscientos:600,setecientos:700,ochocientos:800,novecientos:900};
function wordsNumber(tokens, i){
  let total=0, cur=0, used=0, j=i;
  while(j<tokens.length){
    const w=tokens[j];
    if(w in NUMW){ cur += NUMW[w]; used++; j++; continue; }
    if(w==="mil" ){ cur = (cur||1)*1000; total+=cur; cur=0; used++; j++; continue; }
    if(w==="y" && used && j+1<tokens.length && tokens[j+1] in NUMW){ j++; continue; }
    break;
  }
  return used ? {value: total+cur, next:j} : null;
}
function parseMonto(text){
  const t = norm(text).replace(/s\/\.?/g," s/ ");
  // dígitos con soles o S/
  let m = t.match(/s\/\s*(\d+(?:[.,]\d{1,2})?)/) || t.match(/(\d+(?:[.,]\d{1,2})?)\s*(?:soles?|lucas?|so\b)/);
  if(m){
    let v = parseFloat(m[1].replace(",","."));
    const after = t.slice(t.indexOf(m[0])+m[0].length);
    const c = after.match(/^\s*(?:con\s+)?(\d{1,2})\s*(?:centimos|cent)/) || after.match(/^\s*con\s+(\d{1,2})\b/);
    if(c) v += Number(c[1])/100;
    return round2(v);
  }
  // palabras
  const tokens = t.replace(/[^a-z0-9ñ\s]/g," ").split(/\s+/).filter(Boolean);
  for(let i=0;i<tokens.length;i++){
    const r = wordsNumber(tokens,i);
    if(!r) continue;
    let v = r.value, j=r.next;
    const unit = tokens[j];
    const isMoney = /^(soles?|lucas?)$/.test(unit||"");
    if(isMoney) j++;
    if(tokens[j]==="con"){ const d = wordsNumber(tokens,j+1) || (/^\d+$/.test(tokens[j+1]||"") ? {value:Number(tokens[j+1]),next:j+2} : null); if(d && d.value<100) v += d.value/100; }
    if(tokens[j]==="y" && tokens[j+1]==="medio") v += 0.5;
    if(isMoney) return round2(v);
    i = r.next-1;
  }
  // un número suelto (si la frase es claramente de dinero)
  m = t.match(/\b(\d+(?:[.,]\d{1,2})?)\b/);
  return m ? round2(parseFloat(m[1].replace(",","."))) : null;
}
const CAT_KW = [
  ["Pasajes", /pasaje|taxi|combi|micro\b|colectivo|movilidad|bus\b|uber|moto(taxi)?|indrive|cabify/],
  ["Comida", /almuerzo|menu|desayuno|cena|comida|jugo|cafe|latte|helado|cachito|empanada|galleta|snack|chicha|yogurt|sandwich|pan\b|pollo a la brasa|salchipapa|gaseosa|agua mineral|fruta|lonche|golosina|chocolate|papa rellena|chifa|ceviche|tentacion/],
  ["Apoyo al hogar", /leche|internet|luz\b|agua\b|mercado|viveres|gas\b|abarrotes|arroz|azucar|aceite|limpieza|detergente|cable|alquiler/],
  ["Mascotas", /gato|perro|mascota|higado|veterinari|arena|croqueta/],
  ["Deudas", /deuda|prestamo|le debia|pague a|cuota/],
  ["Cuidado personal", /shampoo|champu|acondicionador|desodorante|crema|mechas|peluqueria|corte de pelo|maquillaje|perfume|jabon|cepillo|toalla/],
  ["Recargas", /recarga|saldo|megas|plan (de )?celular/],
  ["Estudios", /copias|impresion|imprimir|libro|curso|matricula|util(es)?|cuaderno|lapicero|tesis|anillado|empastado|fotocopia|separata/],
  ["Salud", /farmacia|pastilla|medicina|consulta|doctor|dentista|analisis|vitamina/],
  ["Ocio", /cine|salida|regalo|juego|concierto|netflix|spotify|fiesta|cumple/],
  ["Inversión", /inversion|hapi|acciones|bolsa|cripto|solana|etf|voo/]
];
function inferCat(text){ const t=norm(text); for(const [c,re] of CAT_KW) if(re.test(t)) return c; return null; }
function inferMetodo(text){
  const t=norm(text);
  if(/yape|yapee|yapeo/.test(t)) return "Yape";
  if(/plin/.test(t)) return "Plin";
  if(/tarjeta|scotia|debito|credito/.test(t)) return "Tarjeta Scotiabank";
  if(/efectivo|cash|sencillo/.test(t)) return "Efectivo";
  if(/transferencia/.test(t)) return "Transferencia";
  return null;
}
function matchCat(name){
  if(!name) return null;
  const n = norm(name);
  return S.profile.categorias.find(c=>norm(c)===n) || S.profile.categorias.find(c=>norm(c).startsWith(n)||n.startsWith(norm(c))) || inferCat(name) || null;
}
function extractConcepto(text){
  let t = " "+norm(text).replace(/[¿?¡!.,;:]/g," ")+" ";
  t = t.replace(/\b(con|por|via|en)\s+(yape|plin|efectivo|tarjeta( scotiabank| de credito| de debito)?|transferencia)\b/g," ")
       .replace(/\b(hoy|ayer|ahorita|recien|antes)\b/g," ");
  const nw = [...Object.keys(NUMW),"mil","y","medio"].join("|");
  t = t.replace(new RegExp(`\\b(?:(?:${nw})\\s+)+(?:soles?|lucas?)(?:\\s+con\\s+(?:(?:${nw})\\s*)+(?:centimos)?)?`,"g")," MONTO ")
       .replace(/(?:s\/\s*)?\d+(?:[.,]\d+)?\s*(?:soles?|lucas?)?(?:\s+con\s+\d+\s*(?:centimos)?)?/g," MONTO ");
  const art = "(?:(?:un|una|el|la|los|las|mi|mis|unos|unas|del|al)\\s+)?";
  let m = t.match(new RegExp(`\\b(?:en|por|para|de)\\s+${art}([a-zñ][a-zñ ]*?)\\s*(?:MONTO|$)`))
       || t.match(new RegExp(`\\b(?:gaste|pague|compre|me costo|me salio)\\s+${art}([a-zñ][a-zñ ]*?)\\s+(?:a|en|por)\\s+MONTO`));
  let c = m ? m[1].trim() : "";
  c = c.replace(/\b(soles?|lucas?)\b/g,"").replace(/\s+/g," ").trim();
  if(!c || /^(algo|cosas?|compras?|una compra|varios|varias cosas)$/.test(c)) return {concepto:"Compra", generico:true};
  return {concepto: c.charAt(0).toUpperCase()+c.slice(1), generico:false};
}
/* Fechas: devuelve {desde, hasta, label, single} */
function nextWeekday(base, wd, strictlyAfter=false){ const d=startDay(base); let diff=(wd-d.getDay()+7)%7; if(diff===0 && strictlyAfter) diff=7; return addDays(d,diff); }
function parseFecha(text, base=new Date()){
  const t = norm(text);
  const day = d => ({desde:ymd(d), hasta:ymd(d), single:true, label:fmtDiaLargo(d)});
  if(/pasado manana/.test(t)) return day(addDays(base,2));
  if(/\bmanana\b/.test(t) && !/\b(la|de la|en la|por la|esta)\s+manana\b/.test(t)) return day(addDays(base,1));
  if(/\bayer\b/.test(t)) return day(addDays(base,-1));
  if(/\bhoy\b|\besta (tarde|noche)\b/.test(t)) return day(base);
  if(/fin de semana/.test(t)){ const sat=nextWeekday(base,6); const sun=addDays(sat,1); const from = base.getDay()===0 ? startDay(base) : sat; return {desde:ymd(from), hasta:ymd(base.getDay()===0?startDay(base):sun), label:"este fin de semana"}; }
  if(/(proxima semana|semana que viene|siguiente semana)/.test(t)){ const mon=nextWeekday(base,1,true); return {desde:ymd(mon), hasta:ymd(addDays(mon,6)), label:"la próxima semana"}; }
  if(/(esta semana|la semana|semana)/.test(t)){ const end = addDays(startDay(base), (7-base.getDay())%7); return {desde:ymd(base), hasta:ymd(end), label:"esta semana"}; }
  if(/(proximo mes|mes que viene)/.test(t)){ const a=new Date(base.getFullYear(),base.getMonth()+1,1), b=new Date(base.getFullYear(),base.getMonth()+2,0); return {desde:ymd(a),hasta:ymd(b),label:MESES[a.getMonth()]}; }
  if(/(este mes|el mes)/.test(t)){ const b=new Date(base.getFullYear(),base.getMonth()+1,0); return {desde:ymd(base),hasta:ymd(b),label:"lo que queda del mes"}; }
  const wdNames=["domingo","lunes","martes","miercoles","jueves","viernes","sabado"];
  for(let i=0;i<7;i++){ const re=new RegExp(`\\b(proximo|siguiente)?\\s*${wdNames[i]}\\b`); const m=t.match(re); if(m){ return day(nextWeekday(base,i, !!m[1])); } }
  let m = t.match(/\b(\d{1,2})\s+de\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)\b/);
  if(m){ let mi = MESES.indexOf(m[2]==="setiembre"?"septiembre":m[2]); let d=new Date(base.getFullYear(),mi,Number(m[1])); if(d<addDays(startDay(base),-60)) d=new Date(base.getFullYear()+1,mi,Number(m[1])); return day(d); }
  m = t.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);
  if(m){ const y = m[3] ? (m[3].length===2 ? 2000+Number(m[3]) : Number(m[3])) : base.getFullYear(); return day(new Date(y, Number(m[2])-1, Number(m[1]))); }
  m = t.match(/\bel\s+(\d{1,2})\b/);
  if(m){ let d=new Date(base.getFullYear(),base.getMonth(),Number(m[1])); if(d<startDay(base)) d=new Date(base.getFullYear(),base.getMonth()+1,Number(m[1])); return day(d); }
  return null;
}

const MCP_COPY = {
  needs_reauth:"Tu conexión con {s} venció. Reconéctala en claude.ai → Ajustes → Conectores.",
  server_not_connected:"Agrega {s} en claude.ai → Ajustes → Conectores para que Mila pueda usarlo.",
  selection_required:"Tienes más de una cuenta de {s}. Elige cuál usar en el aviso de claude.ai.",
  not_in_manifest:"No diste permiso a Mila para usar {s}. Actívalo en el menú Permisos de esta página.",
  blocked_by_policy:"Tu organización bloquea {s} en esta página.",
  approval_required:"Hace falta tu aprobación para usar {s}.",
  server_unavailable:"{s} no respondió. Intenta de nuevo en un momento.",
  tool_error:"{s} rechazó la acción: {m}",
  not_granted:"Esta vista no tiene acceso a tus conectores.",
  capability_disabled:"Esta vista no puede usar tus conectores."
};
function mcpMsg(e, s){ const tpl = MCP_COPY[e?.code] || "{s} no respondió como esperaba. Intenta de nuevo."; return tpl.replace("{s}",s).replace("{m}", String(e?.message||"").slice(0,160)); }
async function calCall(tool, input, opts){
  if(!mcp) throw {code:"capability_disabled", message:"sin mcp"};
  const r = await mcp.callTool(CAL, tool, input, opts);
  return r.payload ?? r;
}
function normEvent(e){
  const sd = e.start?.dateTime || e.start?.date, ed = e.end?.dateTime || e.end?.date;
  if(!sd) return null;
  const allDay = !e.start?.dateTime;
  const ini = allDay ? pymd(sd) : new Date(sd), fin = ed ? (allDay ? pymd(ed) : new Date(ed)) : ini;
  return { id:e.id, titulo:e.summary||"(sin título)", ini, fin, allDay, link:e.htmlLink||"", meet:e.conferenceUrl||e.hangoutLink||"",
    desc:e.description||"", lugar:e.location||"", recurrente:!!e.recurringEventId, propio: e.organizer?.self ?? e.creator?.self ?? true, tipo:"evento" };
}
async function loadEvents(desde, hasta, {force=false}={}){
  const key = desde+"_"+hasta;
  const prev = S.cal.ranges[key];
  if(prev && !force && Date.now()-prev.at < 120000) return prev.list;
  let all=[], pageToken, guard=0;
  do{
    const p = await calCall("list_events", { startTime:`${desde}T00:00:00`, endTime:`${ymd(addDays(pymd(hasta),1))}T00:00:00`, orderBy:"startTime", pageSize:250, ...(pageToken?{pageToken}:{}) },
                            { cache:{ staleTime:60000, gcTime:600000, refresh:force } });
    all = all.concat((p?.events||[]).map(normEvent).filter(Boolean));
    pageToken = p?.nextPageToken; guard++;
  } while(pageToken && guard<4);
  // quitar eventos viejos del rango y agregar nuevos
  for(const [id,ev] of S.cal.events){ if(ymd(ev.ini)>=desde && ymd(ev.ini)<=hasta) S.cal.events.delete(id); }
  all.forEach(ev=>S.cal.events.set(ev.id, ev));
  S.cal.ranges[key] = {at:Date.now(), list:all};
  S.cal.status = "ok"; S.cal.msg="";
  render();
  return all;
}
async function ensureEvents(desde, hasta, opts){
  if(!mcp) return [];
  try { return await loadEvents(desde, hasta, opts); }
  catch(e){ S.cal.status = "error"; S.cal.msg = mcpMsg(e, CAL); S.cal.code = e?.code; render(); throw e; }
}
function eventsBetween(desde, hasta){
  return [...S.cal.events.values()].filter(ev => ymd(ev.ini)<=hasta && ymd(ev.allDay?addDays(ev.fin,-1):ev.fin)>=desde).sort((a,b)=>a.ini-b.ini);
}
async function calInit(){
  if(!mcp){ S.cal.status="none"; render(); return; }
  let st="prompt";
  try{ st = perms ? await perms.state("mcp:"+CAL) : "prompt"; }catch{}
  if(st==="granted"){
    S.cal.status="loading"; render();
    const t=new Date(); ensureEvents(ymd(addDays(t,-3)), ymd(addDays(t,21))).catch(()=>{});
  } else if(st==="denied"){ S.cal.status="denied"; render(); }
  else { S.cal.status="connect"; render(); }
}
function conflictsIn(list){
  const timed = list.filter(x=>!x.allDay && x.ini && x.fin>x.ini).sort((a,b)=>a.ini-b.ini);
  const out = new Set();
  for(let i=0;i<timed.length;i++) for(let j=i+1;j<timed.length;j++){ if(timed[j].ini < timed[i].fin){ out.add(timed[i].id); out.add(timed[j].id);} else break; }
  return out;
}

  try{

function localIntent(text){
  const t = norm(text);
  const gasto = /\b(gaste|gasto|pague|compre|me costo|me cobraron|me salio|invertí|inverti)\b/.test(t);
  const ingreso = /\b(recibi|me pagaron|cobre|me depositaron|me yapearon|me transfirieron|ingreso|gane|me dieron)\b/.test(t);
  if((gasto||ingreso) && !/\?/.test(text) && !/(cuanto|resumen|total)/.test(t)){
    const monto = parseMonto(text);
    if(monto){
      const f = parseFecha(text);
      const {concepto, generico} = extractConcepto(text);
      return {kind:"mov", inp:{ tipo: ingreso&&!gasto?"ingreso":"gasto", monto, concepto, categoria: generico?null:inferCat(concepto)||inferCat(text),
        metodo: inferMetodo(text), fecha: f?.single ? f.desde : undefined, fuente: ingreso ? (inferMetodo(text)||"") : "" }};
    }
  }
  if(/\b(que tengo|tengo algo|mi agenda|que hay (para|el|este|esta)|que me toca|planes para|que eventos)\b/.test(t) && !/(olvid|organiza|planifica|prioriza)/.test(t)){
    const f = parseFecha(text) || {desde:todayStr(), hasta:todayStr(), single:true, label:"hoy"};
    return {kind:"agenda", f};
  }
  return null;
}
function itemsFor(desde, hasta){
  const ev = eventsBetween(desde, hasta);
  const ts = S.tareas.filter(t=>t.estado!=="hecha" && t.vence && t.vence>=desde && t.vence<=hasta);
  const al = S.alertas.filter(a=>a.cuando.slice(0,10)>=desde && a.cuando.slice(0,10)<=hasta);
  return {ev, ts, al};
}
function describeRange(f){
  const {ev, ts} = itemsFor(f.desde, f.hasta);
  const calOk = S.cal.status==="ok";
  const evTxt = ev.length ? ev.slice(0,6).map(e=> (f.single?"":DIAS[e.ini.getDay()]+" ") + (e.allDay?"todo el día":"a las "+hhmm(e.ini)) + ", " + e.titulo).join("; ") : "";
  let s = `${f.single?("Para el "+f.label):("Para "+f.label)}: `;
  if(!calOk) s += "aún no puedo ver tu Google Calendar. ";
  else s += ev.length ? `${ev.length} ${ev.length===1?"evento":"eventos"} — ${evTxt}${ev.length>6?", y más":""}. ` : "no tienes eventos. ";
  s += ts.length ? `Tareas: ${ts.map(t=>t.titulo).slice(0,5).join(", ")}.` : "Sin tareas con fecha.";
  return s;
}
async function handleLocal(intent, text){
  if(intent.kind==="mov"){
    const r = await A.movimiento(intent.inp, "voz");
    curCards.push({k:"mov", id:r.id});
    if(r.estado==="registrado") return `Listo, registré ${money(intent.inp.monto)} en ${S.movimientos.find(m=>m.id===r.id)?.categoria || matchCat(intent.inp.categoria) || inferCat(intent.inp.concepto) || "gastos"}.`;
    if(r.faltan.includes("categoria")) return `Anoté ${money(intent.inp.monto)} como pendiente. ¿En qué categoría lo pongo?`;
    return `Anoté ${money(intent.inp.monto)}. Como supera tu límite, confírmalo y quedará registrado.`;
  }
  if(intent.kind==="agenda"){
    const f = intent.f;
    if(mcp && S.cal.status!=="denied"){ try{ await ensureEvents(f.desde, f.hasta); }catch{} }
    S.calView.date = pymd(f.desde); S.calView.mode = f.single ? "dia" : "semana";
    curCards.push({k:"agenda", desde:f.desde, hasta:f.hasta, label:f.label});
    return describeRange(f);
  }
}

const EMOS = [["alegre","Alegre"],["gracioso","Gracioso"],["logro","Logro"],["gratitud","Gratitud"],["aprendizaje","Aprendizaje"],["triste","Triste"],["dificil","Difícil"]];
const emoLabel = k => (EMOS.find(e=>e[0]===k)||[k,"Recuerdo"])[1];
const REC_PROMPTS = ["¿Qué te hizo reír esta semana?","Cuéntame un logro del que te sientas orgullosa.","¿Qué momento de tu infancia recuerdas con cariño?","¿Qué aprendiste de algo difícil que viviste?","¿A quién le agradeces algo hoy y por qué?","¿Cuál fue el mejor momento de tu día?","Cuéntame algo que te dio roche y hoy te da risa.","¿Qué te puso triste últimamente? Puedes contármelo.","¿Qué hiciste por primera vez este año?","Cuéntame de alguien que te hizo sentir querida."];
const REC_REPLY = { gracioso:"Jaja, ¡qué buena! Ya la guardé para cuando necesites reírte.", logro:"¡Qué orgullo! Lo guardé entre tus logros.", alegre:"Qué bonito momento. Ya quedó guardado.",
  gratitud:"Qué lindo que lo valores. Lo guardé.", aprendizaje:"Lo guardé. Es valioso lo que te llevaste de eso.", triste:"Gracias por contármelo. Lo guardé con cuidado; aquí estoy si quieres hablar.", dificil:"Gracias por confiarme esto. Ya está guardado; fue difícil y lo atravesaste." };
function localRecMeta(raw){
  const t=norm(raw); let emocion="alegre";
  if(/(jaja|risa|gracios|chistos|me rei|nos reimos|roche|vergonz|palta)/.test(t)) emocion="gracioso";
  else if(/(logre|aprobe|gane|consegui|me aceptaron|orgullos|termine|ingrese|me eligieron|ocupe el primer)/.test(t)) emocion="logro";
  else if(/(triste|llore|extran|perdi|murio|falleci|me duele|dolio|me senti sola|pena)/.test(t)) emocion="triste";
  else if(/(aprendi|leccion|me di cuenta|entendi que)/.test(t)) emocion="aprendizaje";
  else if(/(gracias|agradec|bendec)/.test(t)) emocion="gratitud";
  else if(/(miedo|ansiedad|estres|discusion|pelea|me enoje|frustr)/.test(t)) emocion="dificil";
  const f=parseFecha(raw); const w=raw.trim().split(/\s+/);
  return { titulo: w.slice(0,7).join(" ")+(w.length>7?"…":""), texto_limpio: raw.trim(), fecha: f?.single?f.desde:null, fecha_aprox:null, emocion, intensidad:3, personas:[], lugar:null, etiquetas:[], respuesta:REC_REPLY[emocion] };
}
function promptRecuerdo(raw){
  return `${S.profile.nombre} te dictó por voz este recuerdo de su vida (puede tener errores de dictado). Hoy es ${DIAS[new Date().getDay()]} ${todayStr()}.
RECUERDO:
"""${raw.slice(0,8000)}"""
Responde SOLO con JSON: {"titulo": string (máx. 8 palabras, evocador), "texto_limpio": string (su mismo relato en primera persona; corrige solo puntuación y errores evidentes de dictado; no agregues ni quites hechos), "fecha": "YYYY-MM-DD" o null (solo si se deduce con seguridad: hoy, ayer, una fecha dicha), "fecha_aprox": string o null (p. ej. "cuando tenía 10 años", "verano de 2019"), "emocion": una de ${EMOS.map(e=>e[0]).join("|")}, "intensidad": 1-5, "personas": [nombres o vínculos mencionados], "lugar": string o null, "etiquetas": [máx. 4 palabras clave], "respuesta": string (1-2 frases cálidas en español de Perú para decirle en voz alta: si es gracioso, ríe con ella; si es un logro, celébralo; si es triste o difícil, valida lo que sintió sin dar consejos ni minimizar; si hubiera señales de riesgo para su vida, dile con cariño que no está sola y que puede llamar a la Línea 113, opción 5)}`;
}
async function guardarRecuerdo(raw, {appendTo=null, origen="voz", meta=null}={}){
  raw = String(raw||"").trim(); if(!raw) throw new Error("El recuerdo está vacío.");
  let id = appendTo;
  if(appendTo){ const r=S.recuerdos.find(x=>x.id===appendTo); raw = ((r?.relato||"")+"\n"+raw).trim(); await Store.update("recuerdos", id, {relato:raw, estado:"procesando"}); }
  else id = await Store.add("recuerdos", {relato:raw, texto:raw, titulo:"Ordenando tu recuerdo…", fecha:"", fecha_aprox:"", emocion:"", intensidad:3, personas:[], lugar:"", etiquetas:[], estado:"procesando", origen, creado:Date.now()});
  if(!meta && sample){ try{ meta = await sample.json(promptRecuerdo(raw), {modelTier:"quick", cache:false}); }catch{ meta=null; } }
  if(!meta || typeof meta!=="object") meta = localRecMeta(raw);
  const emocion = EMOS.some(e=>e[0]===meta.emocion) ? meta.emocion : localRecMeta(raw).emocion;
  const doc = { titulo:String(meta.titulo||"Recuerdo").slice(0,90), texto:String(meta.texto_limpio||meta.texto||raw), fecha:/^\d{4}-\d{2}-\d{2}$/.test(meta.fecha||"")?meta.fecha:"",
    fecha_aprox:String(meta.fecha_aprox||""), emocion, intensidad:Math.max(1,Math.min(5,Number(meta.intensidad)||3)),
    personas:(Array.isArray(meta.personas)?meta.personas:[]).slice(0,8).map(String), lugar:String(meta.lugar||""),
    etiquetas:(Array.isArray(meta.etiquetas)?meta.etiquetas:[]).slice(0,5).map(String), estado:"listo" };
  await Store.update("recuerdos", id, doc);
  if(!appendTo) await logAction(`Recuerdo guardado: ${doc.titulo}`, {op:"del", col:"recuerdos", id});
  return {ok:true, id, emocion, respuesta:String(meta.respuesta||REC_REPLY[emocion]||"Lo guardé."), resumen:`Recuerdo «${doc.titulo}» guardado (${emoLabel(emocion)})`};
}
function recFecha(r){ if(r.fecha){ const d=pymd(r.fecha); return `${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`; } return r.fecha_aprox || `contado el ${fmtDia(new Date(r.creado||Date.now()))}`; }
function startRecMode(appendTo=null, prompt=""){
  TTS.stop(); cancelAutoSend();
  S.modoRec = {appendTo, prompt};
  const q=$("#q"); q.focus(); q.placeholder = appendTo ? "Sigue contando…" : "Cuéntame tu recuerdo…";
  Avatar.setState("escuchando"); Avatar.setEmotion("alegre");
  if(prompt) setBubble(prompt); else setBubble(appendTo ? "Te escucho, sigue contándome." : "Te escucho. Cuéntamelo con calma.");
  const h=$("#hint"); h.hidden=false;
  h.innerHTML = `<b>Modo recuerdo.</b> Toca el micrófono de tu teclado y habla con calma. Lo guardaré cuando hagas una pausa larga. <button type="button" class="btn sm ghost" data-act="recCancel">Cancelar</button>`;
}
function endRecMode(){ S.modoRec=null; $("#q").placeholder="Háblame o escribe…"; $("#hint").hidden=true; }
async function sendRecuerdo(text){
  const mode=S.modoRec; endRecMode(); cancelAutoSend();
  $("#q").value=""; autosize();
  S.chat.push({r:"u", t:text, ts:Date.now()});
  const turn={r:"a", t:"", ts:Date.now(), cards:[]}; S.chat.push(turn);
  S.aiBusy=true; Oido.pause(); Avatar.setState("pensando"); setBubble("", true); render();
  try{
    const r = await guardarRecuerdo(text, {appendTo:mode?.appendTo||null});
    turn.cards.push({k:"rec", id:r.id}); turn.t = r.respuesta;
    Avatar.setEmotion({gracioso:"animada", logro:"animada", triste:"preocupada", dificil:"preocupada", aprendizaje:"pensativa"}[r.emocion] || "alegre");
  }catch(e){ turn.t = "No pude guardar el recuerdo: "+(e?.message||"error"); Avatar.setEmotion("preocupada"); }
  S.aiBusy=false; setBubble(turn.t); render(); Store.saveChat().catch(()=>{});
  if(S.profile.ajustes.hablar) TTS.speak(turn.t); else { Avatar.setState("idle"); Oido.resume(); }
}

function chooseTier(text){

async function askAI(text){
  if(!sample) return {text: S.caps.preview ? "En la vista previa no tengo conexión con Claude. Prueba un comando rápido: «Gasté 9 soles en pasajes» o «¿Qué tengo el sábado?»." : (S.standalone ? "Para entender frases libres necesito tu clave de la API de Claude: Yo → Ajustes → App propia. Los comandos rápidos (gastos y agenda) sí funcionan." : "Para frases libres necesito acceso a Claude, que no está disponible en esta vista. Los comandos rápidos sí funcionan.")};
  const lim = await sample.limits().catch(()=>null);
  const hist = [];
  for(const m of S.chat.slice(-13, -2)){ if(m.t) hist.push({role: m.r==="u"?"user":"assistant", content: m.t.slice(0,800)}); }
  const input = [{role:"user", content: contexto()}, ...hist, {role:"user", content: text}];
  const ctl = new AbortController(); S.aiCtl = ctl;
  try{
    if(lim?.tools){
      const tools = TOOL_DEFS.slice(0, lim.tools.maxCount);
      const r = await sample(input, { tools, modelTier: chooseTier(text), signal: ctl.signal, onText:({text})=>setBubble(cleanAI(text).t, true) });
      return cleanAI(r.text);
    }
    // Sin herramientas: plan en JSON y ejecución local
    const plan = await sample.json([...input.slice(0,-1), {role:"user", content: text + `\n\nResponde SOLO JSON: {"respuesta": string, "emo": string, "acciones": [{"herramienta": uno de ${TOOL_DEFS.map(t=>t.name).join("|")}, "datos": objeto}]}`}], { modelTier: chooseTier(text), signal: ctl.signal, cache:false });
    for(const a of (plan?.acciones||[]).slice(0,8)){ const tdef = TOOL_DEFS.find(t=>t.name===a.herramienta); if(tdef){ try{ await tdef.execute(a.datos||{}); }catch(e){ curCards.push({k:"err", texto:e.message}); } } }
    return {t: String(plan?.respuesta||"Hecho."), emo: plan?.emo};
  }catch(e){
    if(e?.code==="cancelled") return {t: e.text ? cleanAI(e.text).t : "Detenido."};
    if(S.standalone && e?.message) return {t: e.message, emo:"preocupada"};
    return {t: AI_ERR[e?.code] || "No pude completar eso. Inténtalo de nuevo.", emo:"preocupada"};
  }finally{ S.aiCtl=null; }
}
function cleanAI(text){
  let t = String(text||"").trim(); let emo=null;
  const m = t.match(/\[emo:([a-záéíóú]+)\]/i); if(m){ emo=norm(m[1]); }
  t = t.replace(/\[emo:[^\]]*\]\s*/gi,"").replace(/\*\*/g,"").replace(/^#+\s*/gm,"").trim();
  return {t, emo};
}

  score(v){
    const n=v.name.toLowerCase(), l=v.lang.toLowerCase().replace("_","-"); let s=0;
    if(/natural|neural|online|premium|enhanced|mejorada/.test(n)) s+=10;
    if(l.includes("es-pe")) s+=5; else if(/es-(419|mx|us|co|ar|cl)/.test(l)) s+=3; else if(l.startsWith("es")) s+=1;
    if(/camila|dalia|paloma|elena|salome|lupe|paulina|monica|sabina|helena|google/.test(n)) s+=2;
    if(/\b(male|jorge|alvaro|raul|pablo|alex|gonzalo|tomas|diego|enrique|andres|gerardo|jorge)\b/.test(n) && !/female/.test(n)) s-=4;
    return s;
  },
  ranked(){ return this.voices.slice().sort((a,b)=>this.score(b)-this.score(a)); },
  natural(v){ return /natural|neural|online|premium|enhanced|mejorada/i.test(v.name); },
  pick(){
    const want = S.profile.ajustes.vozNombre;
    return this.voices.find(v=>v.name===want) || this.ranked()[0] || null;
  },
  chunks(text){ return String(text).replace(/S\/\s?/g,"").match(/[^.!?;]+[.!?;]*/g)?.map(s=>s.trim()).filter(Boolean) || [text]; },

    this.speakDevice(text);
  },
  speakDevice(text){
    if(!this.ok || !text){ Avatar.setState("idle"); return; }
    speechSynthesis.cancel(); Oido.pause();
    const parts = this.chunks(prepVoz(text));
    const voice = this.pick(); const a = S.profile.ajustes;
    parts.forEach((p,idx)=>{
      const u = new SpeechSynthesisUtterance(p);
      if(voice){ u.voice=voice; u.lang=voice.lang; } else u.lang="es-PE";
      u.rate = Number(a.vozRate)||1; u.pitch = Number(a.vozPitch)||1;

const Retrato = (()=>{
  let el, cv, gl, prog, U={}, tex, W=1, H=1, LM=null, ready=false, running=false, view=[0,0,1,1];
  let state="idle", emo="neutral", t0=performance.now();
  const mouth={open:0,to:0,smile:.1,ts:.1}; const look={x:0,y:0,tx:0,ty:0};
  let seq=[], seqStart=0, seqRate=1, blinkAt=performance.now()+2200, blinkT=-1e9, brow=0, tilt=0, ext=0, extT=-1e9;
  const OPEN={a:.9,e:.55,i:.3,o:.75,u:.4,m:0,f:.12,c:.28,_:.04};
  const shapeOf = ch => { ch=norm(ch); if(ch==="a") return "a"; if(ch==="e") return "e"; if(ch==="i"||ch==="y") return "i"; if(ch==="o") return "o"; if(ch==="u") return "u"; if("mbp".includes(ch)) return "m"; if("fv".includes(ch)) return "f"; if(/[a-zñ]/.test(ch)) return "c"; return "_"; };
  const VS=`attribute vec2 a; varying vec2 vUv; void main(){ vUv=vec2(a.x*.5+.5, .5-a.y*.5); gl_Position=vec4(a,0.,1.); }`;
  const FS=`precision highp float;
varying vec2 vUv; uniform sampler2D tex; uniform vec2 img; uniform vec4 view;
uniform vec2 eL; uniform vec2 eR; uniform vec2 eS; uniform vec2 mo; uniform float mw; uniform float lipT; uniform float lipB;
uniform vec2 chin; uniform vec2 neck; uniform float open; uniform float smile; uniform float blink; uniform float brow; uniform float tilt; uniform vec2 head; uniform float breath;
vec4 samp(vec2 s){ return texture2D(tex, clamp(s, vec2(.5), img-.5)/img); }
void main(){
  vec2 p = view.xy + vUv*view.zw;
  float alpha = smoothstep(0.,70.,p.x)*(1.-smoothstep(img.x-70.,img.x,p.x))*(1.-smoothstep(img.y-30.,img.y,p.y))*smoothstep(0.,12.,p.y);
  if(alpha<=0.){ gl_FragColor=vec4(0.); return; }
  vec2 s = p; s.y = img.y - (img.y - s.y)/(1.+breath);
  float d = eR.x - eL.x; vec2 fc = vec2((eL.x+eR.x)*.5, (eL.y+chin.y)*.5);
  float wh = 1. - smoothstep(.85, 1.5, length((s-fc)/vec2(d*1.25, d*1.6)));
  vec2 q = s - neck; float an = -tilt*wh; float c=cos(an), sn=sin(an);
  s = neck + vec2(c*q.x - sn*q.y, sn*q.x + c*q.y) - head*wh;
  vec2 src = s;
  float dx = (s.x-mo.x)/(mw*1.45); float wx = 1. - smoothstep(.5, 1., abs(dx));
  float t = (s.y-mo.y)/(chin.y-mo.y); float drop = open*(lipB-mo.y)*1.1;
  float wj = wx*smoothstep(-.03,.04,t)*(1.-smoothstep(.95,1.7,t));
  src.y -= drop*wj;
  for(int k=0;k<2;k++){ float sg = k==0 ? -1. : 1.; vec2 cp = mo + vec2(sg*mw, 0.);
    float wc = 1. - smoothstep(0., 1., length((s-cp)/vec2(mw*.75, (lipB-lipT)*1.4)));
    src += vec2(-sg*smile*mw*.06, smile*(lipB-lipT)*.28)*wc; }
  for(int k=0;k<2;k++){ vec2 E = k==0 ? eL : eR; vec2 b = (s-(E-vec2(0., eS.y*3.6)))/vec2(eS.x*1.4, eS.y*2.8);
    src.y += brow*eS.y*.6*(1.-smoothstep(.5,1.,length(b))); }
  vec4 col = samp(src);
  if(drop > .4){
    float ex = abs((s.x-mo.x)/(mw*.8)); float lineY = mo.y - smile*(lipB-lipT)*.25*ex*ex;
    float bottom = lineY + drop*sqrt(max(0., 1.-ex*ex));
    float inside = smoothstep(lineY-.6, lineY+.8, s.y)*(1.-smoothstep(bottom-1.2, bottom+.4, s.y))*(1.-smoothstep(.82,1.,ex));
    float f = clamp((s.y-lineY)/(drop+.001), 0., 1.);
    vec3 inner = mix(vec3(.33,.08,.10), vec3(.10,.02,.03), f);
    float teeth = (1.-smoothstep(.18,.42,f))*smoothstep(.2,.45,open)*(1.-smoothstep(.45,.75,ex));
    inner = mix(inner, vec3(.93,.90,.86), teeth*.9);
    col.rgb = mix(col.rgb, inner, inside);
  }
  if(blink > .02){
    for(int k=0;k<2;k++){ vec2 E = k==0 ? eL : eR; vec2 e = (s-E)/eS; float r = length(e*vec2(1., .85));
      float lid = -1.25 + 2.4*blink; float mask = 1. - smoothstep(.9, 1.25, r);
      float cover = (1. - smoothstep(lid-.08, lid+.1, e.y))*mask;
      vec4 skin = samp(E + vec2(e.x*eS.x*.95, -eS.y*2. + e.y*eS.y*.25));
      col.rgb = mix(col.rgb, skin.rgb, cover);
      float lash = (1.-smoothstep(0., .16, abs(e.y-lid)))*(1.-smoothstep(.75,1.05,r))*smoothstep(.1,.35,blink);
      col.rgb = mix(col.rgb, vec3(.09,.05,.05), lash*.85); }
  }
  gl_FragColor = vec4(col.rgb, alpha);
}`;
  function sh(type, src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s); if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
  async function init(container){
    el=container; cv=document.createElement("canvas"); cv.className="retratoCv"; el.appendChild(cv);
    gl = cv.getContext("webgl", {premultipliedAlpha:false, antialias:false, alpha:true});
    if(!gl) throw new Error("Sin WebGL");
    prog=gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER,VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER,FS)); gl.linkProgram(prog);
    if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
    const loc=gl.getAttribLocation(prog,"a"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    for(const n of ["tex","img","view","eL","eR","eS","mo","mw","lipT","lipB","chin","neck","open","smile","blink","brow","tilt","head","breath"]) U[n]=gl.getUniformLocation(prog,n);
    tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
    for(const [k,v] of [[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE],[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR]]) gl.texParameteri(gl.TEXTURE_2D,k,v);
    await load(S.retrato);
    new ResizeObserver(resize).observe(el);
    el.addEventListener("pointermove", e=>{ const r=el.getBoundingClientRect(); look.tx=((e.clientX-r.left)/r.width-.5); look.ty=((e.clientY-r.top)/r.height-.5); });
    el.addEventListener("pointerleave", ()=>{ look.tx=0; look.ty=0; });
    ready=true; resize(); show();
  }
  async function load(r){
    if(!r?.img) return;
    const im = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("No pude abrir la foto")); i.src=r.img; });
    W=im.naturalWidth; H=im.naturalHeight; LM=lmFrom(r, W, H);
    gl.bindTexture(gl.TEXTURE_2D, tex); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, im);
    resize();
  }
  function resize(){
    if(!gl || !LM) return;
    const cw=el.clientWidth, ch=el.clientHeight; if(!cw||!ch) return;
    const dpr=Math.min(window.devicePixelRatio||1, 1.5); cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr); gl.viewport(0,0,cv.width,cv.height);
    const asp=cw/ch, d=LM.d, fcx=(LM.eL[0]+LM.eR[0])/2, compact=ch<170;
    let vh = compact ? d*3.0 : d*5.4, vw=vh*asp;
    let x0 = compact ? fcx - vw*(cw>500?.2:.24) : fcx - vw/2;
    let y0 = compact ? LM.eL[1] - d*1.1 : LM.eL[1] - d*1.75;
    y0 = Math.max(0, Math.min(H-vh, y0));
    view=[x0,y0,vw,vh];
  }
  function say(text, rate){ seq=[...String(text)].map(shapeOf); seqStart=performance.now(); seqRate=rate||1; }
  function boundary(ci){ if(seq.length) seqStart = performance.now() - ci/(13.5*seqRate)*1000; }
  function setState(s){ state=s; }
  function setEmotion(e){ emo=["alegre","animada","pensativa","preocupada","neutral"].includes(e)?e:"neutral"; }
  function apply(){}
  function hide(){ running=false; if(cv) cv.hidden=true; }
  function show(){ if(!cv) return; cv.hidden=false; if(!running){ running=true; requestAnimationFrame(frame); } }
  const lerp=(a,b,k)=>a+(b-a)*k;
  function frame(){
    if(!running) return; requestAnimationFrame(frame);
    if(document.hidden || !ready || !LM) return;
    const now=performance.now(), t=(now-t0)/1000, k=LM.d/222;
    if(now-extT<200){ mouth.to=Math.min(1, ext); } else if(seq.length){ const idx=Math.floor((now-seqStart)/1000*13.5*seqRate); mouth.to = idx>=seq.length ? 0 : OPEN[seq[idx]]*(.78+.22*Math.sin(t*21)); } else mouth.to=0;
    mouth.ts = {alegre:.55, animada:.85, pensativa:.05, preocupada:-.35, neutral:.12}[emo] ?? .12;
    if(state==="escuchando") mouth.ts=Math.max(mouth.ts,.35);
    mouth.open=lerp(mouth.open,mouth.to,.38); mouth.smile=lerp(mouth.smile,mouth.ts,.06);
    if(now>blinkAt){ blinkT=now; blinkAt=now+2400+Math.random()*3400; }
    const bl = now-blinkT<140 ? 1-Math.abs((now-blinkT)/70-1) : 0;
    brow = lerp(brow, state==="escuchando" ? .45 : state==="pensando" ? .6 : emo==="animada" ? .35 : emo==="preocupada" ? .25 : 0, .08);
    tilt = lerp(tilt, (state==="escuchando" ? .035 : state==="pensando" ? -.025 : 0) + Math.sin(t*.4)*.008, .05);
    look.x=lerp(look.x,look.tx,.05); look.y=lerp(look.y,look.ty,.05);
    const hx=(Math.sin(t*.5)*2.5 + look.x*8)*k, hy=(Math.sin(t*.7)*1.6 + look.y*5 + (state==="hablando"?Math.sin(t*3.1)*1.6:0))*k;
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1i(U.tex,0); gl.uniform2f(U.img,W,H); gl.uniform4f(U.view,...view);
    gl.uniform2f(U.eL,...LM.eL); gl.uniform2f(U.eR,...LM.eR); gl.uniform2f(U.eS,...LM.eS); gl.uniform2f(U.mo,...LM.mo);
    gl.uniform1f(U.mw,LM.mw); gl.uniform1f(U.lipT,LM.lipT); gl.uniform1f(U.lipB,LM.lipB); gl.uniform2f(U.chin,...LM.chin); gl.uniform2f(U.neck,...LM.neck);
    gl.uniform1f(U.open,mouth.open); gl.uniform1f(U.smile,mouth.smile); gl.uniform1f(U.blink,bl); gl.uniform1f(U.brow,brow);
    gl.uniform1f(U.tilt,tilt); gl.uniform2f(U.head,hx,hy); gl.uniform1f(U.breath,Math.sin(t*1.7)*.003);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }
  return { init, load, apply, setState, setEmotion, say, boundary, wave(){}, hide, show, level(v){ ext=v; extT=performance.now(); }, resize:()=>resize() };
})();

/* Selector de avatar: retrato con tu foto (por defecto si existe) o Mini Luzmila 3D */
const Avatar = {
  mode:null, impl:null, el:null, state:"idle", started:new Set(),
  wanted(){ return (S.profile.avatar?.modo==="mini" || !S.retrato?.img) ? "mini" : "retrato"; },
  async init(el){ this.el=el; await this.use(this.wanted()); },
  async use(mode){
    if(!this.el || this.mode===mode) return;
    this.mode=mode; Retrato.hide(); Mini.hide();
    const impl = mode==="retrato" ? Retrato : Mini; this.impl=impl;
    if(!this.started.has(mode)){ this.started.add(mode);
      try{ await impl.init(this.el); }catch(e){ console.error(e); if(mode==="retrato"){ this.started.delete(mode); this.mode=null; return this.use("mini"); } } }
    else impl.show();
    impl.apply(S.profile.avatar); impl.setState(this.state);
  },
  refresh(){ this.use(this.wanted()); },
  apply(av){ this.impl?.apply(av); this.refresh(); },
  setState(s){ this.state=s; const L={idle:"Lista",escuchando:"Escuchando",pensando:"Pensando",hablando:"Hablando"}; $("#stateTxt").textContent=L[s]||"Lista"; $("#stage").dataset.state=s; this.impl?.setState(s); },
  level(v){ this.impl?.level?.(v); }, setEmotion(e){ this.impl?.setEmotion(e); }, say(t,r){ this.impl?.say(t,r); }, boundary(i){ this.impl?.boundary(i); }, wave(){ this.impl?.wave(); }
};

/* =========================================================
   Radar proactivo (local, sin costo de IA)
   ========================================================= */
function radar(){
  const out=[], now=new Date(), hoy=todayStr(), man=ymd(addDays(now,1)), p=S.profile;
  const pend = S.tareas.filter(t=>t.estado!=="hecha");
  const venc = pend.filter(t=>t.vence && t.vence<hoy);
  if(venc.length) out.push({n:"alta", ic:"!", t:`${venc.length} ${venc.length===1?"tarea vencida":"tareas vencidas"}: ${venc.slice(0,3).map(t=>t.titulo).join(", ")}.`, a:[{l:"Reorganizar con Mila", act:"say", arg:"Reorganiza mis tareas vencidas con fechas realistas para esta semana"},{l:"Ver tareas", act:"tab", v:"tareas"}]});
  const hoyT = pend.filter(t=>t.vence===hoy), manT = pend.filter(t=>t.vence===man);
  if(hoyT.length) out.push({n:"media", ic:"H", t:`Para hoy: ${hoyT.map(t=>t.titulo).slice(0,4).join(", ")}.`, a:[{l:"Ver", act:"tab", v:"tareas"}]});
  if(manT.length) out.push({n:"info", ic:"M", t:`Mañana vence: ${manT.map(t=>t.titulo).slice(0,3).join(", ")}.`, a:[]});
  if(S.cal.status==="ok"){
    const wk = eventsBetween(hoy, ymd(addDays(now,7)));
    const conf = conflictsIn(wk);
    if(conf.size){ const ev=wk.filter(e=>conf.has(e.id)); out.push({n:"alta", ic:"×", t:`Cruce de horario: ${ev.slice(0,2).map(e=>`${e.titulo} (${fmtDia(e.ini)} ${hhmm(e.ini)})`).join(" y ")}.`, a:[{l:"Resolver con Mila", act:"say", arg:"Tengo un cruce de horario esta semana, ayúdame a resolverlo"}]}); }
    const next = wk.find(e=>!e.allDay && e.ini>now && (e.ini-now)<2*3600000);
    if(next) out.push({n:"media", ic:"⏱", t:`En ${Math.max(1,Math.round((next.ini-now)/60000))} min: ${next.titulo}${next.meet?" (Meet)":""}.`, a: next.meet?[{l:"Abrir Meet", href:next.meet}]:[]});
    // sobrecarga: días con más de 6 h ocupadas o más de 5 cosas
    for(let i=0;i<7;i++){ const d=ymd(addDays(now,i)); const ev=eventsBetween(d,d).filter(e=>!e.allDay); const hrs=ev.reduce((s,e)=>s+(e.fin-e.ini)/3600000,0); const n=ev.length+pend.filter(t=>t.vence===d).length;
      if(hrs>=6 || n>=6){ out.push({n:"media", ic:"≈", t:`El ${fmtDiaLargo(addDays(now,i))} está cargado (${n} cosas, ${hrs.toFixed(1)} h en reuniones/clases).`, a:[{l:"Aliviar ese día", act:"say", arg:`El ${fmtDiaLargo(addDays(now,i))} está muy cargado, propón qué mover`}]}); break; } }
  }
  const pendMov = S.movimientos.filter(m=>m.estado==="pendiente");
  if(pendMov.length) out.push({n:"media", ic:"S/", t:`${pendMov.length} ${pendMov.length===1?"movimiento espera":"movimientos esperan"} tu confirmación.`, a:[{l:"Revisar", act:"tab", v:"dinero"}]});
  const recientes = S.movimientos.filter(m=>m.origen!=="importado").map(m=>m.fecha).sort();
  const ultimo = recientes[recientes.length-1];
  const dias = ultimo ? diffDays(pymd(ultimo), now) : null;
  if(S.loaded.movimientos && (dias===null || dias>=2)) out.push({n:"info", ic:"S/", t: dias===null ? "Aún no registras gastos aquí. Dime «Gasté 5 soles en pasajes» y lo anoto." : `Llevas ${dias} días sin anotar gastos. ¿Me cuentas los de estos días? Puedes decirlos todos juntos.`, a:[{l:"Dictar gastos", act:"mic"}]});
  const activas = S.metas.filter(g=>g.estado==="activa");
  for(const g of activas){ const d = g.ultima_vez ? diffDays(pymd(g.ultima_vez), now) : 99; if(d>=7){ out.push({n:"media", ic:"◎", t:`Tu meta «${g.titulo}» lleva ${d} días sin avance.${g.proxima_accion?` Próxima acción: ${g.proxima_accion}.`:""}`, a:[{l:"Planear 20 minutos", act:"say", arg:`Ayúdame a avanzar 20 minutos en mi meta: ${g.titulo}`},{l:"Ya avancé", act:"metaAvance", id:g.id}]}); } }
  if(activas.length>3) out.push({n:"info", ic:"◎", t:`Tienes ${activas.length} metas activas; tu regla es 2–3 a la vez.`, a:[{l:"Ver metas", act:"yo", v:"metas"}]});
  const h = now.getHours();
  if(h>=19){ const falt = S.habitos.filter(x=>!x.registros?.[hoy]); if(falt.length && S.habitos.length) out.push({n:"info", ic:"✓", t:`Hábitos de hoy sin marcar: ${falt.map(x=>x.nombre).join(", ")}.`, a:[{l:"Marcar", act:"yo", v:"habitos"}]}); }
  if(h>=23 || h<4){ const chip = S.memorias.find(m=>/zombie/i.test(m.texto)); out.push({n:"info", ic:"☾", t: chip ? "Es tarde. «Zombie no decide. Decide Luzmila.» ¿Cerramos el día?" : "Es tarde. ¿Cerramos el día y dejamos el celular?", a:[]}); }
  const md = hoy.slice(5);
  S.recuerdos.filter(r=>r.fecha && r.fecha.slice(5)===md && r.fecha.slice(0,4)<hoy.slice(0,4)).slice(0,2).forEach(r=>{ const n=Number(hoy.slice(0,4))-Number(r.fecha.slice(0,4));
    out.push({n:"info", ic:"♡", t:`Hace ${n} ${n===1?"año":"años"}, un día como hoy: «${r.titulo}».`, a:[{l:"Escuchar", act:"recHear", id:r.id}]}); });
  const al = S.alertas.filter(a=>Math.abs(new Date(a.cuando)-now)<36*3600000).sort((a,b)=>a.cuando<b.cuando?-1:1);
  al.forEach(a=>out.unshift({n:"alta", ic:"🔔", alerta:a.id, t:`${a.titulo} — ${fmtDia(new Date(a.cuando))} ${hhmm(new Date(a.cuando))}`, a:[{l:"Escuchar", act:"hear", id:a.id}]}));
  if(p.ajustes.proactividad==="suave") return out.filter(x=>x.n==="alta" || x.alerta).slice(0,3);
  return out.slice(0, p.ajustes.proactividad==="intensa" ? 10 : 6);
}
function briefing(){
  const now=new Date(), h=now.getHours(), p=S.profile, hoy=todayStr();
  const sal = h<12 ? "Buenos días" : h<19 ? "Buenas tardes" : "Buenas noches";
  const {ev, ts} = itemsFor(hoy, hoy);
  const rest = ev.filter(e=>e.allDay || e.fin>now);
  let s = `${sal}, ${p.nombre}. `;
  if(S.cal.status==="ok") s += rest.length ? `Hoy te queda${rest.length>1?"n":""} ${rest.length} ${rest.length===1?"evento":"eventos"}: ${rest.slice(0,4).map(e=>(e.allDay?"":"a las "+hhmm(e.ini)+", ")+e.titulo).join("; ")}. ` : "No te quedan eventos hoy. ";
  s += ts.length ? `Tareas para hoy: ${ts.map(t=>t.titulo).join(", ")}. ` : "";
  const r = radar().filter(x=>!x.alerta && x.n!=="info").slice(0,2);
  if(r.length) s += "Además: " + r.map(x=>x.t).join(" ");
  return s.trim();
}

function renderStatus(){
  const pills=[];
  if(S.caps.preview) pills.push(`<span class="pill warn"><span class="dot"></span>Vista previa</span>`);
  else pills.push(`<span class="pill ${Store.mode==="db"?"ok":"warn"}" title="Memoria privada"><span class="dot"></span>${Store.mode==="db"?"Memoria":"Sin memoria"}</span>`);
  const cs = S.cal.status;
  pills.push(`<span class="pill ${cs==="ok"?"ok":cs==="error"||cs==="denied"?"crit":"warn"}" title="Google Calendar"><span class="dot"></span>${cs==="ok"?"Calendar":cs==="loading"?"Calendar…":"Calendar"}</span>`);

  $("#status").innerHTML = pills.join("");
