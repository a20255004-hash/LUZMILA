  if(!q) return [];
  const f = parseFecha(t);
  return lista.map(e=>[e, puntuar(e.titulo,q) + (f && ymd(e.ini)>=f.desde && ymd(e.ini)<=f.hasta ? .4 : 0)]).filter(x=>x[1]>=0.55).sort((a,b)=>b[1]-a[1] || a[0].ini-b[0].ini).map(x=>x[0]);
}
function buscarMem(q){ return S.memorias.map(m=>[m, puntuar(m.texto,q)]).filter(x=>x[1]>=0.5).sort((a,b)=>b[1]-a[1]).map(x=>x[0]); }
function buscarRec(q){ return S.recuerdos.map(r=>[r, Math.max(puntuar(r.titulo||"",q), puntuar(r.texto||"",q)*.9)]).filter(x=>x[1]>=0.5).sort((a,b)=>b[1]-a[1]).map(x=>x[0]); }

/* ---------- etiquetas para mostrar opciones ---------- */
const etqMov = m => `${m.tipo==="gasto"?"Gasto":"Ingreso"} ${money(m.monto)} · ${m.concepto} · ${relDia(m.fecha)}`;
const etqTarea = x => `${x.titulo}${x.vence?" · "+relDia(x.vence):""}`;
const etqEv = e => `${e.titulo} · ${relDia(e.ini)}${e.allDay?"":" "+hhmm(e.ini)}`;

/* ---------- respuestas variadas ---------- */
const R = (t, extra={}) => ({t, emo:"neutral", cards:[], chips:[], ...extra});
const OK = ["Listo","Hecho","Ya está","Perfecto","Anotado","Ya quedó"];
const ok = () => pick(OK);
function chipsDe(items, fn){ return items.slice(0,5).map((x,i)=>({l:fn(x), say:`#elegir ${i+1}`})); }
function preguntarEleccion(accion, tipo, items, texto, extra={}){
  S.ctx.pending = {kind:"elegir", accion, tipo, ids:items.map(x=>x.id), extra};
  const fn = tipo==="mov"?etqMov : tipo==="tarea"?etqTarea : tipo==="evento"?etqEv : (x=>x.titulo||x.texto||x.nombre);
  return R(texto, {emo:"pensativa", chips:[...chipsDe(items, fn), {l:"Ninguno", say:"#cancelar"}]});
}

/* =========================================================
   Clasificador de intenciones
   ========================================================= */
function entender(raw){
  const t = limpia(raw); const q = esPregunta(raw, t);
  const I = (intent, extra={}) => ({intent, t, raw, q, ...extra});
  if(!t) return I("vacio");
  if(/^#elegir \d+$/.test(t.replace(/^.*?#/,"#"))) return I("elegir", {n:+t.match(/\d+/)[0]});
  if(/^#cancelar/.test(t)) return I("cancelar");
  if(/^#coach /.test(t)){ const [,acc,id]=raw.trim().split(/\s+/); return I("coach",{acc,id}); }
  // seguimiento: respuestas cortas a un aviso de Mila
  const pendCoach = (window.Coach?.pendientes?.()||[]);
  if(pendCoach.length && /^(ya lo hice|ya la hice|ya esta|ya esta hecho|ya esta hecha|lo hice|la hice|hecho|listo|lista|ya)\s*[!.👍✅]*$/.test(t)) return I("coach",{acc:"hecho", id:pendCoach[0].id});
  if(pendCoach.length && /^(posponlo|posponla|pospon\w*|mas tarde|luego|luego lo hago|despues|despues lo hago|en un rato|ahorita no|dame (una|1) hora)\b/.test(t)) return I("coach",{acc:"posponer60", id:pendCoach[0].id});
  // mi ciclo (privado)
  if(/\b(me (vino|llego|bajo|empezo|comenzo|lleg[oó]) (la |mi |el )?(regla|menstruacion|periodo)|(empezo|comenzo|llego|inicio) (mi |la |el )?(regla|menstruacion|periodo)|estoy (en mis dias|con (la )?regla|menstruando)|ando con (la )?regla)\b/.test(t)) return I("cicloInicio");
  if(/\b((ya )?(se me fue|termino|acabo|se acabo|se termino|se fue) (la |mi |el )?(regla|menstruacion|periodo)|ya no tengo (la )?regla)\b/.test(t)) return I("cicloFin");
  if(/\b(colicos?|dolor menstrual|me duele (el vientre|la barriga|el utero|la pancita|el bajo vientre))\b/.test(t) && !q) return I("cicloSintoma",{sintoma:"Cólicos"});
  if(/\b(cuando (me (toca|viene|llega|bajara)|llega|viene|toca) (la |mi |el )?(regla|periodo|menstruacion)|proxima regla|proximo periodo)\b/.test(t)) return I("cicloConsulta");
  // descanso
  if(/\b(termina|quita|desactiva|ya no quiero|apaga)\w* (el )?(modo )?descanso\b|\bya descanse\b/.test(t)) return I("finDescanso");
  if(/\b(necesito|quiero|voy a|me tomo|me tomare|dame) (un |una )?(descans\w*|pausa|dia libre|break|tregua)\b|\bhoy (no puedo mas|descanso|me tomo el dia)\b|\bmodo descanso\b|\bestoy agotada\b/.test(t)) return I("descanso");
  // modo entrenadora estricta
  if(/\b(desactiva|quita|apaga)\w* (el )?modo (entrenadora|estricto|estricta|sargento|exigente)\b|\bse (mas )?(suave|amable) conmigo\b|\bno seas (tan )?(estricta|dura)\b/.test(t)) return I("estricto",{on:false});
  if(/\b(activa|pon|enciende|quiero)\w* (el )?modo (entrenadora|estricto|estricta|sargento|exigente)\b|\bse (mas )?(estricta|exigente|dura) conmigo\b|\bexigeme\b|\breganame\b/.test(t)) return I("estricto",{on:true});
  // frases
  let mf = t.match(/^(?:guarda|anota|agrega|anade|salva|apunta)\w*\s+(?:esta |la |una |mi )?frase\b/);
  if(mf) return I("fraseGuardar",{texto: raw.replace(/^[\s\S]*?\bfrase\b\s*(que dice|:)?\s*/i,"")});
  if(/\b(dame|dime|regalame|necesito|quiero|mandame) (una )?(frase|motivacion|frase motivadora|frase bonita|frase del dia)\b|^motivame\b|^animame\b|\bdame animos?\b/.test(t)) return I("frase");

  // 1) deshacer
  if(/^(deshaz\w*|deshacer|revierte\w*|revertir|anula lo ultimo|vuelve atras|regresa como estaba|ctrl z)\b/.test(t) || /^(no,? )?(deshaz|deshazlo|deshacelo)/.test(t)) return I("deshacer");

  // 2) navegación
  let m = t.match(/^(abre|abrir|muestrame|ensename|ve a|vamos a|llevame a|ir a|quiero ver|mostrar|abreme)\s+(mi |la |el |las |los |mis )?(agenda|calendario|tareas|pendientes|habitos|metas|crecer|dinero|finanzas|gastos|movimientos|recuerdos|diario|progreso|graficos|estadisticas|ajustes|configuracion|inicio|hoy|memoria|frases|ciclo|periodo|regla|hojas|excel)\b/);
  if(m) return I("navegar", {ruta:{agenda:"agenda",calendario:"agenda",tareas:"tareas",pendientes:"tareas",habitos:"crecer",metas:"crecer",crecer:"crecer",dinero:"dinero",finanzas:"dinero",gastos:"dinero",movimientos:"dinero",recuerdos:"recuerdos",diario:"recuerdos",memoria:"memoria",frases:"frases",ciclo:"ciclo",periodo:"ciclo",regla:"ciclo",hojas:"fuentes",excel:"fuentes",progreso:"progreso",graficos:"progreso",estadisticas:"progreso",ajustes:"ajustes",configuracion:"ajustes",inicio:"hoy",hoy:"hoy"}[m[3]]});

  // 3) recuerdos (diario): "guarda en recuerdos...", "coloca en mis recuerdos que..."
  if(/\b(en|a|al|para)\s+(la seccion de\s+|mis\s+|los\s+|el\s+|mi\s+)?(recuerdos|diario)\b|\bcomo (un )?recuerdo\b|\bguarda(lo|r)? (este|ese|un|el) recuerdo\b|^querido diario\b|^(quiero|me gustaria) (guardar|recordar) (este|un) (momento|recuerdo)/.test(t) && !/\b(muestra|abre|ve a|que hay|cuantos|busca)\b/.test(t)){
    let contenido = raw.replace(/^[\s\S]*?\b(?:en|a|al|para)\s+(?:la secci[oó]n de\s+|mis\s+|los\s+|el\s+|mi\s+)?(?:recuerdos|diario)\b[\s,.:;-]*(?:que\s+)?/i, "").replace(/^[\s\S]*?\bcomo (?:un )?recuerdo\b[\s,.:;-]*(?:que\s+)?/i,"").replace(/^(querido diario)[\s,.:;-]*/i,"").trim().replace(/^(qye|que|q|k|ke)\s+/i,"");
    if(norm(contenido)===t || norm(contenido).length<4) contenido = "";
    // si el comando venía al final: "hoy me quedé... guárdalo en recuerdos"
    if(!contenido){ const pre = raw.split(/\b(gu[aá]rd\w*|coloc\w*|pon\w*|anot\w*|agreg\w*|registr\w*|a[nñ]ad\w*)\b/i)[0].trim(); if(norm(pre).split(" ").length>=4) contenido = pre.replace(/[\s,.;:-]+$/,""); }
    return I("recuerdo", {contenido});
  }

  // 4) pregunta sobre dinero
  if(/\b(cuanto|cuanta|cuantos)\b.*\b(gaste|gastado|gasto|gastos|llevo|ingrese|ingresos|gane|ganado|me queda|tengo|ahorre|ahorrado|recibi|entro)\b|\b(mi|el) (balance|saldo|resumen de (gastos|finanzas|dinero))\b|\ben que (gasto|gaste|se me va)\b|\bresumen de (mis )?(gastos|finanzas|dinero|ingresos)\b|\bcomo (van|estan|voy con) (mis )?(finanzas|gastos|cuentas|ahorros?)\b/.test(t))
    return I("dineroConsulta");

  // 5) borrar
  if(V_BORRAR.test(t) && !/\b(no borres|no elimines|nunca)\b/.test(t)){
    const tipo = tipoMencionado(t);
    if(/\b(todos|todas|todo)\b/.test(t) && tipo) return I("borrarMasivo", {tipo});
    return I("borrar", {tipo, pron: PRONOMBRE.test(t) || /\b\w+(lo|la)\b/.test(t.split(" ")[0]||"")});
  }

  if(/\b(pasa|mueve|reprograma|lleva)\w*\s+(todas\s+)?(mis\s+|las\s+)?(tareas|pendientes)\s+(vencidas|atrasadas|de hoy|pendientes|de ayer)?\s*(para|a|al)\s+/.test(t)) return I("reprogramarTareas");

  // 6) marcar como hecho / hábitos cumplidos
  m = t.match(/^(?:ya\s+)?(?:hice|termine|acabe|complete|cumpli|entregue|realice|tome|lei|medite|corri|estudie|fui al?|fui a la|sali a|tome mi|hice mi|hice el|hice la)\b\s*(?:de\s+)?(.*)$/) || t.match(/^(?:marca(?:r|la|lo)?|tacha(?:r|la|lo)?|check)\s+(?:como hecha\s+|como hecho\s+)?(.+?)(?:\s+como\s+(?:hecha|hecho|lista|listo|completada|terminada))?$/) || t.match(/^(?:listo|lista|ya esta|termine)\s+(?:con\s+)?(?:lo de\s+|la tarea de\s+|la tarea\s+)?(.+)$/);
  if(m && !q){ const vb = (t.match(/\b(lei|medite|corri|estudie|tome|camine|ore|escribi|dormi)\b/)||[])[1]; const INF={lei:"leer",medite:"meditar",corri:"correr",estudie:"estudiar",tome:"tomar",camine:"caminar",ore:"orar",escribi:"escribir",dormi:"dormir"};
    return I("hecho", {objeto: (m[1]||"").trim() || (vb?INF[vb]:""), verbo: vb?INF[vb]:""}); }

  // 7) corregir / editar (incluye "no era 60 era 50")
  if(V_EDITAR.test(t) && !V_MOVER.test(t.replace(/\bcambia\w*\s+(el monto|la categoria|el metodo|el concepto|el nombre|la fecha del gasto)/,""))){
    return I("editar", {tipo: tipoMencionado(t)});
  }
  if(V_MOVER.test(t) && (parseFecha(t) || parseHora(t))) return I("mover", {tipo: tipoMencionado(t)});
  if(V_EDITAR.test(t)) return I("editar", {tipo: tipoMencionado(t)});

  // 8) registrar gasto o ingreso
  const verboGasto = /\b(gaste|me gaste|gasto de|gasto en|pague|compre|me costo|me cobraron|me salio|invert[ií]|yapee|plinee|transferi|di|deposite)\b/.test(t);
  const verboIngreso = /\b(recibi|me pagaron|cobre|me depositaron|me yapearon|me plinearon|me transfirieron|me dieron|gane|me entro|me cayo|me llego|ingreso de|ingresos de|me prestaron|me devolvieron)\b/.test(t);
  const mandoMov = t.match(/^(?:agrega|anade|añade|registra|anota|apunta|pon|suma|mete|ingresa|crea)\w*\s+(?:un\s+|una\s+|el\s+|mi\s+)?(gasto|ingreso|egreso|pago|compra)\b/);
  if((verboGasto || verboIngreso || mandoMov) && !q && !/\b(cuanto|resumen|total|balance)\b/.test(t)){
    const tipo = mandoMov ? (/ingreso/.test(mandoMov[1])?"ingreso":"gasto") : (verboIngreso && !verboGasto ? "ingreso" : "gasto");
    return I("movimiento", {tipo});
  }

  // 9) agenda: consultas
  if(/\b(que|q)\s+(tengo|tenemos|hay|me toca|nos toca|hago)\b.*\b(hoy|manana|pasado|lunes|martes|miercoles|jueves|viernes|sabado|domingo|semana|finde|fin de semana|mes|dia|tarde|noche|para|el \d+|de \w+)\b|\b(que|q) (tengo|tenemos|hay) (hoy|manana|para hoy|para manana)\b|\bmi (agenda|dia|semana|horario)\b|\bcomo (esta|se ve|viene) (mi|el) (dia|semana|agenda)\b|\b(que|cual) (es mi |)(proximo|siguiente) (evento|compromiso|reunion|clase|cita)\b|\bque sigue\b|\bestoy (libre|ocupada)\b|\btengo algo\b|\bque eventos\b/.test(t) && !/\b(organiza|planifica|prioriza|ayudame)\b/.test(t))
    return I("agendaConsulta");

  // 10) tareas: consultas
  if(/\b(que|cuales|cuantas)\b.*\b(tareas|pendientes|me falta|tengo que hacer|debo hacer|por hacer)\b|\bmis (tareas|pendientes)\b|\bque me falta\b|\bque tengo pendiente\b/.test(t)) return I("tareasConsulta");

  // 11) planificar
  if(/\b(organiza\w*|planifica\w*|ordena\w*|prioriza\w*)\s+(mi|el|la|mis)?\s*(dia|tarde|manana|noche|semana|tareas|pendientes|tiempo|agenda)\b|\b(que hago|en que me enfoco|por donde empiezo|que deberia hacer|que me recomiendas hacer|ayudame a organizar\w*|no se por donde empezar|estoy perdida|me siento desorganizada)\b/.test(t))
    return I("planificar");
  if(/\b(pasa|mueve|reprograma|lleva)\w*\s+(todas\s+)?(mis\s+|las\s+)?(tareas|pendientes)\s+(vencidas|atrasadas|de hoy|pendientes|de ayer)?\s*(para|a|al)\s+/.test(t)) return I("reprogramarTareas");

  // 12) recordatorios y tareas
  m = t.match(/^(?:recuerdame|recordame|avisame|no me dejes olvidar|hazme acordar|me recuerdas)\s+(?:que\s+|de\s+|a\s+)?(.+)$/);
  if(m && !q) return I("recordatorio", {texto: raw.replace(/^[\s\S]*?\b(recu[eé]rdame|record[aá]me|av[ií]same|no me dejes olvidar|hazme acordar|me recuerdas)\b\s*(que\s+|de\s+|a\s+)?/i, "")});
  m = t.match(/^(?:agrega|anade|añade|anota|apunta|crea|pon|registra|nueva|nuevo)\w*\s+(?:una\s+|la\s+|a mis\s+|en mis\s+|un\s+)?(?:tarea|pendiente|pendientes|to do)\s*(?:de|que|para|:)?\s*(.+)$/);
  if(m) return I("tarea", {texto: raw.replace(/^[\s\S]*?\b(tarea|pendientes?|to do)\b\s*(de|que|para|:)?\s*/i, "")});
  m = t.match(/^(?:tengo que|debo|necesito|me toca|hay que|tendria que|deberia)\s+(.+)$/);
  if(m && !q && !/\b(ayuda|organizar|saber)\b/.test(t)) return I("tarea", {texto: raw.replace(/^[\s\S]*?\b(tengo que|debo|necesito|me toca|hay que|tendr[ií]a que|deber[ií]a)\b\s*/i, ""), implicita:true});

  // 13) eventos
  const sustEv = /\b(reunion|cita|clase|examen|entrevista|exposicion|junta|consulta|sustentacion|evento|cumpleanos|fiesta|almuerzo con|cena con|viaje|vuelo|turno|charla|webinar|taller|presentacion|parcial|practica calificada)\b/;
  m = t.match(/^(?:agenda\w*|programa\w*|pon\w*|crea\w*|anota\w*|apunta\w*|registra\w*|bloquea\w*|reserva\w*)\s+(?:en (?:mi )?(?:agenda|calendario)\s+)?(.+)$/);
  if(m && (parseFecha(t) || parseHora(t) || /\b(agenda|calendario|evento)\b/.test(t))) return I("evento", {texto: raw.replace(/^\s*\S+\s+(en (mi )?(agenda|calendario)\s*)?(un |una |el |la )?(evento\s*)?(de |que |:)?/i,"")});
  if(/^(tengo|tenemos|hay)\s+(una?\s+)?/.test(t) && sustEv.test(t) && (parseFecha(t)||parseHora(t)) && !q) return I("evento", {texto: raw.replace(/^\s*(tengo|tenemos|hay)\s+/i,"")});

  // 14) hábitos y metas
  if(/\b(nuevo habito|crea\w* (un )?habito|quiero (empezar|comenzar) (a|el habito de)|agrega\w* (un )?habito|quiero el habito de)\b/.test(t)) return I("habitoNuevo");
  if(/\b(como (van|voy con) mis habitos|mis habitos|mi racha|cuantos dias llevo)\b/.test(t)) return I("habitosConsulta");
  if(/\b(nueva meta|mi meta es|quiero lograr|crea\w* (una )?meta|agrega\w* (una )?meta|mi objetivo es)\b/.test(t)) return I("metaNueva");
  if(/\b(como (van|voy con) mis metas|mis metas|mis objetivos)\b/.test(t)) return I("metasConsulta");
  if(/\b(avance|avances|avance en|avanze|avance con)\b.*\b(meta|tesis|objetivo)\b|^avance\b/.test(t)) return I("metaAvance");

  // 15) notas e ideas
  m = t.match(/^(?:anota|apunta|guarda|escribe)\w*\s+(?:esta |una |la )?(idea|nota)\s*(?:de |para |que |:)?\s*(.+)$/) || t.match(/^(idea|nota)\s*:?\s+(.+)$/) || t.match(/^se me (ocurrio|ocurre)\s+(?:que\s+)?(.+)$/);
  if(m) return I("nota", {texto: m[2], tipo: /idea|ocurr/.test(m[1])?"idea":"nota"});

  // 16) memoria: guardar, preguntar, olvidar
  if(/^(olvida\w*|ya no recuerdes|borra de tu memoria)\b/.test(t) || /\beso (no es|ya no es) (cierto|verdad)\b/.test(t) || /^ya no me gusta\b/.test(t)) return I("olvidar");
  m = t.match(/^(?:recuerda|no olvides|ten en cuenta|ten presente|toma nota de|guarda en tu memoria|aprende)\s+(?:que\s+)?(.+)$/);
  if(m && !q) return I("memoria", {texto: raw.replace(/^[\s\S]*?\b(recuerda|no olvides|ten en cuenta|ten presente|toma nota de|guarda en tu memoria|aprende)\b\s*(que\s+)?/i,"")});
  if(q && (/\b(es cierto|es verdad|sera que|acaso)\b/.test(t) || /^(me gusta|me gustan|me encanta|odio|soy|tengo|mi|cual es mi|cuando es mi|como se llama mi|quien es mi|donde (vivo|estudio|trabajo)|que sabes de mi|que recuerdas de mi|te acuerdas|recuerdas|sabes)\b/.test(t))) return I("memoriaPregunta");
  if(!q && /^(me gusta|me gustan|me encanta|me encantan|no me gusta|no me gustan|odio|amo|prefiero|soy alergica|soy intolerante|mi (color|comida|cancion|pelicula|serie|libro|lugar|bebida|postre|fruta|flor|animal|artista|banda|cantante|deporte|materia)\s+(favorit[oa]|preferid[oa])|mi cumpleanos|mi mama|mi papa|mi hermana|mi hermano|mi novio|mi mejor amiga|mi gato|mi gata|mi perro|vivo en|trabajo en|estudio en|nunca como|siempre tomo)\b/.test(t))
    return I("memoria", {texto: raw, implicita:true});

  // 17) ánimo
  m = t.match(/\b(?:me siento|estoy|ando|me encuentro|hoy estoy|me siento muy|estoy muy|ando muy)\s+(?:un poco |algo |super |bien |muy |re )?(feliz|contenta|bien|genial|emocionada|orgullosa|tranquila|motivada|triste|mal|cansada|agotada|estresada|ansiosa|sola|desanimada|aburrida|enojada|frustrada|preocupada|nerviosa|abrumada|enferma|con sueno|con flojera|sin ganas|harta|fatal|regular|mas o menos|normal)\b/);
  if(m) return I("animo", {estado:m[1]});
  if(/\b(tuve|fue) un (dia|dia muy|dia super) (malo|horrible|pesado|dificil|terrible|bueno|genial|bonito|increible|productivo)\b/.test(t)) return I("animo", {estado: /malo|horrible|pesado|dificil|terrible/.test(t)?"mal":"genial"});

  // 18) hora/fecha
  if(/\b(que hora es|que horas son|me dices la hora)\b/.test(t)) return I("hora");
  if(/\b(que dia es hoy|que fecha es|a cuanto estamos|que dia estamos)\b/.test(t)) return I("fecha");

  // 19) ayuda
  if(/\b(que puedes hacer|que sabes hacer|como funcionas|ayuda|como te uso|que haces|para que sirves|instrucciones|comandos)\b/.test(t)) return I("ayuda");

  return I(charlaMatch(t) ? "charla" : (q ? "preguntaLibre" : "libre"));
}

/* =========================================================
   Charla: cientos de frases y respuestas predeterminadas
   ========================================================= */
const N = () => S.profile.nombre;
const CHARLA = [

function tareasDeHoy(){ const hoy=todayStr(); return S.tareas.filter(x=>x.estado!=="hecha" && x.vence && x.vence<=hoy); }
function resumenCorto(){
  const hoy=todayStr(); const ev = eventosEntre(hoy, hoy, {tareas:false}).filter(e=>e.fin>new Date() && !e.alerta); const ts = tareasDeHoy();
  const venc = ts.filter(x=>x.vence<hoy).length;

  if(ts.length) p.push(`${plural(ts.length,"tarea","tareas")} para hoy${venc?`, ${venc} atrasada${venc>1?"s":""}`:""}`);

function pendientesManana(){ const m=ymd(addDays(new Date(),1)); const ev=eventosEntre(m,m,{tareas:false}).filter(e=>!e.alerta); const ts=S.tareas.filter(x=>x.estado!=="hecha" && x.vence===m);

function priorizar(ts){ const hoy=todayStr(); const pv={alta:0, media:1, baja:2}; return ts.slice().sort((a,b)=> ((a.vence&&a.vence<=hoy)?0:1)-((b.vence&&b.vence<=hoy)?0:1) || (pv[a.prioridad]??1)-(pv[b.prioridad]??1) || ((a.vence||"9")<(b.vence||"9")?-1:(a.vence||"9")>(b.vence||"9")?1:0)); }
function describirAgenda(f){
  const {desde, hasta} = f; const ev = eventosEntre(desde, hasta, {tareas:false}).filter(e=>!e.alerta); const ts = S.tareas.filter(x=>x.estado!=="hecha" && x.vence && x.vence>=desde && x.vence<=hasta);

  if(!ev.length && !ts.length) return `${capital(lbl)} no tienes nada agendado${sinCal}. ¡Espacio libre para ti!`;
  const evt = ev.slice(0,5).map(e=>`${single?"":DIAS[e.ini.getDay()]+" "}${e.allDay?"todo el día":hhmm(e.ini)} ${e.titulo}`).join("; ");
  let s = `${capital(lbl)}: `;
  if(ev.length) s += `${plural(ev.length,"evento","eventos")} — ${evt}${ev.length>5?"; y más":""}. `;

  return s + sinCal;
}

/* ---------- extraer concepto / fuente de un gasto o ingreso ---------- */
function extraerConcepto(raw, tipo){
  let t = " "+norm(raw).replace(/[¿?¡!;:]/g," ")+" ";
  let fuente = "";
  const mf = t.match(/\b(?:de parte de|departe de|parte de|de parte del|enviado por|que me dio|que me dieron|que me mando|de mi|del)\s+([a-zñ][a-zñ ]{1,40}?)(?=\s+(?:por|en|con|para|hoy|ayer|el|la|a las?)\b|\s*$)/);
  if(mf) fuente = capital(mf[1].trim());
  t = t.replace(/\b(con|por|via|en|desde mi|de mi)\s+(yape|plin|efectivo|tarjeta( scotiabank| de credito| de debito| scotia)?|transferencia|scotia)\b/g," ")
       .replace(/\b(hoy|ayer|ahorita|recien|antes|anteayer|pasado manana|manana)\b/g," ");
  const nw = [...Object.keys(NUMW),"mil","y","medio"].join("|");
  t = t.replace(new RegExp(`\\b(?:(?:${nw})\\s+)+(?:soles?|lucas?)(?:\\s+con\\s+(?:(?:${nw})\\s*)+(?:centimos)?)?`,"g")," MONTO ")
       .replace(/(?:s\/\.?\s*)?\d+(?:[.,]\d+)?\s*(?:soles?|lucas?|mangos?)?(?:\s+con\s+\d+\s*(?:centimos)?)?/g," MONTO ");
  t = t.replace(/^\s*(agrega|anade|añade|registra|anota|apunta|pon|suma|mete|ingresa|crea)\w*\s+(un|una|el|mi)?\s*(gasto|ingreso|egreso|pago|compra)\s*(de)?\s*/," ");
  const art = "(?:(?:un|una|el|la|los|las|mi|mis|unos|unas|del|al)\\s+)?";
  let m = t.match(new RegExp(`\\b(?:en|por|para|de)\\s+${art}([a-zñ][a-zñ ]*?)\\s*(?:MONTO|$)`))
       || t.match(new RegExp(`\\b(?:gaste|pague|compre|me costo|me salio|me cobraron)\\s+${art}([a-zñ][a-zñ ]*?)\\s+(?:a|en|por|de)?\\s*MONTO`))
       || t.match(new RegExp(`MONTO\\s+(?:en|por|para|de)\\s+${art}([a-zñ][a-zñ ]*)`))
       || t.match(new RegExp(`\\b(?:compre|pague)\\s+${art}([a-zñ][a-zñ ]*)`));
  let c = m ? m[1].trim() : "";
  c = c.replace(/\b(soles?|lucas?|parte de .*|de parte de .*)\b/g,"").replace(/\b(gaste|pague|compre|me|costo|salio|que|y)\b/g," ").replace(/\s+/g," ").trim();
  if(tipo==="ingreso" && fuente && (!c || norm(fuente).includes(c) || c.includes(norm(fuente)))) c = "";
  if(!c || /^(algo|cosas?|compras?|una compra|varios|varias cosas|gasto|ingreso|pago)$/.test(c)) c = "";
  if(tipo==="ingreso" && !fuente && c){ fuente = capital(recuperar(raw, c)); c = ""; }
  return {concepto: capital(recuperar(raw, c)), fuente: fuente ? capital(recuperar(raw, norm(fuente))) : ""};
}

async function responder(raw){
  const pen = S.ctx.pending;
  if(pen){ const r = await resolverPendiente(pen, raw); if(r) { guardarCtx(); return r; } }
  const it = entender(raw);
  let r;
  try{ r = await ejecutar(it); }
  catch(e){ r = R(`No pude hacerlo: ${errMsg(e)}`, {emo:"preocupada"}); }
  if(!r || r.noEntendi){ r = await respuestaLibre(it, r); }
  if(["libre"].includes(it.intent) && !it.q) S.ctx.lastFree = raw;
  guardarCtx();
  if(r?.t) r.t = horas12(r.t);
  return r;
}

function horas12(s){ return String(s).replace(/\b(a las|las|desde las|hasta las|a la)\s+(\d{2}):(\d{2})\b/g, (m,pre,h,mi)=>{ h=+h; const suf = h<12 ? "a. m." : "p. m."; const hh = ((h+11)%12)+1; return `${hh===1&&pre==="a las"?"a la":pre==="a la"&&hh!==1?"a las":pre} ${hh}${mi!=="00"?":"+mi:""} ${suf}`; }); }
// recupera tildes y mayúsculas del texto original para una frase normalizada
function recuperar(raw, frase){
  if(!frase) return frase; const ws = String(raw).split(/\s+/); const nw = ws.map(w=>norm(w).replace(/[^a-z0-9ñ]/g,"")); const tk = norm(frase).split(/\s+/).filter(Boolean);
  for(let i=0;i+tk.length<=nw.length;i++){ if(tk.every((x,j)=>nw[i+j]===x)) return ws.slice(i,i+tk.length).join(" ").replace(/^[¿¡"«(]+|[?!.,;:»")]+$/g,""); }
  return frase;
}
const SI = /^(si|sip|si por favor|claro|dale|ok|okey|ya|confirmo|hazlo|de una|por supuesto|obvio|correcto|exacto|eso|asi es|afirmativo|bueno|listo|guardalo|guardala|agendalo|si agendalo|si, agendalo|me parece bien|perfecto|va)\b/;
const NO = /^(no|nop|cancela|mejor no|olvidalo|dejalo|ninguno|ninguna|nada|nel|no gracias)\b/;
async function resolverPendiente(p, raw){

  switch(p.kind){
    case "elegir": {
      let idx = -1; const mn = t.match(/#elegir (\d+)/); if(mn) idx=+mn[1]-1;
      else if(/^(el |la )?(primer[oa]?|1|uno)\b/.test(t)) idx=0; else if(/^(el |la )?(segund[oa]|2|dos)\b/.test(t)) idx=1; else if(/^(el |la )?(tercer[oa]?|3|tres)\b/.test(t)) idx=2; else if(/^(el |la )?(ultim[oa])\b/.test(t)) idx=p.ids.length-1;
      else { const monto=parseMonto(t,{suelto:true}); const cands = p.ids.map((id,i)=>{ const o = p.tipo==="mov"?S.movimientos.find(x=>x.id===id):p.tipo==="tarea"?S.tareas.find(x=>x.id===id):p.tipo==="evento"?buscarEvento(id):null; if(!o) return [i,0]; const lbl = p.tipo==="mov"?etqMov(o):p.tipo==="tarea"?etqTarea(o):etqEv(o); return [i, puntuar(lbl, t) + (monto && o.monto===monto ? 2 : 0)]; }).sort((a,b)=>b[1]-a[1]); if(cands[0] && cands[0][1]>=0.6) idx=cands[0][0]; }
      if(idx<0 || idx>=p.ids.length) { S.ctx.pending=null; return null; }
      S.ctx.pending=null; return ejecutarSobre(p.accion, p.tipo, p.ids[idx], p.extra||{});
    }
    case "monto": {
      const v = parseMonto(t, {suelto:true}); if(!v){ S.ctx.pending=null; return null; }
      S.ctx.pending=null; return registrarMov({...p.data, monto:v});
    }
    case "hora": {
      let hora = parseHora(t) || (/^\d{1,2}$/.test(t) ? pad((+t>=1&&+t<=6)?+t+12:+t)+":00" : null);
      if(/todo el dia|todo el día|sin hora|dia completo/.test(t)){ S.ctx.pending=null; return crearEvento({...p.data, allDay:true}); }
      if(!hora){ S.ctx.pending=null; return null; }

    case "fechaTarea": {
      const f = parseFecha(t) || (/sin fecha|ninguna|no tiene/.test(t)?{desde:""}:null); if(!f){ S.ctx.pending=null; return null; }
      S.ctx.pending=null; const hora=parseHora(t); const r = await A.editarTarea(p.id, {vence:f.desde||"", ...(hora?{hora}:{})});

      if(/^no\b/.test(t)){ S.ctx.pending=null; const neg = p.texto.startsWith("Me ") ? "No me "+p.texto.slice(3) : p.texto; const r=await A.recordar({texto:neg, tipo:"preferencia"}); return R(`Entendido, lo anoto así: ${neg.toLowerCase()}.`, {cards:[{k:"mem", id:r.id, log:r.log}]}); }

    }
    case "ofrecerRecuerdo": {

    }
    case "recuerdo": {
      S.ctx.pending=null; if(t.length<3) return R("Ok, cuando quieras me lo cuentas.");

      if(SI.test(t)){ S.ctx.pending=null; for(const b of p.bloques) await A.editarTarea(b.id, {vence:b.fecha, hora:b.hora, dur:b.dur}); Mila.celebrar();

  }
  S.ctx.pending=null; return null;
}

async function crearEvento(d){

  if(!fecha){ fecha = todayStr(); if(d.hora && new Date(`${fecha}T${d.hora}:00`) < new Date()) fecha = ymd(addDays(new Date(),1)); }
  const ini = d.allDay ? pymd(fecha) : new Date(`${fecha}T${d.hora}:00`);
  let fin = null; if(!d.allDay && d.fin){ fin = new Date(`${fecha}T${d.fin}:00`); if(fin<=ini) fin=null; }
  const r = await A.evento({titulo:d.titulo, ini, fin, dur:d.dur||60, allDay:!!d.allDay});
  const cuando = `${relDia(ini)}${d.allDay?" (todo el día)":" a las "+hhmm(ini)}`;
  const choque = r.choques?.length ? ` Ojo: se cruza con «${r.choques[0].titulo}».` : "";
  const dest = r.google ? " Ya está en tu Google Calendar." : (Cal.disponible() ? "" : "");
  return R(`${pick(["Listo","Agendado","Hecho"])}: «${capital(d.titulo)}» ${cuando}.${dest}${choque}`, {emo: choque?"preocupada":"alegre", cards:[{k:"evento", id:r.id, log:r.log}]});
}

    if(lim){ const usado = sum(S.movimientos.filter(x=>x.tipo==="gasto" && x.categoria===m.categoria && x.fecha?.startsWith(mes) && x.id!==r.id), x=>x.monto)+m.monto; const p=usado/lim;
      extra = p>=1 ? ` Ojo: ya pasaste tu presupuesto de ${m.categoria} (${money0(usado)} de ${money0(lim)}).` : p>=.8 ? ` Llevas ${Math.round(p*100)}% de tu presupuesto de ${m.categoria}.` : ""; }

  return R(txt+extra, {emo:"alegre", cards:[{k:"mov", id:r.id, log:r.log}]});

async function consultaDinero(it){
  const t = it.t; const f = parseFecha(t) || (()=>{ const d=new Date(); return {desde:ymd(new Date(d.getFullYear(),d.getMonth(),1)), hasta:ymd(new Date(d.getFullYear(),d.getMonth()+1,0)), label:"este mes"}; })();
  const cat = matchCatEnTexto(t) || (/\ben\s+(\w+)/.test(t) ? matchCat(t.match(/\ben\s+(\w+)/)[1]) : null);
  const ms = S.movimientos.filter(m=>m.estado==="registrado" && m.fecha>=f.desde && m.fecha<=f.hasta);
  const g = round2(sum(ms.filter(m=>m.tipo==="gasto"),m=>m.monto)), i = round2(sum(ms.filter(m=>m.tipo==="ingreso"),m=>m.monto));
  const lbl = f.single ? relDia(f.desde) : (f.label||"en ese periodo");
  if(cat){ const gc = round2(sum(ms.filter(m=>m.tipo==="gasto" && m.categoria===cat), m=>m.monto)); return R(`${capital(lbl)} gastaste ${money(gc)} en ${cat}${g?` (${Math.round(gc/g*100)}% de tus gastos)`:""}.`, {cards:[{k:"dinero", desde:f.desde, hasta:f.hasta}]}); }
  if(!ms.length) return R(`${capital(lbl)} no tengo movimientos registrados. Cuando gastes algo, solo dime «gasté 10 soles en…».`, {emo:"pensativa"});
  const porCat = Object.entries(groupBy(ms.filter(m=>m.tipo==="gasto"), m=>m.categoria||"Otros")).map(([c,l])=>[c, sum(l,m=>m.monto)]).sort((a,b)=>b[1]-a[1]);
  let s = `${capital(lbl)}: gastos ${money(g)}, ingresos ${money(i)}. Balance ${money(i-g)}.`;
  if(porCat[0]) s += ` Lo que más pesa: ${porCat[0][0]} (${money(porCat[0][1])}).`;
  if(i && g>i) s += " Estás gastando más de lo que entra; ¿revisamos juntas en qué recortar?";
  return R(s, {emo: g>i&&i ? "preocupada":"neutral", cards:[{k:"dinero", desde:f.desde, hasta:f.hasta}]});
}

/* ---------- borrar ---------- */
async function ejecutarSobre(accion, tipo, id, extra={}){
  if(accion==="borrar"){
    let r;
    if(tipo==="mov") r = await A.borrarMovimiento(id); else if(tipo==="tarea") r = await A.borrarTarea(id); else if(tipo==="evento") r = await A.borrarEvento(id);
    else if(tipo==="rec") r = await A.borrarRecuerdo(id); else if(tipo==="mem") r = await A.olvidar(id); else if(tipo==="nota") r = await A.borrarNota(id);
    else if(tipo==="habito") r = await A.borrarHabito(id); else if(tipo==="meta") r = await A.borrarMeta(id);
    else throw new Error("No sé borrar eso todavía.");
    return R(`${pick(["Listo","Hecho","Ya está"])}. ${r.resumen}. Si fue un error, di «deshaz».`, {emo:"alegre", cards:[{k:"undo", log:r.log}]});
  }
  if(accion==="editar") return aplicarEdicion(tipo, id, extra.texto || "");
  if(accion==="mover") return aplicarMovimiento(tipo, id, extra.texto || "");
  if(accion==="hecho"){ const r = await A.editarTarea(id, {estado:"hecha"}); Mila.celebrar(); return R(felicitar(), {emo:"animada", cards:[{k:"tarea", id, log:r.log}]}); }
  if(accion==="olvidar"){ const r = await A.olvidar(id); return R(`${r.resumen}.`, {cards:[{k:"undo", log:r.log}]}); }
  return R("Hecho.");
}
async function borrarDesdeTexto(it){
  const {t} = it; let tipo = it.tipo; const tipoMov = tipo==="gasto"||tipo==="ingreso"||tipo==="mov";
  const resto = quitarFechaHora(quitarComando(t)).replace(/\b\d+([.,]\d+)?\b|\bsoles?\b/g," ").trim();
  const conFiltros = resto.length>2 || parseMonto(t,{suelto:true}) || parseFecha(t);
  // pronombre o sin detalles → lo último
  if(!conFiltros || (it.pron && !resto)){
    const l = ultimo(tipo); if(l) return ejecutarSobre("borrar", l.type, l.id);
    if(!tipo) return R("¿Qué quieres que borre? Dime por ejemplo «borra el gasto de 20 soles de ayer».", {emo:"pensativa"});
  }
  if(tipoMov || (!tipo && parseMonto(t,{suelto:true}))){
    const c = buscarMovs(t, {tipo: tipoMov && tipo!=="mov" ? tipo : null});
    if(!c.length) return R(`No encontré ese ${tipo==="ingreso"?"ingreso":"gasto"}. ¿Me das el monto o la fecha?`, {emo:"pensativa"});
    if(c.length===1 || !conFiltros) return ejecutarSobre("borrar","mov",c[0].id);
    const top = c.slice(0,4); if(top.length>1 && !parseMonto(t,{suelto:true}) && !resto) return ejecutarSobre("borrar","mov",top[0].id);
    return preguntarEleccion("borrar","mov",top,"Encontré varios. ¿Cuál borro?");
  }
  const busc = {tarea:()=>buscarTareas(t,{pend:false}), evento:()=>buscarEventos(t), rec:()=>buscarRec(resto), mem:()=>buscarMem(resto), nota:()=>S.notas.filter(n=>puntuar(n.texto,resto)>=.5), habito:()=>{ const h=buscarHabito(resto); return h?[h]:[]; }, meta:()=>S.metas.filter(g=>puntuar(g.titulo,resto)>=.5)};
  const tipos = tipo && busc[tipo] ? [tipo] : ["evento","tarea","rec","nota","meta","habito"];
  for(const ty of tipos){ const c = busc[ty](); if(c.length===1) return ejecutarSobre("borrar", ty, c[0].id); if(c.length>1) return preguntarEleccion("borrar", ty, c.slice(0,4), "Encontré varios. ¿Cuál borro?"); }
  return R(`No encontré «${resto||t}» para borrar. ¿Me das más detalles?`, {emo:"pensativa"});
}

/* ---------- editar ---------- */
async function editarDesdeTexto(it){

  else if(tipo==="tarea"){ const c=buscarTareas(t); target = c[0] ? {type:"tarea", id:c[0].id} : ultimo("tarea"); }
  else if(tipo==="evento"){ const c=buscarEventos(t); target = c[0] ? {type:"evento", id:c[0].id} : ultimo("evento"); }

    const nt = raw.match(/\b(?:nombre|t[ií]tulo)\s+(?:a|es|por|:)?\s*["«]?([^"»]+)["»]?$/i) || raw.match(/\bcambia(?:la|r)?\s+(?:a|por)\s+["«]?([^"»]+)["»]?$/i); if(nt && !f && !h) c.titulo = nt[1].trim();
    if(!Object.keys(c).length) return R(`¿Qué le cambio a «${x.titulo}»? Fecha, hora, prioridad o nombre.`, {emo:"pensativa", cards:[{k:"tarea", id}]});

  if(tipo==="rec"){ const e = EMOS.find(([k,l])=>t.includes(norm(l))); const nt = raw.match(/\bt[ií]tulo\s+(?:a|es|por|:)?\s*(.+)$/i); const c={}; if(e) c.emocion=e[0]; if(nt) c.titulo=capital(nt[1]); const f=parseFecha(t); if(f?.single) c.fecha=f.desde;
    if(!Object.keys(c).length) return R("¿Qué cambio del recuerdo: el título, la fecha o la emoción?"); const r=await A.editarRecuerdo(id,c); return R(`${ok()}, recuerdo actualizado.`, {cards:[{k:"rec", id, log:r.log}]}); }
  return R("Eso todavía no lo puedo corregir desde la conversación; ábrelo y edítalo con el lápiz.");

async function aplicarMovimiento(tipo, id, raw){
  const t = limpia(raw); const partes = t.split(/\b(?:para el|para la|para las|para|al|a la|a las|hacia el)\b/); const cola = partes.length>1 ? partes.slice(1).join(" ") : t;
  const pref = partes.length>1 ? (/^a las?|para las?/.test(t.slice(t.indexOf(cola)-8)) ? "a las " : "") : "";
  const f = parseFecha(cola) || (partes.length>1 ? null : parseFecha(t)); const h = parseHora((pref+cola)) || parseHora(" a las "+cola) || parseHora(t.slice(t.lastIndexOf(" a las ")));
  if(tipo==="tarea"){
    const x=S.tareas.find(y=>y.id===id); if(!x) return R("No encontré esa tarea.");
    if(!f && !h) return R(`¿Para cuándo muevo «${x.titulo}»?`, {chips:[{l:"Hoy",say:"para hoy"},{l:"Mañana",say:"para mañana"}]});
    const c={}; if(f?.single) c.vence=f.desde; if(h){ c.hora=h; if(!c.vence && !x.vence) c.vence=todayStr(); }
    const r=await A.editarTarea(id,c); return R(`${ok()}: «${x.titulo}» quedó para ${relDia(c.vence||x.vence)}${c.hora?" a las "+c.hora:""}.`, {emo:"alegre", cards:[{k:"tarea", id, log:r.log}]});
  }
  const ev = buscarEvento(id); if(!ev) return R("No encontré ese evento.");
  if(!f && !h){ const nt = raw.match(/\b(?:nombre|t[ií]tulo)\s+(?:a|es|por|:)?\s*(.+)$/i); if(nt){ const r=await A.editarEvento(id,{titulo:nt[1]}); return R(`${ok()}, ahora se llama «${capital(nt[1])}».`, {cards:[{k:"evento", id, log:r.log}]}); }
    return R(`¿A qué día u hora muevo «${ev.titulo}»?`, {emo:"pensativa"}); }
  const base = f?.single ? pymd(f.desde) : startDay(ev.ini);
  const [hh,mm] = (h || hhmm(ev.ini)).split(":").map(Number); const ini = new Date(base.getFullYear(), base.getMonth(), base.getDate(), hh, mm);
  const r = await A.editarEvento(id, {ini:ini.toISOString()});
  const choques = eventosEntre(ymd(ini), ymd(ini), {tareas:false}).filter(e=>e.id!==id && !e.allDay && e.ini<addMin(ini,(ev.fin-ev.ini)/60000) && e.fin>ini);
  return R(`${ok()}: «${ev.titulo}» ahora es ${relDia(ini)}${ev.allDay?"":" a las "+hhmm(ini)}.${choques.length?` Ojo, se cruza con «${choques[0].titulo}».`:""}`, {emo: choques.length?"preocupada":"alegre", cards:[{k:"evento", id, log:r.log}]});
}

  if(mems.length){

    if(/^(me gustan?|me encantan?)/.test(t)) return R(neg ? `Según lo que me contaste, no: «${m.texto}».` : `¡Sí! Me contaste que ${m.texto.replace(/^Me /,"te ").replace(/^me /,"te ").replace(/[.]$/,"")}.`, {emo:"alegre", cards:[{k:"mem", id:m.id}]});
    return R(`Lo que tengo guardado: «${m.texto}».${mems[1]?` También: «${mems[1].texto}».`:""}`, {emo:"alegre", cards:[{k:"mem", id:m.id}]});
  }
  if(recs.length) return R(`No lo tengo como dato, pero aparece en tu diario: «${recs[0].titulo}» (${recs[0].fecha?relDia(recs[0].fecha):"sin fecha"}).`, {cards:[{k:"rec", id:recs[0].id}]});
  if(IA.lista()) return {noEntendi:true};

    const frase = capital(prop.replace(/^me encantan?/i, m=>m.toLowerCase()));

/* ---------- planificar el día ---------- */
function huecosLibres(fecha, desdeHora){
  const dia = pymd(fecha); const ahora=new Date();
  let ini = new Date(dia); ini.setHours(Math.max(S.profile.ajustes.inicioDia||7, 7),0,0,0);
  if(sameDay(dia, ahora) && ahora>ini){ ini = new Date(ahora); ini.setMinutes(Math.ceil((ini.getMinutes()+5)/15)*15, 0, 0); }
  if(desdeHora){ const [h,m]=desdeHora.split(":").map(Number); const d=new Date(dia); d.setHours(h,m,0,0); if(d>ini) ini=d; }
  const fin = new Date(dia); fin.setHours(23,0,0,0);
  const ocupados = eventosEntre(fecha, fecha).filter(e=>!e.allDay).map(e=>[e.ini, e.fin]).sort((a,b)=>a[0]-b[0]);
  const huecos = []; let cur = ini;
  for(const [a,b] of ocupados){ if(b<=cur) continue; if(a>cur && (a-cur)>=20*60000) huecos.push([cur, a]); if(b>cur) cur=b; }
  if(fin>cur && (fin-cur)>=20*60000) huecos.push([cur, fin]);
  return huecos;
}
async function planificar(it){
  const f = parseFecha(it.t); const fecha = f?.single ? f.desde : todayStr(); const hoy=todayStr();
  try{ if(Cal.ok()) await Cal.cargar(fecha, fecha); }catch{}
  const cands = priorizar(S.tareas.filter(x=>x.estado!=="hecha" && !x.hora && (!x.vence || x.vence<=ymd(addDays(pymd(fecha),3))))).slice(0,4);
  if(!cands.length) return R(`No tienes tareas sin hora para ${relDia(fecha)}. ${describirAgenda({desde:fecha, hasta:fecha})}`, {emo:"alegre", cards:[{k:"agenda", desde:fecha, hasta:fecha}]});
  const huecos = huecosLibres(fecha, /\btarde\b/.test(it.t)?"14:00":/\bnoche\b/.test(it.t)?"19:00":null);
  const bloques=[]; let hi=0, cur=huecos[0]?.[0];
  for(const x of cands){ const dur = Math.min(90, Math.max(25, Number(x.dur)||45)); while(hi<huecos.length && (huecos[hi][1]-cur) < dur*60000){ hi++; cur=huecos[hi]?.[0]; } if(hi>=huecos.length) break;
    bloques.push({id:x.id, titulo:x.titulo, fecha, hora:hhmm(cur), dur}); cur = addMin(cur, dur+10); }
  if(!bloques.length) return R(`${capital(relDia(fecha))} tu agenda está llena. Te sugiero mover «${cands[0].titulo}» a mañana.`, {emo:"preocupada", chips:[{l:"Moverla a mañana", say:`mueve la tarea ${cands[0].titulo} para mañana`}]});
  S.ctx.pending = {kind:"planConfirm", bloques};
  const txt = bloques.map((b,i)=>`${i+1}) ${b.hora} «${b.titulo}» (${b.dur} min)`).join(", ");
  return R(`Te propongo este plan para ${relDia(fecha)}: ${txt}. ${bloques.length<cands.length?"El resto lo dejamos para después. ":""}¿Lo agendo?`, {emo:"pensativa", cards:[{k:"plan", bloques}], chips:[{l:"Sí, agéndalo",say:"sí"},{l:"Ahora no",say:"#cancelar"}]});
}

const COACH_ESTRICTA = {

       (t,c)=>`Toc, toc. «${t}» (${c}). Confírmame que está hecho. 🐼` ],

       (t)=>`Ejem. «${t}». Sigue. Ahí. 😤 ¿Hecho o lo reprogramamos ya mismo?` ],
  3: [ (t)=>`¡${N()}! 😤😤 «${t}» no se va a hacer solo. Diez minutos, cronómetro y sin excusas. ¿Arrancamos?`,
       (t)=>`Modo entrenadora activado: «${t}» va ${S.tareas.find(x=>x.titulo===t)?.seg?.posp||0} veces pospuesta. Hoy no se escapa. ¿Empezamos o me dices qué te lo impide?` ]

const Coach = {
  cfg(){ return {...DEFAULT_PROFILE.ajustes.coach, ...(S.profile.ajustes.coach||{})}; },
  enSilencio(d=new Date()){ const a=S.profile.ajustes.silencioDesde||"23:00", b=S.profile.ajustes.silencioHasta||"07:00"; const m=d.getHours()*60+d.getMinutes(); const [ah,am]=a.split(":").map(Number), [bh,bm]=b.split(":").map(Number); const A_=ah*60+am, B_=bh*60+bm; return A_<=B_ ? (m>=A_ && m<B_) : (m>=A_ || m<B_); },
  enDescanso(){ const d=S.profile.descanso; return !!(d && d.hasta > Date.now()); },
  vence(t){ if(!t.vence) return null; return t.hora ? new Date(`${t.vence}T${t.hora}:00`) : (()=>{ const d=pymd(t.vence); d.setHours(19,0,0,0); return d; })(); },
  candidatas(){ const ahora=Date.now(), g=this.cfg().gracia*60000; return S.tareas.filter(t=>t.estado!=="hecha" && t.vence && !t.seg?.pausa && this.vence(t) && this.vence(t).getTime()+g<=ahora).sort((a,b)=>this.vence(a)-this.vence(b)); },
  pendientes(){ return this.candidatas().filter(t=>(t.seg?.nivel||0)>=1); },
  cuenta(){ const k="mila-coach-"+todayStr(); try{ return Number(localStorage.getItem(k)||0); }catch{ return 0; } },
  sumar(){ const k="mila-coach-"+todayStr(); try{ localStorage.setItem(k, String(this.cuenta()+1)); }catch{} },
  cuandoTxt(t){ const d=this.vence(t); return (sameDay(d,new Date())?"hoy":relDia(d)) + (t.hora?" a las "+h12(d):""); },
  // ¿qué le pasa? procrastinación, sobrecarga u obstáculo (y su ánimo de hoy) → adapta el tono
  lectura(t){
    const hoy=todayStr(); const venc=S.tareas.filter(x=>x.estado!=="hecha"&&x.vence&&x.vence<hoy).length, hoyN=S.tareas.filter(x=>x.estado!=="hecha"&&x.vence===hoy).length;

const IA = {
  cfg(){ const k = window.MilaApp?.Claves.get() || {}; const prov = k.llmProv || (k.claude ? "claude" : ""); return {prov, key: prov==="claude" ? k.claude : k.llmKey, model:k.llmModel||"", on: k.llmOn!==false}; },

  async modelos(prov, key){
    const P = PROVEEDORES[prov]; const r = await fetch(P.base+"/models", {headers:{Authorization:"Bearer "+key}});
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(r.status===401||r.status===403||r.status===400 ? "La clave no es válida para "+P.n+"." : (j?.error?.message||("Error "+r.status)));
    let ids = (j.data||j.models||[]).map(m=>({id:String(m.id||m.name||"").replace(/^models\//,""), tools: Array.isArray(m.supported_parameters) ? m.supported_parameters.includes("tools") : true}));

    return ids.map(m=>m.id);
  },
  elegirModelo(prov, ids){
    const P=PROVEEDORES[prov]; for(const p of P.pref){ const f = ids.find(i=>i===p) || ids.find(i=>i.startsWith(p)); if(f) return f; }
    return ids.find(i=>/gpt-oss-120b|70b|flash|large|qwen3|kimi|deepseek/.test(i) && !/vision|guard|embed|tts|whisper|audio|image|lite-preview/.test(i)) || ids.find(i=>!/guard|embed|tts|whisper|audio|image/.test(i)) || ids[0];

    const j = await r.json().catch(()=>({}));
    if(!r.ok){ const msg = j?.error?.message || j?.message || ("Error "+r.status);
      if(r.status===401||r.status===403) throw {fatal:true, message:`Tu clave de ${P.n} no funciona (${msg.slice(0,80)}). Revísala en Ajustes → Inteligencia.`};
      if(r.status===429){ this.pausaHasta = Date.now()+60000; throw {message:"Límite gratuito alcanzado por ahora"}; }
      if(r.status===404 || /model/i.test(msg)){ throw {message:"Modelo no disponible: "+msg}; }

  async responder(texto){

    for(let ronda=0; ronda<5; ronda++){

      if(!calls.length){ const t = limpiarRespuesta(m.content||""); return R(t.t || "Listo.", {emo:t.emo||"alegre", cards:this.cards}); }
      msgs.push({role:"assistant", content:m.content||"", tool_calls:calls});
      for(const call of calls){
        let out; try{ const tdef = TOOLS_IA.find(x=>x.name===call.function?.name); if(!tdef) throw new Error("herramienta desconocida");
          const args = JSON.parse(call.function.arguments||"{}"); out = await tdef.run(args); }
        catch(e){ out = {ok:false, error: errMsg(e)}; }
        msgs.push({role:"tool", tool_call_id:call.id, content: JSON.stringify(out).slice(0,6000)});
      }
    }
    return R("Listo.", {cards:this.cards});

  async responderClaude(texto){
    const sample = await window.claude.use("sample"); if(!sample) throw {fatal:true, message:"Falta tu clave de Claude en Ajustes."};

  activo:false, rec:null, manos:false, interino:"", pausado:false,
  disponible(){ return !!SR && !ES_BRAVE; },
  iniciar({manos=false}={}){
    if(!SR){ abrirSheet("mic"); return; }

    const r = new SR(); this.rec = r; r.lang = "es-PE"; r.interimResults = true; r.continuous = manos; r.maxAlternatives = 1;
    let final = ""; this.interino="";
    r.onresult = e => { let inter=""; for(let i=e.resultIndex;i<e.results.length;i++){ const x=e.results[i]; if(x.isFinal) final += x[0].transcript+" "; else inter += x[0].transcript; }
      this.interino = (final+inter).trim(); const q=$("#q"); if(q){ q.value=this.interino; autoAlto(q); }

  detener(){ this.manos=false; this.activo=false; try{ this.rec?.stop(); }catch{} pintarMic(); },
  pausar(){ if(this.manos && this.activo){ this.pausado=true; try{ this.rec?.stop(); }catch{} } },

function avisosMila(){
  const out=[]; const hoy=todayStr(); const ahora=new Date(); const h=ahora.getHours();
  const venc = S.tareas.filter(x=>x.estado!=="hecha" && x.vence && x.vence<hoy);
  if(venc.length) out.push({p:9, emo:"preocupada", t:`Tienes ${plural(venc.length,"tarea atrasada","tareas atrasadas")}. No pasa nada; reubiquémosla${venc.length>1?"s":""} para que no te pesen.`, acc:[["Pasarlas a hoy","say","pasa mis tareas vencidas para hoy"],["A mañana","say","pasa mis tareas vencidas para mañana"]]});
  const prox = eventosEntre(hoy, hoy, {tareas:false}).find(e=>!e.allDay && e.ini>ahora && (e.ini-ahora)<75*60000);
  if(prox) out.push({p:10, emo:"animada", t:`En ${cuentaAtras(prox.ini).replace("en ","")} empieza «${prox.titulo}». ${prox.lugar?"Es en "+prox.lugar+". ":""}¡Tú puedes!`, acc:[["Ver en agenda","go","agenda"]]});
  const ts = tareasDeHoy(); const hechasHoy = S.tareas.filter(x=>x.hecha_en && ymd(new Date(x.hecha_en))===hoy).length;
  if(!venc.length && ts.length>=5) out.push({p:6, emo:"pensativa", t:`Hoy tienes ${ts.length} tareas: es bastante. ¿Armamos un plan en bloques para que fluya?`, acc:[["Organiza mi día","say","organiza mi día"]]});
  if(hechasHoy>=3) out.push({p:5, emo:"animada", t:`¡Ya completaste ${hechasHoy} tareas hoy! Eso es constancia, ${N()}.`});
  const habP = S.habitos.filter(x=>!x.registros?.[hoy]); if(h>=19 && habP.length && S.habitos.length) out.push({p:6, emo:"alegre", t:`Te ${habP.length===1?"falta":"faltan"} ${habP.map(x=>"«"+x.nombre+"»").slice(0,2).join(" y ")} hoy. Aún estás a tiempo de mantener la racha.`});
  if(h>=18 && !S.animo.some(a=>a.id===hoy)) out.push({p:4, emo:"escuchando", t:"¿Cómo te sentiste hoy? Tócame una carita y lo guardo.", acc:[["Registrar ánimo","sheet","animo"]]});
  const mes=hoy.slice(0,7); const {g,i}=totalesMes(mes); if(i && g>i) out.push({p:7, emo:"preocupada", t:`Este mes gastaste ${money0(g)} y entraron ${money0(i)}. ¿Revisamos en qué se fue?`, acc:[["Ver mis finanzas","go","dinero"]]});
  for(const [c,lim] of Object.entries(S.profile.presupuestos||{})){ const u = sum(S.movimientos.filter(m=>m.tipo==="gasto"&&m.categoria===c&&m.fecha?.startsWith(mes)),m=>m.monto); if(lim && u>lim){ out.push({p:6, emo:"preocupada", t:`Pasaste tu presupuesto de ${c}: ${money0(u)} de ${money0(lim)}.`, acc:[["Ver Dinero","go","dinero"]]}); break; } }
  const meta = S.metas.filter(x=>x.estado==="activa" && x.ultima_vez && diffDays(pymd(x.ultima_vez), new Date())>=7)[0];
  if(meta) out.push({p:5, emo:"pensativa", t:`Hace ${diffDays(pymd(meta.ultima_vez), new Date())} días que no avanzas en «${meta.titulo}». ¿Un paso chiquito hoy?${meta.proxima_accion?` Por ejemplo: ${meta.proxima_accion}.`:""}`, acc:[["Agregarlo a hoy","say",`agrega tarea ${meta.proxima_accion||meta.titulo} para hoy`]]});
  if(Coach.cfg().estricto){ for(const o of out) if(o.emo==="preocupada") o.emo="enojada"; }
  if(!out.length){ out.push({p:1, emo:"alegre", t: ts.length ? `Lo más importante hoy: «${priorizar(ts)[0].titulo}». Empecemos por ahí.` : pick([`Día despejado, ${N()}. Buen momento para avanzar tu tesis o descansar sin culpa.`, "Todo en orden. ¿Quieres que planifiquemos algo bonito para hoy?"]) }); }
  return out.sort((a,b)=>b.p-a.p);
}
function lineaDia(fecha=todayStr(), {desde=6, hasta=24}={}){
  const evs = eventosEntre(fecha, fecha).filter(e=>!e.allDay && !e.alerta); const span=(hasta-desde)*60;
  const pos = d => clamp(((d.getHours()*60+d.getMinutes()) - desde*60)/span*100, 0, 100);
  const ahora = new Date(); const ahoraP = sameDay(pymd(fecha), ahora) ? pos(ahora) : null;
  const bloques = evs.map(e=>{ const a=pos(e.ini), b=pos(e.fin); return `<div class="ld-b ${e.tarea?"tarea":""}" style="left:${a}%;width:${Math.max(1.4,b-a)}%;--c:${catColor(e.cat)}" ${tipAttr(`${hhmm(e.ini)}–${hhmm(e.fin)} · ${e.titulo}`)} data-act="evAbrir" data-id="${esc(e.id)}"></div>`; }).join("");
  const marcas = [6,9,12,15,18,21,24].filter(x=>x>=desde&&x<=hasta).map(x=>`<span style="left:${(x-desde)/(hasta-desde)*100}%">${x===24?"0":x}h</span>`).join("");
  return `<div class="linea-dia"><div class="ld-track">${bloques}${ahoraP!=null?`<i class="ld-ahora" style="left:${ahoraP}%"></i>`:""}</div><div class="ld-marcas">${marcas}</div></div>`;
}

function caraSVG(k){
  const bocas = {genial:"M8 14.5 Q12 19 16 14.5", bien:"M8.5 15 Q12 17.5 15.5 15", normal:"M9 15.5 H15", cansada:"M9 16 Q12 15 15 16", estresada:"M8.5 16 Q10 14.5 12 16 Q14 17.5 15.5 16", triste:"M8.5 16.5 Q12 13.5 15.5 16.5"};
  const ojos = k==="cansada" ? `<path d="M7.5 10.5h3M13.5 10.5h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>` : k==="genial" ? `<path d="M7.5 11 Q9 9 10.5 11M13.5 11 Q15 9 16.5 11" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/>` : `<circle cx="9" cy="10.5" r="1.3" fill="currentColor"/><circle cx="15" cy="10.5" r="1.3" fill="currentColor"/>`;
  return `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="var(--c)" opacity=".9"/>${ojos}<path d="${bocas[k]||bocas.normal}" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>`;
}

/* =========================================================
   AGENDA · protagonista: día, 3 días, semana, mes y lista.
   Arrastra para mover, estira para cambiar duración,
   toca un hueco para crear.
   ========================================================= */
const Agenda = {
  drag:null,
  rango(){
    const a=S.agenda, d=startDay(a.date);
    if(a.view==="dia") return {dias:[d]};
    if(a.view==="3dias") return {dias:[0,1,2].map(i=>addDays(d,i))};
    if(a.view==="semana"){ const l=startWeek(d); return {dias:[...Array(7)].map((_,i)=>addDays(l,i))}; }
    if(a.view==="mes"){ const p=new Date(d.getFullYear(), d.getMonth(), 1); const ini=startWeek(p); const fin=addDays(startWeek(new Date(d.getFullYear(), d.getMonth()+1, 0)),6); const dias=[]; for(let x=ini; x<=fin; x=addDays(x,1)) dias.push(x); return {dias}; }
    return {dias:[...Array(30)].map((_,i)=>addDays(d,i))};
  },
  titulo(){
    const {dias}=this.rango(); const a=dias[0], b=dias[dias.length-1]; const v=S.agenda.view;
    if(v==="mes") return `${capital(MESES[S.agenda.date.getMonth()])} <span>${S.agenda.date.getFullYear()}</span>`;
    if(v==="dia") return `${capital(DIAS[a.getDay()])} ${a.getDate()} <span>de ${MESES[a.getMonth()]}</span>`;
    return a.getMonth()===b.getMonth() ? `${a.getDate()} – ${b.getDate()} <span>de ${MESES[a.getMonth()]}</span>` : `${a.getDate()} ${MESES[a.getMonth()].slice(0,3)} – ${b.getDate()} ${MESES[b.getMonth()].slice(0,3)}`;
  },
  mover(dir){ const a=S.agenda; const n = a.view==="dia"?1 : a.view==="3dias"?3 : a.view==="semana"?7 : a.view==="lista"?30 : 0;
    if(a.view==="mes") a.date = new Date(a.date.getFullYear(), a.date.getMonth()+dir, 1); else a.date = addDays(a.date, dir*n); render(); },
  montar(){
    const {dias}=this.rango(); const desde=ymd(dias[0]), hasta=ymd(dias[dias.length-1]);
    if(Cal.ok()) Cal.cargar(desde, hasta).catch(()=>{});
    const g = $(".ag-scroll"); if(g && !g.dataset.pos){ g.dataset.pos="1"; const h = dias.some(d=>sameDay(d,new Date())) ? Math.max(0,new Date().getHours()-2) : 7; g.scrollTop = h*S.agenda.hourH; }
    clearInterval(this.tick); this.tick = setInterval(()=>{ const l=$(".ahora-l"); if(!l){ clearInterval(this.tick); return; } const n=new Date(); l.style.top = ((n.getHours()*60+n.getMinutes())/60*S.agenda.hourH)+"px"; }, 60000);
  }
};
function layoutCols(evs){
  // reparte eventos superpuestos en columnas
  const res = new Map(); const ord = evs.slice().sort((a,b)=>a.ini-b.ini || (b.fin-b.ini)-(a.fin-a.ini));
  let grupo=[], finG=0;
  const cerrar = () => { const cols=[]; for(const e of grupo){ let c=cols.findIndex(f=>f<=e.ini); if(c<0){ c=cols.length; cols.push(0); } cols[c]=e.fin; res.set(e.id, {c}); } for(const e of grupo) res.get(e.id).n = cols.length; grupo=[]; };
  for(const e of ord){ if(grupo.length && e.ini>=finG){ cerrar(); finG=0; } grupo.push(e); finG = Math.max(finG, +e.fin); }
  if(grupo.length) cerrar(); return res;
}
function bloqueEv(e, col){
  const H=S.agenda.hourH; const top=(e.ini.getHours()*60+e.ini.getMinutes())/60*H; const dur=Math.max(15,(e.fin-e.ini)/60000); const h=Math.max(20, dur/60*H-2);
  const w = 100/col.n; const corto = h<38;
  return `<div class="ev ${e.tarea?"ev-tarea":""} ${corto?"corto":""} ${e.src==="g"?"g":""}" style="top:${top}px;height:${h}px;left:calc(${col.c*w}% + 2px);width:calc(${w}% - 4px);--c:${catColor(e.cat)}" data-ev="${esc(e.id)}" tabindex="0">
    <div class="ev-in"><b>${e.tarea?`<span class="ev-chk">${ICON.task}</span>`:""}${esc(e.titulo)}</b>${corto?"":`<small>${hhmm(e.ini)} – ${hhmm(e.fin)}${e.lugar?" · "+esc(e.lugar):""}</small>`}</div>
    ${e.propio!==false?`<i class="ev-resize" data-resize="1"></i>`:""}</div>`;
}
VISTAS.agenda = function(){

  const desde=ymd(dias[0]), hasta=ymd(dias[dias.length-1]);

      </div></header>`;
  let cuerpo="";
  if(a.view==="mes"){
    const evs = eventosEntre(desde, hasta); const mesAct = a.date.getMonth();
    cuerpo = `<div class="mes"><div class="mes-h">${["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].map(x=>`<span>${x}</span>`).join("")}</div><div class="mes-g">${dias.map(d=>{ const s=ymd(d); const del=evs.filter(e=>ymd(e.ini)<=s && ymd(e.allDay?addDays(e.fin,-1):e.fin)>=s); const tsS=S.tareas.filter(x=>x.estado!=="hecha"&&x.vence===s&&!x.hora);
      return `<div class="mes-d ${d.getMonth()!==mesAct?"fuera":""} ${sameDay(d,hoy)?"hoy":""}" data-act="agendaDia" data-v="${s}"><span class="mes-n">${d.getDate()}</span>
        ${del.slice(0,3).map(e=>`<span class="pill" style="--c:${catColor(e.cat)}" data-act="evAbrir" data-id="${esc(e.id)}">${e.allDay?"":`<i>${hhmm(e.ini)}</i>`}${esc(e.titulo)}</span>`).join("")}
        ${tsS.length && del.length<3?`<span class="pill tarea">${ICON.task}${plural(tsS.length,"tarea","tareas")}</span>`:""}${del.length>3?`<span class="mas">+${del.length-3}</span>`:""}</div>`; }).join("")}</div></div>`;
  } else if(a.view==="lista"){
    const evs = eventosEntre(desde, hasta).filter(e=>!e.alerta);
    const grupos = dias.map(d=>{ const s=ymd(d); return [d, evs.filter(e=>ymd(e.ini)===s || (e.allDay && ymd(e.ini)<=s && ymd(addDays(e.fin,-1))>=s))]; }).filter(([,l])=>l.length);
    cuerpo = grupos.length ? `<div class="ag-lista">${grupos.map(([d,l])=>`<div class="al-dia ${sameDay(d,hoy)?"hoy":""}"><div class="al-f"><b>${d.getDate()}</b><small>${DIAS_C[d.getDay()]} · ${MESES[d.getMonth()].slice(0,3)}</small></div><div class="al-evs">${l.map(e=>`<button type="button" class="al-ev" data-act="evAbrir" data-id="${esc(e.id)}" style="--c:${catColor(e.cat)}"><span class="al-h">${e.allDay?"Todo el día":hhmm(e.ini)+" – "+hhmm(e.fin)}</span><b>${esc(e.titulo)}</b><small>${e.tarea?"Tarea":CATS[e.cat]?.n||""}${e.lugar?" · "+esc(e.lugar):""}</small></button>`).join("")}</div></div>`).join("")}</div>`
      : vacio("agenda","Treinta días libres","No hay nada agendado. Dile a Mila «agenda clase de tesis el martes a las 7» o toca «Nuevo».", btn("Nuevo evento","sheetOpen",'data-v="evento"',"pri sm"));
  } else {
    const todos = eventosEntre(desde, hasta);

function miniMes(fecha){
  const d=startDay(fecha); const p=new Date(d.getFullYear(), d.getMonth(), 1); const ini=startWeek(p); const hoy=new Date();
  const conEv = new Set(eventosEntre(ymd(ini), ymd(addDays(ini,41))).map(e=>ymd(e.ini)));
  let cel=""; for(let i=0;i<42;i++){ const x=addDays(ini,i); const s=ymd(x); cel += `<button type="button" class="mm-d ${x.getMonth()!==p.getMonth()?"fuera":""} ${sameDay(x,hoy)?"hoy":""} ${sameDay(x,d)?"sel":""}" data-act="agendaDia" data-v="${s}">${x.getDate()}${conEv.has(s)?"<i></i>":""}</button>`; }
  return `<section class="card minimes"><div class="mm-h"><b>${capital(MESES[p.getMonth()])} ${p.getFullYear()}</b><span><button type="button" class="ib sm" data-act="mmPrev">${ICON.left}</button><button type="button" class="ib sm" data-act="mmNext">${ICON.right}</button></span></div><div class="mm-s">${DIAS_L.slice(1).concat(DIAS_L[0]).map(x=>`<span>${x}</span>`).join("")}</div><div class="mm-g">${cel}</div></section>`;
}

/* ---------- arrastrar, estirar y crear con el puntero ---------- */
(function(){
  let st=null;
  const snap = m => Math.round(m/15)*15;
  const colEn = x => $$(".ag-col").find(c=>{ const r=c.getBoundingClientRect(); return x>=r.left && x<=r.right; });
  const minEn = (col, y) => { const r=col.getBoundingClientRect(); return clamp(snap((y-r.top)/S.agenda.hourH*60), 0, 24*60-15); };
  document.addEventListener("pointerdown", e=>{
    if(S.route!=="agenda" || e.button>0) return;
    const ev = e.target.closest(".ev"); const col = e.target.closest(".ag-col");
    if(ev){ const id=ev.dataset.ev; const obj=buscarEvento(id); if(!obj) return;
      st = {tipo: e.target.dataset.resize ? "resize" : "mover", id, obj, el:ev, x0:e.clientX, y0:e.clientY, activo:false, dur:(obj.fin-obj.ini)/60000, off: minEn(ev.closest(".ag-col"), e.clientY) - (obj.ini.getHours()*60+obj.ini.getMinutes())};
      ev.setPointerCapture?.(e.pointerId); return; }
    if(col && !e.target.closest(".pill")){ st = {tipo:"crear", col, x0:e.clientX, y0:e.clientY, m0:minEn(col, e.clientY), activo:false}; }
  });
  document.addEventListener("pointermove", e=>{
    if(!st) return; const dx=e.clientX-st.x0, dy=e.clientY-st.y0;
    if(!st.activo){ if(Math.hypot(dx,dy)<6) return; if(st.tipo==="crear" && e.pointerType!=="mouse"){ st=null; return; } st.activo=true; Agenda.drag=true; document.body.classList.add("arrastrando"); if(st.el) st.el.classList.add("drag"); }
    e.preventDefault();
    const H=S.agenda.hourH;
    if(st.tipo==="mover"){ const col = colEn(e.clientX) || st.el.parentElement; if(col!==st.el.parentElement) col.appendChild(st.el);
      const m = clamp(minEn(col, e.clientY) - snap(st.off), 0, 24*60-st.dur); st.el.style.top = (m/60*H)+"px"; st.el.style.left="2px"; st.el.style.width="calc(100% - 4px)"; st.nuevo={dia:col.dataset.dia, m};
      st.el.querySelector("small") && (st.el.querySelector("small").textContent = `${pad(Math.floor(m/60))}:${pad(m%60)} – ${pad(Math.floor((m+st.dur)/60)%24)}:${pad((m+st.dur)%60)}`); }
    else if(st.tipo==="resize"){ const col=st.el.parentElement; const ini=st.obj.ini.getHours()*60+st.obj.ini.getMinutes(); const m = Math.max(ini+15, minEn(col, e.clientY)); st.el.style.height=((m-ini)/60*H-2)+"px"; st.nuevo={fin:m}; }
    else if(st.tipo==="crear"){ const m=minEn(st.col, e.clientY); const a=Math.min(st.m0,m), b=Math.max(st.m0+15,m+15); let g=st.col.querySelector(".ev-nuevo"); if(!g){ g=document.createElement("div"); g.className="ev ev-nuevo"; st.col.appendChild(g); } g.style.top=(a/60*H)+"px"; g.style.height=((b-a)/60*H)+"px"; g.innerHTML=`<div class="ev-in"><b>Nuevo</b><small>${pad(Math.floor(a/60))}:${pad(a%60)} – ${pad(Math.floor(b/60))}:${pad(b%60)}</small></div>`; st.nuevo={a,b}; }
  }, {passive:false});
  document.addEventListener("pointerup", async e=>{
    if(!st) return; const s=st; st=null; document.body.classList.remove("arrastrando");
    if(!s.activo){ Agenda.drag=null;
      if(s.tipo==="mover"||s.tipo==="resize"){ abrirSheet("evDetalle", {id:s.id}); }
      else if(s.tipo==="crear"){ const m=s.m0; const f=s.col.dataset.dia; abrirSheet("evento", {fecha:f, hora:`${pad(Math.floor(m/60))}:${pad(Math.floor((m%60)/30)*30)}`}); }
      return; }
    Agenda.drag=null;
    try{
      if(s.tipo==="mover" && s.nuevo){ const ini = pymd(s.nuevo.dia); ini.setHours(Math.floor(s.nuevo.m/60), s.nuevo.m%60, 0, 0); if(+ini!==+s.obj.ini){ const r=await A.editarEvento(s.id, {ini:ini.toISOString()}); toast(`«${s.obj.titulo}» → ${relDia(ini)} ${hhmm(ini)}`, {undo:r.log, icon:ICON.cal}); } }
      else if(s.tipo==="resize" && s.nuevo){ const fin = new Date(s.obj.ini); fin.setHours(0,0,0,0); fin.setMinutes(s.nuevo.fin); const r=await A.editarEvento(s.id, {ini:s.obj.ini.toISOString(), fin:fin.toISOString()}); toast(`«${s.obj.titulo}» hasta las ${hhmm(fin)}`, {undo:r.log, icon:ICON.clock}); }
      else if(s.tipo==="crear" && s.nuevo){ const f=s.col.dataset.dia; abrirSheet("evento", {fecha:f, hora:`${pad(Math.floor(s.nuevo.a/60))}:${pad(s.nuevo.a%60)}`, fin:`${pad(Math.floor(s.nuevo.b/60)%24)}:${pad(s.nuevo.b%60)}`}); }
    }catch(err){ toast("No pude moverlo: "+errMsg(err)); }
    render(true);
  });
  document.addEventListener("keydown", e=>{ if(S.route!=="agenda" || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName) || !$("#sheetWrap").hidden) return; if(e.key==="ArrowLeft") Agenda.mover(-1); if(e.key==="ArrowRight") Agenda.mover(1); if(e.key==="t") { S.agenda.date=new Date(); render(); } });
})();

function gruposTareas(lista){
  const hoy=todayStr(), man=ymd(addDays(new Date(),1)), sem=ymd(addDays(new Date(),7));
  const g = {atrasadas:[], hoy:[], manana:[], semana:[], luego:[], sinfecha:[]};
  for(const x of lista){ if(!x.vence) g.sinfecha.push(x); else if(x.vence<hoy) g.atrasadas.push(x); else if(x.vence===hoy) g.hoy.push(x); else if(x.vence===man) g.manana.push(x); else if(x.vence<=sem) g.semana.push(x); else g.luego.push(x); }
  for(const k in g) g[k] = priorizar(g[k]);
  return g;
}

  } else {
    const d=new Date(); const m0=new Date(d.getFullYear(), d.getMonth(), 1); const ini=startWeek(m0); const reg = Object.fromEntries(S.animo.map(a=>[a.id,a]));
    const ult30 = [...Array(30)].map((_,k)=>{ const x=addDays(d,k-29); const a=reg[ymd(x)]; return a?moodDe(a.estado).v:null; });
    const dist = MOODS.map(m=>[m, S.animo.filter(a=>a.estado===m.k && a.id>=ymd(addDays(d,-30))).length]);
    const totD = sum(dist, x=>x[1]);
    let cel=""; for(let i=0;i<42;i++){ const x=addDays(ini,i); if(i>=35 && x.getMonth()!==m0.getMonth()) break; const a=reg[ymd(x)]; cel += `<div class="am-d ${x.getMonth()!==m0.getMonth()?"fuera":""} ${sameDay(x,d)?"hoy":""}" ${a?tipAttr(`${fmtDia(x)}: ${moodDe(a.estado).l}${a.nota?" · "+a.nota.slice(0,60):""}`):""}>${a?`<span class="cara" style="--c:${moodDe(a.estado).c}">${caraSVG(a.estado)}</span>`:`<small>${x.getDate()}</small>`}</div>`; }
    cuerpo = `<div class="animo-l">
      <section class="card"><div class="card-h"><h3>${capital(MESES[d.getMonth()])}</h3><div class="card-acc">${btn("Registrar hoy","sheetOpen",'data-v="animo"',"sm pri")}</div></div><div class="am-s">${["L","M","M","J","V","S","D"].map(x=>`<span>${x}</span>`).join("")}</div><div class="am-g">${cel}</div></section>
      <section class="card"><div class="card-h"><h3>Últimos 30 días</h3></div>${ult30.some(v=>v!=null) ? lineChart([{name:"Ánimo", color:"#8E6CFF", values:ult30}], {h:150, labels:[...Array(30)].map((_,k)=>{ const x=addDays(d,k-29); return x.getDate()===1||k===0||k===29?`${x.getDate()}/${x.getMonth()+1}`:""; }), fmt:v=>(MOODS.find(m=>m.v===Math.round(v))||{l:v}).l, max:5, min:1})
        + `<div class="dist">${dist.filter(x=>x[1]).map(([m,n])=>`<span style="flex:${n};background:${m.c}" ${tipAttr(`${m.l}: ${n} ${n===1?"día":"días"}`)}></span>`).join("")}</div><div class="ley-l">${dist.filter(x=>x[1]).map(([m,n])=>`<span class="ley"><i style="background:${m.c}"></i>${m.l} ${Math.round(n/totD*100)}%</span>`).join("")}</div>`
        : vacio("memoria","Tu mapa de ánimo empieza hoy","Registra cómo te sientes cada día; con el tiempo verás patrones (¿los lunes pesan más?).", btn("Registrar hoy","sheetOpen",'data-v="animo"',"pri sm"))}</section></div>`;
  }
  return `${cab("Hábitos y metas", "Lo que haces cada día construye lo que logras", tabs, "crecer")}${cuerpo}`;
};
function tarjetaMeta(g){
  const p = Number(g.progreso)||0; const dias = g.ultima_vez ? diffDays(pymd(g.ultima_vez), new Date()) : null; const c=catColor(areaCat(g.area||g.titulo));
  const lim = g.fecha_limite ? diffDays(new Date(), pymd(g.fecha_limite)) : null;

    <input type="range" min="0" max="100" step="5" value="${p}" class="rango" data-act="metaProg" data-id="${g.id}" aria-label="Progreso" style="--p:${p}%">

    ${(g.avances||[]).length?`<div class="mt-hist">${(g.avances||[]).slice(-3).reverse().map(a=>`<span><i></i>${capital(relDia(a.fecha))}${a.texto?" · "+esc(a.texto.slice(0,60)):""}</span>`).join("")}</div>`:""}

  const pref = S.profile.frase?.cats||[]; let l = frasesTodas(); if(pref.length) { const f=l.filter(x=>pref.includes(x.cat)); if(f.length) l=f; }
  const d=new Date(); const seed = d.getFullYear()*372 + d.getMonth()*31 + d.getDate();
  return l[(seed*7 + offset*13) % l.length];
}
// mensajes personalizados según tus metas, hábitos y avances reales
function mensajesParaTi(){
  const out=[]; const c=Coach.mensaje(); if(c) out.push(c.t);
  const g=S.metas.filter(x=>x.estado==="activa").sort((a,b)=>(a.ultima_vez||"").localeCompare(b.ultima_vez||""))[0];
  if(g){ const d=g.ultima_vez?diffDays(pymd(g.ultima_vez), new Date()):null; out.push(d>=5 ? `Hace ${d} días que no tocas «${g.titulo}». No hace falta mucho: ${g.proxima_accion||"un paso de 10 minutos"} y ya se mueve.` : `Vas bien con «${g.titulo}». Sigue así: el progreso pequeño también suma.`); }
  const h=S.habitos.find(x=>!x.registros?.[todayStr()]); if(h) out.push(`Aún puedes cumplir «${h.nombre}» hoy. Un hábito se gana en los días normales.`);
  const hechas=S.tareas.filter(x=>x.hecha_en && Date.now()-x.hecha_en<86400000).length; if(hechas) out.push(`Hoy ya tachaste ${plural(hechas,"tarea","tareas")}. Eso cuenta, ${N()}.`);
  const chip = S.frases.find(f=>f.cat==="Mis chips" && f.situacion); if(chip) out.push(`Tu chip mental para «${chip.situacion.toLowerCase()}»: ${chip.texto}`);
  return out.slice(0,4);
}

  </section>
  ${para.length?`<section class="card para-ti"><div class="card-h"><span class="card-ic">${ICON.spark}</span><h3>Mila te dice</h3><div class="card-acc"><span class="mini">Según tus metas y avances reales</span></div></div><div class="pt-l">${para.map(t=>`<div class="pt-i"><span class="mila-host" data-emo="alegre"></span><p>${esc(t)}</p></div>`).join("")}</div></section>`:""}

/* =========================================================
   MEMORIA · lo que Mila sabe de ti (buscar, filtrar, corregir, olvidar)
   Fuentes: lo que tú le dices, tus hojas (PROYECTO_LUZMILA, Taller del Zorro, Culta)
   y lo que autorices importar de la memoria de Claude.
   ========================================================= */
const MEM_CATS = ["Personalidad","Proyectos","Metas","Estudios","Prácticas","Familia","Salud y energía","Gustos","Valores","Rutinas","General"];
const MEM_TIPOS = {preferencia:"Gusto", persona:"Persona", hecho:"Dato", objetivo:"Objetivo", rutina:"Rutina", decision:"Decisión", proyecto:"Proyecto", suposicion:"Suposición", rasgo:"Rasgo"};
function memCat(m){ if(MEM_CATS.includes(m.area)) return m.area; const t=norm(m.texto+" "+(m.area||""));
  if(/tesis|universidad|ciclo|curso|clase|estudi|unjbg|culta/.test(t)) return "Estudios"; if(/practica|roqaseg|trabajo|jefe/.test(t)) return "Prácticas";
  if(/mama|papa|herman|familia/.test(t)) return "Familia"; if(/proyecto|zorro|sistema|fase/.test(t)) return "Proyectos"; if(/meta|objetivo|quiero lograr/.test(t)) return "Metas";
  if(/me gusta|me encanta|prefiero|favorit|odio|no me gusta/.test(t)) return "Gustos"; if(/energia|dormir|sueno|salud|comida|ritual/.test(t)) return "Salud y energía";
  if(/soy |me cuesta|tiendo|personalidad|humor|timida|miedo/.test(t)) return "Personalidad"; return "General"; }
function memFuente(m){ const f=norm(m.fuente||""); return /claude/.test(f)?"Memoria de Claude": /hoja|proyecto_luzmila|zorro|culta|sheet/.test(f)?"Tus hojas": "Me lo dijiste"; }
VISTAS.memoria = function(){
  const U=S.memUI; const q=norm(U.q);
  let l = S.memorias.slice().sort((a,b)=>(b.actualizado||b.creado||0)-(a.actualizado||a.creado||0));
  const conteo = c => S.memorias.filter(m=>memCat(m)===c).length;
  if(q) l = l.filter(m=>norm(m.texto+" "+(m.area||"")+" "+(m.fuente||"")).includes(q));
  if(U.cat) l = l.filter(m=>memCat(m)===U.cat); if(U.fuente) l = l.filter(m=>memFuente(m)===U.fuente);
  const grupos = groupBy(l, memCat);
  const fuentes = ["Me lo dijiste","Tus hojas","Memoria de Claude"];
  return `${cab("Lo que sé de ti", `${plural(S.memorias.length,"dato","datos")} que Mila usa para ayudarte. Tú decides qué se queda.`, btn(ICON.plus+" Enséñame algo","sheetOpen",'data-v="memoria"',"pri")+btn(ICON.brain+" Importar de Claude","sheetOpen",'data-v="claudeMem"'))}
  <div class="mem-top card">
    <label class="buscar grande">${ICON.search}<input id="memBuscar" placeholder="Busca: tesis, mamá, lúcuma, Zorro…" value="${esc(U.q)}"></label>
    <div class="chips">${`<button type="button" class="chip ${!U.cat?"on":""}" data-act="memCat" data-v="">Todo<span>${S.memorias.length}</span></button>`+MEM_CATS.filter(conteo).map(c=>`<button type="button" class="chip ${U.cat===c?"on":""}" data-act="memCat" data-v="${esc(c)}">${esc(c)}<span>${conteo(c)}</span></button>`).join("")}</div>
    <div class="chips sm">${fuentes.map(f=>`<button type="button" class="chip ${U.fuente===f?"on":""}" data-act="memFuente" data-v="${esc(f)}">${f==="Memoria de Claude"?ICON.brain:f==="Tus hojas"?ICON.sheet:ICON.user}${f}</button>`).join("")}</div>
  </div>
  ${l.length ? `<div class="mem-g">${Object.entries(grupos).map(([k,ms])=>`<section class="card"><div class="card-h"><h3>${esc(k)}</h3><span class="cnt">${ms.length}</span></div>${ms.map(m=>`<div class="mem ${m.confianza==="inferido"?"inf":""}"><div class="grow"><p>${esc(m.texto)}</p><small>${esc(MEM_TIPOS[m.tipo]||capital(m.tipo||"Dato"))} · ${esc(memFuente(m))}${m.confianza==="inferido"?" · por confirmar":""}</small></div><span class="mem-acc"><button type="button" class="ib sm" data-act="memEditar" data-id="${m.id}" title="Corregir">${ICON.edit}</button><button type="button" class="ib sm" data-act="memOlvidar" data-id="${m.id}" title="Olvidar">${ICON.trash}</button></span></div>`).join("")}</section>`).join("")}</div>`
    : vacio("memoria", q||U.cat||U.fuente?"Nada coincide":"Aún no sé mucho de ti", q||U.cat||U.fuente?"Prueba otra búsqueda o quita los filtros.":"Dime cosas como «me encanta la lúcuma» o importa tu paquete en Ajustes → Importar.")}
  <section class="card mem-nota"><div class="card-h"><span class="card-ic">${ICON.shield}</span><h3>Sobre la memoria de Claude</h3></div>
    <p class="mini">La memoria de tus chats en claude.ai no tiene una conexión directa con Mila. Para traerla: en claude.ai pídele a Claude «resume lo que recuerdas de mí en una lista», copia la respuesta y pégala en <b>Importar de Claude</b>. Verás cada dato y eliges cuáles guardar. Lo que Claude Code ya sabe de ti viene en tu paquete privado de importación.</p></section>`;
};

function partirMemoria(txt){
  return String(txt||"").split(/\r?\n|(?<=[.!?])\s+(?=[A-ZÁÉÍÓÚÑ])/).map(s=>s.replace(/^[\s•\-–*·\d.)]+/,"").trim()).filter(s=>s.length>6 && s.length<400 && !/^(claro|aqu[ií] (tienes|est[aá])|esto es lo que|resumen)/i.test(s));
}

/* =========================================================
   PROGRESO · gráficos con tus datos reales
   ========================================================= */
VISTAS.progreso = function(){
  const hoy=new Date(); const sem = [...Array(8)].map((_,k)=>{ const ini=addDays(startWeek(hoy), (k-7)*7); return {ini, fin:addDays(ini,6)}; });
  const hechasPorSem = sem.map(s=>S.tareas.filter(x=>x.hecha_en && new Date(x.hecha_en)>=s.ini && new Date(x.hecha_en)<addDays(s.fin,1)).length);
  const creadasPorSem = sem.map(s=>S.tareas.filter(x=>x.creado && new Date(x.creado)>=s.ini && new Date(x.creado)<addDays(s.fin,1)).length);
  const lbl = sem.map(s=>`${s.ini.getDate()}/${s.ini.getMonth()+1}`);
  // hábitos: % cumplido por semana
  const habSem = sem.map(s=>{ if(!S.habitos.length) return null; let ok=0, tot=0; for(let d=new Date(s.ini); d<=s.fin && d<=hoy; d=addDays(d,1)){ for(const h of S.habitos){ if(h.creado && new Date(h.creado)>addDays(d,1)) continue; tot++; if(h.registros?.[ymd(d)]) ok++; } } return tot?Math.round(ok/tot*100):null; });
  // tiempo agendado por categoría (esta semana)
  const ws=startWeek(hoy); const evs = eventosEntre(ymd(ws), ymd(addDays(ws,6))).filter(e=>!e.allDay && !e.alerta);
  const porCat = Object.entries(groupBy(evs, e=>e.cat)).map(([c,l])=>({l:CATS[c]?.n||c, v:round2(sum(l,e=>(e.fin-e.ini)/3600000)), c:catColor(c)})).sort((a,b)=>b.v-a.v);
  const horas = sum(porCat, x=>x.v);
  // actividad diaria (todo lo que registraste)
  const act = {}; const add = (ts) => { if(!ts) return; const k = typeof ts==="string" ? ts.slice(0,10) : ymd(new Date(ts)); act[k]=(act[k]||0)+1; };
  S.tareas.forEach(x=>add(x.hecha_en)); S.movimientos.forEach(m=>add(m.creado)); S.recuerdos.forEach(r=>add(r.creado)); S.habitos.forEach(h=>Object.keys(h.registros||{}).forEach(add)); S.animo.forEach(a=>add(a.id));
  const diasActivos = Object.keys(act).filter(k=>k>=ymd(addDays(hoy,-30))).length;
  // gastos por categoría en 6 meses
  const meses6 = [...Array(6)].map((_,k)=>mesMas(ymd(hoy).slice(0,7),k-5)); const cats = Object.keys(CAT_COL);
  const gm = meses6.map(m=>totalesMes(m).ms.filter(x=>x.tipo==="gasto"));
  const topCats = cats.map(c=>[c, sum(gm.flat().filter(m=>m.categoria===c),m=>m.monto)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]);
  const animo30 = [...Array(30)].map((_,k)=>{ const a=S.animo.find(x=>x.id===ymd(addDays(hoy,k-29))); return a?moodDe(a.estado).v:null; });
  const hayTareas = hechasPorSem.some(Boolean) || creadasPorSem.some(Boolean);
  return `${cab("Progreso", "Cómo vas, con tus datos reales")}
  <div class="kpis">

   - Bloqueo opcional con PIN, exportar y borrar; nunca aparece en notificaciones

const FLUJOS = [[0,"Nada"],[1,"Manchado"],[2,"Leve"],[3,"Medio"],[4,"Abundante"]];
const SINTOMAS = ["Cólicos","Dolor de cabeza","Hinchazón","Sensibilidad en el pecho","Dolor lumbar","Cansancio","Antojos","Acné","Náuseas","Insomnio","Cambios de humor","Tranquila, sin síntomas"];
function periodosOrden(){ return S.ciclo.filter(p=>p.inicio).slice().sort((a,b)=>a.inicio.localeCompare(b.inicio)); }
function finEfectivo(p){ if(p.fin) return p.fin; const d=diffDays(pymd(p.inicio), new Date()); return d<=10 ? todayStr() : ymd(addDays(pymd(p.inicio), 4)); }
function cicloStats(){
  const ps = periodosOrden(); const largos=[]; const atip=[];
  for(let i=1;i<ps.length;i++){ const n=diffDays(pymd(ps[i-1].inicio), pymd(ps[i].inicio)); (n>=18 && n<=50 ? largos : atip).push(n); }
  const durs = ps.filter(p=>p.fin).map(p=>diffDays(pymd(p.inicio), pymd(p.fin))+1).filter(n=>n>=1&&n<=12);
  const media = a => a.length ? a.reduce((s,x)=>s+x,0)/a.length : null;
  const m=media(largos), sd = largos.length>1 ? Math.sqrt(largos.reduce((s,x)=>s+(x-m)**2,0)/(largos.length-1)) : null;
  const dur = media(durs);
  let prox=null;
  if(ps.length>=3 && largos.length>=2){
    const ult = pymd(ps[ps.length-1].inicio); let ini = addDays(ult, Math.round(m));
    while(ini < startDay(new Date()) && diffDays(ini, new Date())>Math.round(m)/2) ini = addDays(ini, Math.round(m));
    const marg = Math.max(2, Math.round(sd||0)+1);
    prox = { ini, desde:addDays(ini,-marg), hasta:addDays(ini,marg), marg, dur:Math.round(dur||5),
      confianza: largos.length>=6 && (sd||0)<=3 ? "más estable" : largos.length>=3 ? "moderada" : "baja", irregular:(sd||0)>7 || atip.length>0 };
  }
  const actual = ps.length ? ps[ps.length-1] : null; const enCurso = actual && !actual.fin && diffDays(pymd(actual.inicio), new Date())<=10;
  const diaCiclo = actual ? diffDays(pymd(actual.inicio), new Date())+1 : null;
  return {ps, largos, atip, media:m, sd, dur, prox, enCurso, diaCiclo};
}
function diaEnPeriodo(s){ return S.ciclo.find(p=>p.inicio && s>=p.inicio && s<=finEfectivo(p)); }
async function sha(s){ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode("mila:"+s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }

async function exportar(){
  const data = window.MilaApp?.LocalDB?.exportar() || {}; const blob = new Blob([JSON.stringify({app:"mila", v:8, at:new Date().toISOString(), tree:data}, null, 1)], {type:"application/json"});
  const a = document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`mila-copia-${todayStr()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000); toast("Copia descargada");
}
async function importar(file){
  try{ const j = JSON.parse(await file.text()); const tree = j.tree || j; const entries = Object.entries(tree).filter(([k])=>k.startsWith("data/"));
    if(!entries.length) throw new Error("Ese archivo no parece una copia de Mila."); window.MilaApp.LocalDB.importar("", entries); toast(`Importé ${entries.length} elementos`); }
  catch(e){ toast("No pude importar: "+errMsg(e)); }
}

/* ---------- tu foto: recorte cuadrado en el navegador (nada sale de tu equipo) ---------- */
const FotoEd = { img:null, z:1.15, x:0, y:-.12 };
function fotoCargar(file){
  if(!file || !/^image\//.test(file.type)) return toast("Elige una imagen (JPG o PNG).");
  const url=URL.createObjectURL(file); const img=new Image(); img.onload=()=>{ FotoEd.img=img; FotoEd.z=1.15; FotoEd.x=0; FotoEd.y= img.height>img.width ? -.14 : 0; abrirSheet("foto"); setTimeout(fotoPintar, 60); }; img.onerror=()=>toast("No pude abrir esa imagen."); img.src=url;
}
function fotoRender(size=480){
  const {img,z,x,y}=FotoEd; if(!img) return ""; const c=document.createElement("canvas"); c.width=c.height=size; const g=c.getContext("2d");
  const lado=Math.min(img.width,img.height)/z; const cx=img.width/2 + x*img.width/2, cy=img.height/2 + y*img.height/2;
  const sx=clamp(cx-lado/2, 0, img.width-lado), sy=clamp(cy-lado/2, 0, img.height-lado);
  g.imageSmoothingQuality="high"; g.drawImage(img, sx, sy, lado, lado, 0, 0, size, size); return c.toDataURL("image/jpeg", .86);
}
function fotoPintar(){ const p=$("#fotoPrev"); if(p) p.src=fotoRender(320); }
